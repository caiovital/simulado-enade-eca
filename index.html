{ ano: 2014, n: 'D3', area: 'ctrl', titulo: 'Identificação e controle PI de chuveiro elétrico',
  stem: `<p>Considere um chuveiro elétrico no qual a temperatura da água pode ser selecionada pelo usuário entre a temperatura ambiente e 50 ºC. A resistência do chuveiro dissipa energia elétrica em forma de calor para aquecer a água, e é alimentada por um conversor CA/CC, de modo que a tensão pode ser alterada, variando, assim, a potência.</p>
<p>Para levantar a característica dinâmica do sistema, um engenheiro aplicou um degrau de 0 V a 40 V no instante 10 segundos, com vazão de água constante, obtendo a resposta de temperatura mostrada na figura a seguir. Pode-se observar que, inicialmente, a água está em temperatura ambiente.</p>
${fig('y14_d3.png', 'Resposta ao degrau: temperatura em 25 °C até 10 s, sobe e estabiliza em 35 °C por volta de 30 s', 'Resposta ao degrau do sistema em malha aberta não controlado.')}
<p>Posteriormente, o engenheiro decidiu implementar um controle de temperatura em malha fechada utilizando um compensador proporcional-integral: G<sub>c</sub>(s) = K<sub>p</sub> + K<sub>i</sub>/s.</p>
<p>Com base nos dados apresentados, e considerando que o sistema é linear e de primeira ordem, faça o que se pede nos itens a seguir.</p>`,
  itens: [
    { id: 'a', txt: 'Obtenha a função de transferência de malha aberta (sem o controlador) que relaciona a tensão de entrada com a temperatura de saída. (valor: 6,0 pontos)',
      padrao: `<p>Com base na figura, o estudante deve reconhecer que a resposta pode ser aproximada por um sistema de 1ª ordem, cuja função de transferência é G(s) = K/(τs + 1).</p>
<p>Para calcular o ganho K basta visualizar a amplitude da variação da saída (10 °C) dividida pela variação da entrada (40 V): K = (35 − 25)/(40 − 0) = 0,25 °C/V.</p>
<p>A constante de tempo pode ser obtida observando o tempo que a resposta demora para atingir aproximadamente 63% do valor final: 0,63(35 − 25) + 25 = 31,3 °C, pois a excursão é de 10 °C e o valor inicial é 25 °C. Assim, τ = 15 s (tempo para 31,3 °C) − 10 s (tempo inicial) = 5 s.</p>
<p>Esse valor também poderia ser obtido reconhecendo que um sistema de 1ª ordem demora cinco constantes de tempo para atingir praticamente 100% da resposta final: 5τ = 35 − 10 ∴ τ = 5 s.</p>
<p>Assim, a função de transferência na forma final é G(s) = T(s)/V(s) = 0,25/(5s + 1) = 0,05/(s + 0,2).</p>`,
      check: [ { p: 1.5, t: 'Identificou o modelo de 1ª ordem G(s) = K/(τs + 1).' },
               { p: 2.0, t: 'Calculou o ganho K = 10 °C / 40 V = 0,25 °C/V.' },
               { p: 2.0, t: 'Obteve τ = 5 s (63% em ≈ 31,3 °C, ou 5τ ≈ 25 s).' },
               { p: 0.5, t: 'Escreveu G(s) = 0,25/(5s + 1).' } ] },
    { id: 'b', txt: 'Qual é o efeito da ação integradora do compensador no sistema em malha fechada? (valor: 4,0 pontos)',
      padrao: `<p>A ação integradora anula o erro estacionário.</p>
<p>A característica fundamental da ação integradora, em sistemas de controle estáveis, é a tendência de minimização do erro estacionário (em regime permanente) para entrada em degrau. Neste caso, um sistema de 1ª ordem estável em malha aberta, quando a malha é fechada com um controlador PI, utilizando realimentação unitária, o sistema resultante é estável, e elimina o erro estacionário para a entrada em degrau.</p>`,
      check: [ { p: 2.5, t: 'Afirmou que a ação integral elimina o erro em regime permanente para referência em degrau.' },
               { p: 1.5, t: 'Justificou (polo na origem / sistema tipo 1, malha fechada estável).' } ] }
  ] },

{ ano: 2014, n: 'D4', area: 'ctrl', titulo: 'Perícia em balança rodoviária',
  stem: `<p>Em determinada rodovia, a pesagem obrigatória de caminhões é realizada por balanças automatizadas. Além da plataforma e do indicador como itens básicos da balança rodoviária, o sistema de pesagem é constituído por diversos componentes, conforme ilustrado na figura abaixo.</p>
${fig('y14_d4.png', 'Balança rodoviária com semáforos, fotocélulas, cancelas, display remoto, identificação de veículos e emissão de tíquete', 'Balança para pesagem do caminhão.')}
<p class="src">Disponível em: &lt;http://balancasacores.com.br&gt;. Acesso em: 29 jul. 2014 (adaptado).</p>
<p>No momento da pesagem, o caminhão desloca-se por uma pequena inclinação e acomoda-se para que a medição seja realizada e registrada. Assim, do solo até a acomodação do caminhão, o sinal aplicado à balança pode ser aproximado por um degrau unitário.</p>
<p>Suponha que o caminhão de uma empresa de transporte de cargas tenha passado por duas balanças em uma rodovia com pesagem automatizada. O gerente da empresa constatou que o caminhão havia sido multado na segunda balança, após ter sido liberado pela primeira. Para recorrer da multa, solicitou-se parecer de um perito com relação ao sistema de controle de pesagem das balanças. Para análise e emissão do laudo, o perito recebeu do fabricante da balança a sua função de transferência, representada por:</p>
<p class="eq center">indicação balança(s) / peso caminhão(s) = 16 / (s² + 4s + 16)</p>
<p>Suponha, ainda, que a empresa responsável pela manutenção do sistema de aquisição de dados informou ao perito que, na primeira balança, o peso é adquirido 3 s após a entrada do caminhão e, na segunda balança, 1,2 s após a entrada do veículo. Considere que, no percurso entre as balanças, não houve variação de carga no caminhão, que as diferenças causadas pelo consumo de combustível são desprezíveis e que o peso é fixado após a acomodação do sistema.</p>
<p>Considere as seguintes informações complementares, para um sistema de 2ª ordem G(s) = ω<sub>n</sub>² / (s² + 2ζω<sub>n</sub>s + ω<sub>n</sub>²):</p>
<p class="eq">Sobressinal máximo: M<sub>p</sub> = e<sup>−ζπ/√(1−ζ²)</sup><br>Tempo de pico: t<sub>p</sub> = π / (ω<sub>n</sub>√(1−ζ²))<br>Tempo de acomodação: t<sub>s</sub> = 4 / (ζω<sub>n</sub>)</p>
<p>Com base na situação proposta, faça o que se pede nos itens a seguir.</p>`,
  itens: [
    { id: 'a', txt: 'Demonstre a partir de qual instante de tempo se garante que a medida das balanças estará adequada. (valor: 6,0 pontos)',
      padrao: `<p>Comparando a função de transferência da balança com a equação característica de um sistema de 2º ordem: ω<sub>n</sub>² = 16. Logo, ω<sub>n</sub> = 4 rad/s e 2ζω<sub>n</sub> = 4. Portanto, ζ = 0,5.</p>
<p>Desta forma, o tempo de acomodação pode ser obtido: t<sub>s</sub> = 4/(ζω<sub>n</sub>) = 2 s.</p>
<p>Portanto, a partir de 2 s, a medida estará adequada.</p>`,
      check: [ { p: 2.0, t: 'Identificou ωn² = 16 → ωn = 4 rad/s.' },
               { p: 2.0, t: 'Obteve ζ = 0,5 a partir de 2ζωn = 4.' },
               { p: 2.0, t: 'Calculou ts = 4/(ζωn) = 2 s.' } ] },
    { id: 'b', txt: 'Na qualidade de perito contratado, apresente seu parecer para o caso, justificando-o com base em dados técnicos. (valor: 4,0 pontos)',
      padrao: `<p>O sistema de pesagem da balança apresenta medida confiável após o tempo de acomodação do sistema, que é de 2 s. Como a medida da segunda balança é realizada após 1,2 s, que é menor que o tempo de acomodação do sistema, a medida obtida desta balança não é confiável. Por outro lado, a medida da primeira balança é adequada, pois é realizada após 3 s, que é maior que o tempo de acomodação da balança.</p>
<p>Portanto, a multa emitida é indevida, uma vez que o valor medido pela segunda balança não é confiável.</p>`,
      check: [ { p: 1.5, t: 'Comparou os tempos: 3 s > 2 s (1ª balança confiável) e 1,2 s < 2 s (2ª balança não acomodada).' },
               { p: 1.0, t: 'Observou que perto de 1,2 s a resposta subamortecida está perto do pico (tp ≈ 0,9 s, Mp ≈ 16%), superestimando o peso.' },
               { p: 1.5, t: 'Concluiu que a multa é indevida.' } ] }
  ] },

{ ano: 2014, n: 'D5', area: 'rob', titulo: 'Substituição de operadores por robô manipulador',
  stem: `<p>Considere que em uma célula de produção de determinada fábrica opera-se todos os dias em 3 turnos (4 funcionários, um por turno e um para revesamento) para executar os planos de produção de uma família de peças. O proprietário da fábrica, que possui conhecimento na área de automação, está avaliando a hipótese de substituir os funcionários da célula de produção por um robô manipulador. A instalação é composta por um centro de usinagem CNC e por um sistema de visão, sendo 160 cm a distância entre os respectivos pontos de manipulação. O peso das peças produzidas varia de 2 kgf a 5 kgf e optou-se pela utilização de um braço robótico equipado com uma garra pneumática de 1,5 kgf.</p>
<p>O quadro a seguir apresenta as principais características de modelos robóticos disponíveis no mercado.</p>
<div class="tbl"><table class="std"><thead><tr><th>Robô</th><th>Capacidade de Carga (kgf)</th><th>Alcance (m)</th><th>Eixos</th><th>Custo (R$)</th></tr></thead><tbody>
<tr><td>Modelo A</td><td>6</td><td>0,700</td><td>6</td><td>67 000,00</td></tr><tr><td>Modelo B</td><td>6</td><td>1,632</td><td>6</td><td>75 000,00</td></tr><tr><td>Modelo C</td><td>7</td><td>0,911</td><td>6</td><td>87 000,00</td></tr><tr><td>Modelo D</td><td>7</td><td>1,632</td><td>6</td><td>104 000,00</td></tr><tr><td>Modelo E</td><td>10</td><td>1,450</td><td>5</td><td>124 000,00</td></tr></tbody></table></div>
<p>Em relação ao caso apresentado, faça o que se pede nos itens a seguir.</p>`,
  itens: [
    { id: 'a', txt: 'Indique o modelo mais econômico que seja adequado para realizar o transporte de peças entre os dois equipamentos, considerando os dados do quadro e o posicionamento central do robô em relação aos equipamentos e justifique sua escolha. (valor: 3,5 pontos)',
      padrao: `<p>O robô correto é o Modelo C, já que:</p>
<ul><li>O alcance mínimo é de 160 cm / 2 = 80 cm.</li><li>A capacidade mínima de carga requerida é de 5 kgf (peça) + 1,5 kgf (garra) = 6,5 kgf.</li><li>Dentre os modelos que atendem ambos os critérios, o mais econômico é o Modelo C.</li></ul>`,
      check: [ { p: 1.0, t: 'Calculou o alcance mínimo: 160 cm / 2 = 80 cm (robô no centro).' },
               { p: 1.0, t: 'Calculou a carga mínima: 5 kgf + 1,5 kgf (garra) = 6,5 kgf.' },
               { p: 1.5, t: 'Escolheu o Modelo C como o mais barato que atende aos dois critérios.' } ] },
    { id: 'b', txt: 'Cite duas vantagens e duas desvantagens relacionadas à substituição do ser humano por robôs em sistemas de produção. (valor: 3,0 pontos)',
      padrao: `<div class="tbl"><table class="std"><thead><tr><th>Vantagens</th><th>Desvantagens</th></tr></thead><tbody>
<tr><td>Maior produtividade</td><td>Só funciona bem para casos bem ajustados</td></tr><tr><td>Sem paradas para descanso</td><td>Necessita de mão de obra especializada</td></tr><tr><td>Pode funcionar 24h</td><td>Uma falha pode comprometer o sistema (ou linha)</td></tr><tr><td>Executa tarefas perigosas</td><td>Necessita de manutenção periódica</td></tr><tr><td>Executa tarefas insalubres</td><td>Não é tão flexível quanto a mão de obra humana</td></tr><tr><td>Executa tarefas com maior precisão</td><td>Alto investimento inicial</td></tr><tr><td>Executa tarefas com maior qualidade</td><td>Apresenta riscos em locais não protegidos</td></tr><tr><td>Executa tarefas impossíveis de serem feitas pelo ser humano</td><td>Demissão dos funcionários substituídos (que poderão necessitar de requalificação)</td></tr><tr><td>Maior capacidade de carga</td><td></td></tr><tr><td>Não tem LER (Lesão por Esforço Repetitivo)</td><td></td></tr><tr><td>Não há absenteísmo</td><td></td></tr></tbody></table></div>`,
      check: [ { p: 1.5, t: 'Citou duas vantagens válidas (ex.: produtividade, operação 24 h, precisão, tarefas perigosas).' },
               { p: 1.5, t: 'Citou duas desvantagens válidas (ex.: alto investimento, mão de obra especializada, menor flexibilidade, impacto social).' } ] },
    { id: 'c', txt: 'Determine o tempo necessário para a recuperação do investimento inicial, se a taxa mínima de atratividade for igual a zero. Considere que a solução robótica tenha um custo total de R$ 300 mil (incluindo a aquisição do manipulador e as despesas de instalação), que o custo de operação e manutenção seja de R$ 40 mil/ano e que a produção anual seja de R$ 100 mil. Em contrapartida, o custo de cada funcionário já capacitado é de R$ 15 mil/ano e sua produção anual é de R$ 80 mil. (valor: 4,0 pontos)',
      padrao: `<p>Investimento inicial robô = R$ 300.000,00. Investimento inicial funcionários = 0.</p>
<p>Lucro anual manipulador = Produção − Custo = R$ 100.000,00 − R$ 40.000,00 = R$ 60.000,00/ano.</p>
<p>Lucro anual funcionários = Produção − Custo = R$ 80.000,00 − 4 × R$ 15.000,00 = R$ 20.000,00/ano.</p>
<p>VP (Valor Presente) = R$ 300.000,00. Tempo = VP / (Lucro anual manipulador − Lucro anual funcionários) = 300.000 / (60.000 − 20.000) = 7,5 anos.</p>`,
      check: [ { p: 1.0, t: 'Lucro anual com robô: 100 − 40 = R$ 60 mil.' },
               { p: 1.5, t: 'Lucro anual com funcionários: 80 − 4 × 15 = R$ 20 mil (4 funcionários).' },
               { p: 1.5, t: 'Payback = 300 / (60 − 20) = 7,5 anos.' } ] }
  ] }
);

</script>
<script>
(() => {
'use strict';
const LET = ['A', 'B', 'C', 'D', 'E'];
const KEY = 'enade-eca:v1:';
QUESTOES.forEach(q => { q.id = q.ano + '-' + q.n; });
DISCURSIVAS.forEach(d => { d.id = d.ano + '-' + d.n; });
QUESTOES.sort((a, b) => b.ano - a.ano || a.n - b.n);
const QMAP = Object.fromEntries(QUESTOES.map(q => [q.id, q]));
const DMAP = Object.fromEntries(DISCURSIVAS.map(d => [d.id, d]));
const YEARS = [...new Set(QUESTOES.map(q => q.ano))].sort((a, b) => b - a);
const app = document.getElementById('app');
const timerEl = document.getElementById('timer');

/* ---------- armazenamento local (por aluno, neste navegador) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(KEY + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(KEY + k); } catch (e) {} }
};

// migração da versão anterior (só 2023, ids numéricos)
(function migrate() {
  const a = store.get('attempt', null);
  if (a && a.qs && a.qs.some(x => typeof x === 'number')) {
    const f = o => Object.fromEntries(Object.entries(o || {}).map(([k, v]) => ['2023-' + k, v]));
    a.qs = a.qs.map(n => '2023-' + n); a.ans = f(a.ans); a.mark = f(a.mark); a.checked = f(a.checked);
    store.set('attempt', a);
  }
  const d = store.get('disc', null);
  if (d && d.D2) { d['2023-D2'] = d.D2; delete d.D2; store.set('disc', d); }
})();

let S = {
  view: 'home',
  att: store.get('attempt', null),       // simulado em andamento ou recém-entregue
  hist: store.get('history', []),
  disc: store.get('disc', {}),
  cfg: Object.assign({ areas: Object.keys(AREAS), years: YEARS.slice(), qty: '10', treino: true }, store.get('cfg', {})),
  discId: null,
  sheetOpen: true,
  confirm: null,
  open: {}
};

const save = () => { if (S.att) store.set('attempt', S.att); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtTime = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
const fmtDate = t => new Date(t).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const lvl = p => p >= 70 ? 'lvl-hi' : p >= 50 ? 'lvl-md' : 'lvl-lo';
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
if (!Array.isArray(S.cfg.years)) S.cfg.years = YEARS.slice();
S.cfg.areas = S.cfg.areas.filter(k => AREAS[k]);
if (!S.cfg.areas.length && !store.get('cfg', null)) S.cfg.areas = Object.keys(AREAS);
const pool = () => QUESTOES.filter(q => S.cfg.areas.includes(q.area) && S.cfg.years.includes(q.ano));
const areaCount = a => QUESTOES.filter(q => q.area === a && S.cfg.years.includes(q.ano)).length;
const yearCount = y => QUESTOES.filter(q => q.ano === y).length;
const blankDisc = () => ({ rev: {}, ck: {} });
const discState = id => S.disc[id] || (S.disc[id] = blankDisc());
const discStatus = id => { const st = S.disc[id]; if (!st) return ''; if (Object.keys(st.ck || {}).length) return 'done'; if (Object.keys(st).some(k => k.length === 1 && st[k])) return 'go'; return ''; };
const two = n => String(n).replace('D', '').padStart(2, '0');

function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.setAttribute('role', 'status');
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}

/* ---------- cronômetro ---------- */
let tick = null;
function startTimer() {
  stopTimer();
  tick = setInterval(() => {
    if (!S.att || S.att.done || S.view !== 'quiz' || document.hidden) return;
    S.att.elapsed++; timerEl.textContent = '⏱ ' + fmtTime(S.att.elapsed);
    if (S.att.elapsed % 5 === 0) save();
  }, 1000);
}
function stopTimer() { if (tick) clearInterval(tick); tick = null; }

/* ---------- simulados ---------- */
function newAttempt(kind, qs, treino, label) {
  return { kind, label, qs, treino: !!treino, ans: {}, mark: {}, checked: {}, idx: 0, elapsed: 0, started: Date.now(), done: false };
}
function startProva(y) {
  S.att = newAttempt('prova', QUESTOES.filter(q => q.ano === y).map(q => q.id), false, 'Prova completa ' + y);
  S.att.year = y;
  S.confirm = null; save(); go('quiz');
}
function startCustom() {
  const P = pool().map(q => q.id);
  if (!P.length) { toast('Escolha pelo menos uma área e uma edição.'); return; }
  const n = S.cfg.qty === 'all' ? P.length : Math.min(P.length, +S.cfg.qty);
  const qs = shuffle(P).slice(0, n);
  const all = S.cfg.areas.length === Object.keys(AREAS).length;
  const ys = S.cfg.years.length === YEARS.length ? '' : ' · ' + S.cfg.years.slice().sort().join(', ');
  const label = (S.cfg.treino ? 'Treino' : 'Simulado') + ' · ' + (all ? 'todas as áreas' : S.cfg.areas.length === 1 ? AREAS[S.cfg.areas[0]] : S.cfg.areas.length + ' áreas') + ys;
  S.att = newAttempt('custom', qs, S.cfg.treino, label);
  S.confirm = null; save(); go('quiz');
}
function resetAttempt() {
  // zera respostas e cronômetro, mantendo as mesmas questões
  const a = S.att; if (!a) return;
  S.att = newAttempt(a.kind, a.qs, a.treino, a.label); S.att.year = a.year;
  S.confirm = null; S.open = {}; save(); go('quiz'); toast('Simulado zerado. Boa sorte!');
}
function finish() {
  const a = S.att; let ok = 0; const per = {};
  a.qs.forEach(n => {
    const q = QMAP[n]; per[q.area] = per[q.area] || [0, 0]; per[q.area][1]++;
    if (a.ans[n] === q.gab) { ok++; per[q.area][0]++; }
  });
  a.done = true; a.finished = Date.now(); a.ok = ok;
  S.hist.unshift({ t: a.finished, label: a.label, n: a.qs.length, ok, per, sec: a.elapsed, answered: Object.keys(a.ans).length });
  S.hist = S.hist.slice(0, 200);
  store.set('history', S.hist); save(); S.confirm = null; S.open = {};
  go('result');
}

/* ---------- navegação ---------- */
function go(view) {
  S.view = view; S.confirm = null;
  render(); window.scrollTo(0, 0);
}
function render() {
  document.getElementById('nav-home').setAttribute('aria-current', S.view === 'home' ? 'page' : 'false');
  document.getElementById('nav-stats').setAttribute('aria-current', S.view === 'stats' ? 'page' : 'false');
  const inQuiz = S.view === 'quiz' && S.att && !S.att.done;
  timerEl.hidden = !inQuiz;
  if (inQuiz) { timerEl.textContent = '⏱ ' + fmtTime(S.att.elapsed); startTimer(); } else stopTimer();
  app.innerHTML = ({ home: vHome, quiz: vQuiz, result: vResult, stats: vStats, disc: vDisc })[S.view]();
}

/* ---------- componentes ---------- */
function optHTML(q, i, st) {
  const k = LET[i], o = q.opts[i];
  const body = typeof o === 'string' ? o : `<img src="img/${o.img}" alt="Figura da alternativa ${k}">`;
  let cls = 'opt', tag = '';
  if (st.reveal) {
    if (k === q.gab) { cls += ' right'; tag = 'Gabarito'; }
    else if (k === st.sel) { cls += ' wrong'; tag = 'Sua resposta'; }
  } else if (k === st.sel) cls += ' sel';
  return `<button class="${cls}" data-act="pick" data-k="${k}" ${st.lock ? 'disabled' : ''} aria-pressed="${k === st.sel}"><span class="L">${k}</span><span class="T">${body}</span>${tag ? `<span class="tagr">${tag}</span>` : ''}</button>`;
}
function feedbackHTML(q, sel) {
  const ok = sel === q.gab, none = !sel;
  return `<div class="feedback ${none ? '' : ok ? 'ok' : 'ko'}">
    <div class="verdict">${none ? 'Questão não respondida.' : ok ? '✓ Resposta correta.' : '✗ Resposta incorreta.'} <span style="font-weight:600;color:var(--muted)">Gabarito: ${q.gab}</span></div>
    ${q.com}
    <p class="unoff">Gabarito definitivo do INEP. Comentário de resolução não oficial.</p></div>`;
}
function qcardHTML(q, st, pos) {
  return `<article class="qcard">
    <div class="qhead"><span class="qn">Questão ${two(q.n)}</span><span class="tag">${q.ano}</span><span class="area">${AREAS[q.area]}</span>
      ${st.markable ? `<button class="btn small mk" data-act="mark" aria-pressed="${!!st.marked}">${st.marked ? '● Marcada' : '○ Marcar para revisão'}</button>` : ''}</div>
    <div class="qbody">${q.stem}</div>
    <div class="opts" role="group" aria-label="Alternativas">${q.opts.map((_, i) => optHTML(q, i, st)).join('')}
      ${typeof q.opts[0] === 'object' ? `<div class="zoomrow"><span>Ampliar alternativa:</span>${q.opts.map((o, i) => `<button class="btn small" data-act="zoom" data-k="${LET[i]}" data-src="img/${o.img}">${LET[i]}</button>`).join('')}</div>` : ''}</div>
    ${st.reveal ? feedbackHTML(q, st.sel) : ''}
  </article>`;
}

/* ---------- telas ---------- */
function vHome() {
  const a = S.att;
  const resume = a && !a.done ? `<div class="resume">
      <div class="txt"><b>Simulado em andamento: ${esc(a.label)}</b><span>${Object.keys(a.ans).length} de ${a.qs.length} respondidas · ${fmtTime(a.elapsed)} de prova</span></div>
      <div class="row"><button class="btn primary" data-act="resume">Continuar</button><button class="btn warn" data-act="ask-reset">Zerar e recomeçar</button></div>
    </div>${S.confirm && S.confirm.type === 'reset' ? confirmHTML() : ''}` : '';
  const yearChips = YEARS.map(y => `<button class="chip" data-act="year" data-y="${y}" aria-pressed="${S.cfg.years.includes(y)}">${y} <span class="n">${yearCount(y)}</span></button>`).join('');
  const areaChips = Object.keys(AREAS).map(k => `<button class="chip" data-act="area" data-a="${k}" aria-pressed="${S.cfg.areas.includes(k)}">${AREAS[k]} <span class="n">${areaCount(k)}</span></button>`).join('');
  const sel = pool().length;
  const yearBtns = YEARS.map(y => `<button class="yearbtn" data-act="prova" data-y="${y}"><b>${y}</b><span>${yearCount(y)} objetivas</span></button>`).join('');
  const dlist = DISCURSIVAS.slice().sort((x, y) => y.ano - x.ano || String(x.n).localeCompare(String(y.n))).map(d => {
    const st = discStatus(d.id);
    return `<button class="ditem" data-act="disc" data-id="${d.id}"><span class="yr">${d.ano}</span><span class="tt">${esc(d.titulo)}<small>Discursiva ${two(d.n)} · ${AREAS[d.area]}</small></span><span class="stt ${st}">${st === 'done' ? 'Autoavaliada' : st === 'go' ? 'Em andamento' : 'Abrir ›'}</span></button>`;
  }).join('');
  return `<section class="hero">
      <span class="eyebrow">Banco de questões · Componente Específico</span>
      <h1>Pratique com as provas do ENADE</h1>
      <p class="lede">Questões oficiais de Engenharia de Controle e Automação das edições ${YEARS.slice().reverse().join(', ').replace(/, (\d+)$/, ' e $1')}, com gabarito do INEP e resolução comentada. Seu resultado fica salvo só neste navegador, e você pode zerar e refazer quando quiser.</p>
      <div class="hero-meta"><span><b>${QUESTOES.length}</b> objetivas</span><span><b>${DISCURSIVAS.length}</b> discursivas</span><span><b>${YEARS.length}</b> edições</span><span><b>${Object.keys(AREAS).length}</b> áreas</span></div>
    </section>
    <div class="stack">
      ${resume}
      <section class="mode">
        <div class="mode-head"><h2>Prova completa</h2><span class="count">ordem original da prova</span></div>
        <p>Todas as objetivas do Componente Específico de uma edição, com cronômetro e cartão-resposta. A correção aparece só na entrega, como no dia do exame.</p>
        <div class="years">${yearBtns}</div>
      </section>
      <section class="mode">
        <div class="mode-head"><h2>Simulado por área</h2><span class="count">${sel} questões disponíveis</span></div>
        <p>Escolha as edições e as áreas que quer treinar. As questões são sorteadas a cada novo simulado.</p>
        <span class="subhead">Edições</span>
        <div class="chips" role="group" aria-label="Edições">${yearChips}</div>
        <span class="subhead">Áreas</span>
        <div class="chips" role="group" aria-label="Áreas">${areaChips}</div>
        <div class="row"><button class="linkbtn" data-act="areas-all">Marcar todas as áreas</button><span style="color:var(--line-strong)">·</span><button class="linkbtn" data-act="areas-none">Limpar áreas</button></div>
        <div class="field">
          <label for="qty">Quantidade
            <select id="qty" data-act="qty">${['5', '10', '15', '20', '30', 'all'].map(v => `<option value="${v}" ${S.cfg.qty === v ? 'selected' : ''}>${v === 'all' ? 'Todas' : v}</option>`).join('')}</select></label>
          <button class="switch" role="switch" id="treino" data-act="treino" aria-checked="${S.cfg.treino}"><span class="track"></span>Correção imediata (modo treino)</button>
        </div>
        <div class="row"><button class="btn primary" data-act="custom" ${sel ? '' : 'disabled'}>Gerar simulado</button></div>
      </section>
      <section class="mode" id="discursivas">
        <div class="mode-head"><h2>Questões discursivas</h2><span class="count">${DISCURSIVAS.length} questões</span></div>
        <p>Escreva sua resposta, depois abra o padrão de resposta do INEP e faça a autoavaliação item por item.</p>
        <div class="dlist">${dlist}</div>
      </section>
      <p class="note">Fonte: provas, gabaritos definitivos e padrões de resposta do ENADE publicados pelo INEP. As questões anuladas pelo INEP ficaram de fora. Os comentários de resolução das objetivas não são oficiais e podem ser revisados pelos professores do curso. Toque em qualquer figura para ampliá-la.</p>
    </div>`;
}

function confirmHTML() {
  const c = S.confirm;
  if (c.type === 'reset') return `<div class="confirm" role="alertdialog" aria-label="Confirmar zerar">
      <p><b>Zerar este simulado?</b> Todas as respostas e o tempo serão apagados, e você recomeça com as mesmas questões. O histórico de simulados entregues não é afetado.</p>
      <div class="row"><button class="btn warn" data-act="do-reset">Zerar e recomeçar</button><button class="btn" data-act="cancel">Cancelar</button></div></div>`;
  if (c.type === 'finish') {
    const a = S.att, left = a.qs.length - Object.keys(a.ans).length;
    return `<div class="confirm neutral" role="alertdialog" aria-label="Confirmar entrega">
      <p><b>Entregar o simulado?</b> ${left ? `Ainda há <b>${left}</b> questão${left > 1 ? 'ões' : ''} sem resposta, que contará${left > 1 ? 'ão' : ''} como erro.` : 'Todas as questões foram respondidas.'}</p>
      <div class="row"><button class="btn primary" data-act="do-finish">Entregar</button><button class="btn" data-act="cancel">Continuar respondendo</button></div></div>`;
  }
  if (c.type === 'wipe') return `<div class="confirm" role="alertdialog" aria-label="Confirmar apagar histórico">
      <p><b>Apagar todo o seu histórico?</b> Os resultados de todos os simulados entregues, o simulado em andamento e suas respostas das discursivas serão removidos deste navegador. Não é possível desfazer.</p>
      <div class="row"><button class="btn warn" data-act="do-wipe">Apagar histórico</button><button class="btn" data-act="cancel">Cancelar</button></div></div>`;
  if (c.type === 'disc-reset') return `<div class="confirm" role="alertdialog" aria-label="Confirmar zerar discursiva">
      <p><b>Zerar esta discursiva?</b> Seu texto e sua autoavaliação nesta questão serão apagados. As outras discursivas não são afetadas.</p>
      <div class="row"><button class="btn warn" data-act="do-disc-reset">Zerar resposta</button><button class="btn" data-act="cancel">Cancelar</button></div></div>`;
  return '';
}

function sheetHTML(a) {
  const cells = a.qs.map((n, i) => {
    const q = QMAP[n], v = a.ans[n]; let cls = 'cell';
    if (a.treino && a.checked[n]) cls += v === q.gab ? ' ok' : ' ko';
    else if (v) cls += ' ans';
    if (i === a.idx) cls += ' cur';
    if (a.mark[n]) cls += ' mk';
    const lab = a.kind === 'prova' ? q.n : i + 1;
    return `<button class="${cls}" data-act="goto" data-i="${i}" aria-label="Questão ${lab}${v ? ', resposta ' + v : ', sem resposta'}${a.mark[n] ? ', marcada' : ''}">${lab}<small>${v || '–'}</small></button>`;
  }).join('');
  return `<div class="sheet">
    <div class="sheet-head"><b style="color:var(--ink)">Cartão-resposta</b>
      <span class="legend"><span><i style="background:var(--sel-soft);border-color:var(--sel)"></i>respondida</span>${a.treino ? '<span><i style="background:var(--ok-soft);border-color:var(--ok)"></i>acerto</span><span><i style="background:var(--bad-soft);border-color:var(--bad)"></i>erro</span>' : ''}<span><i style="background:var(--accent-fill);border-color:var(--accent-fill);border-radius:50%"></i>marcada</span></span>
      <button class="linkbtn" data-act="sheet">${S.sheetOpen ? 'Ocultar' : 'Mostrar'}</button></div>
    ${S.sheetOpen ? `<div class="grid">${cells}</div>` : ''}
  </div>`;
}

function vQuiz() {
  const a = S.att;
  if (!a) return vHome();
  if (a.done) return vResult();
  const n = a.qs[a.idx], q = QMAP[n], sel = a.ans[n];
  const answered = Object.keys(a.ans).length;
  const checked = a.treino && a.checked[n];
  const last = a.idx === a.qs.length - 1;
  return `<div class="qbar">
      <div class="title"><span class="eyebrow">${esc(a.label)}</span><b>Questão ${a.idx + 1} de ${a.qs.length}</b></div>
      <div class="row"><button class="btn small warn" data-act="ask-reset">↺ Zerar</button><button class="btn small" data-act="ask-finish">Entregar</button></div>
    </div>
    <div class="progress" aria-hidden="true"><i style="width:${pct(answered, a.qs.length)}%"></i></div>
    ${S.confirm ? confirmHTML() : ''}
    ${sheetHTML(a)}
    ${qcardHTML(q, { sel, lock: checked, reveal: checked, markable: true, marked: a.mark[n] })}
    <div class="qnav">
      <button class="btn" data-act="prev" ${a.idx === 0 ? 'disabled' : ''}>← Anterior</button>
      <div class="mid">
        ${a.treino && !checked ? `<button class="btn primary" data-act="check" ${sel ? '' : 'disabled'}>Corrigir</button>` : ''}
        ${last ? `<button class="btn ${a.treino && !checked ? '' : 'primary'}" data-act="ask-finish">Entregar simulado</button>` : `<button class="btn ${a.treino && !checked ? '' : 'primary'}" data-act="next">Próxima →</button>`}
      </div>
    </div>`;
}

function areaBars(per) {
  const rows = Object.keys(AREAS).filter(k => per[k]).map(k => {
    const [o, t] = per[k], p = pct(o, t);
    return `<div class="arow"><span class="nm">${AREAS[k]}${t >= 2 && p < 50 ? '<span class="weak">reforçar</span>' : ''}</span><span class="vl">${o}/${t} · ${p}%</span><span class="bar"><i class="${lvl(p)}" style="width:${Math.max(p, 2)}%"></i></span></div>`;
  }).join('');
  return `<div class="areas">${rows}</div>`;
}
function gauge(p) {
  const C = 2 * Math.PI * 54;
  const col = p >= 70 ? 'var(--ok)' : p >= 50 ? 'var(--accent-fill)' : 'var(--bad)';
  return `<div class="gauge"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="54" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="60" cy="60" r="54" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C * p / 100} ${C}"/></svg><div class="v"><div>${p}%<small>de acerto</small></div></div></div>`;
}

function vResult() {
  const a = S.att;
  if (!a || !a.done) return vHome();
  const per = {};
  a.qs.forEach(n => { const q = QMAP[n]; per[q.area] = per[q.area] || [0, 0]; per[q.area][1]++; if (a.ans[n] === q.gab) per[q.area][0]++; });
  const p = pct(a.ok, a.qs.length);
  const rev = a.qs.map(n => {
    const q = QMAP[n], v = a.ans[n], st = !v ? 'na' : v === q.gab ? 'ok' : 'ko';
    const open = !!S.open[n];
    return `<div class="rev" ${open ? 'open' : ''}>
      <button data-act="toggle" data-n="${n}" aria-expanded="${open}"><span class="st ${st}">${st === 'ok' ? '✓' : st === 'ko' ? '✗' : '–'}</span>
        <span class="info"><b>Questão ${two(q.n)} · ${q.ano}</b><span>${AREAS[q.area]}</span></span>
        <span class="ans">${v || '–'} → ${q.gab}</span><span class="chev">›</span></button>
      ${open ? `<div class="inner">${qcardHTML(q, { sel: v, lock: true, reveal: true })}</div>` : ''}
    </div>`;
  }).join('');
  const wrong = a.qs.length - a.ok;
  return `<div class="stack">
    <div><span class="eyebrow">Resultado · ${esc(a.label)}</span><h1 style="margin-top:4px">Simulado entregue</h1></div>
    <section class="score">${gauge(p)}
      <div class="facts"><span class="big">${a.ok} de ${a.qs.length} acertos</span>
        <span>Erros ou em branco: <b>${wrong}</b></span><span>Tempo de prova: <b>${fmtTime(a.elapsed)}</b> · média de <b>${fmtTime(a.elapsed / a.qs.length)}</b> por questão</span>
        <div class="row" style="margin-top:8px"><button class="btn primary" data-act="redo">↺ Zerar e refazer</button><button class="btn" data-act="home">Novo simulado</button></div>
      </div></section>
    <section class="stack" style="gap:10px"><h2>Desempenho por área</h2>${areaBars(per)}</section>
    <section class="stack" style="gap:10px"><h2>Correção questão a questão</h2>
      <p style="margin:0;color:var(--muted)">Toque em uma questão para ver o enunciado, o gabarito e a resolução comentada.</p>
      <div class="row"><button class="linkbtn" data-act="open-wrong">Abrir só as que errei</button><span style="color:var(--line-strong)">·</span><button class="linkbtn" data-act="close-all">Fechar todas</button></div>
      <div class="revlist">${rev}</div></section>
    ${a.kind === 'prova' && a.year ? (() => { const ds = DISCURSIVAS.filter(d => d.ano === a.year); return ds.length ? `<section class="mode"><h3>Faltam as discursivas</h3><p>Na prova real, o Componente Específico de ${a.year} também tem ${ds.length > 1 ? ds.length + ' questões discursivas' : 'uma questão discursiva'}. Faça e compare com o padrão de resposta.</p><div class="dlist">${ds.map(d => `<button class="ditem" data-act="disc" data-id="${d.id}"><span class="yr">${d.ano}</span><span class="tt">${esc(d.titulo)}<small>Discursiva ${two(d.n)}</small></span><span class="stt">Abrir ›</span></button>`).join('')}</div></section>` : ''; })() : ''}
  </div>`;
}

function vStats() {
  const H = S.hist;
  const tot = H.reduce((s, h) => s + h.n, 0), ok = H.reduce((s, h) => s + h.ok, 0);
  const per = {};
  H.forEach(h => Object.entries(h.per).forEach(([k, [o, t]]) => { per[k] = per[k] || [0, 0]; per[k][0] += o; per[k][1] += t; }));
  const rows = H.map(h => `<tr><td>${fmtDate(h.t)}</td><td>${esc(h.label)}</td><td class="num">${h.ok}/${h.n}</td><td class="num">${pct(h.ok, h.n)}%</td><td class="num">${fmtTime(h.sec)}</td></tr>`).join('');
  return `<div class="stack">
    <div><span class="eyebrow">Salvo apenas neste navegador</span><h1 style="margin-top:4px">Meu desempenho</h1></div>
    ${H.length ? `
    <div class="kpis"><div class="kpi"><b>${H.length}</b><span>simulados entregues</span></div><div class="kpi"><b>${tot}</b><span>questões corrigidas</span></div><div class="kpi"><b>${pct(ok, tot)}%</b><span>de acerto geral</span></div></div>
    <section class="stack" style="gap:10px"><h2>Acumulado por área</h2>${areaBars(per)}</section>
    <section class="stack" style="gap:10px"><h2>Histórico</h2>
      <div class="hist"><table><thead><tr><th>Data</th><th>Simulado</th><th style="text-align:right">Acertos</th><th style="text-align:right">%</th><th style="text-align:right">Tempo</th></tr></thead><tbody>${rows}</tbody></table></div></section>`
    : `<div class="empty">Você ainda não entregou nenhum simulado. Os resultados aparecem aqui assim que você entregar o primeiro.</div>`}
    <section class="stack" style="gap:10px">
      ${S.confirm && S.confirm.type === 'wipe' ? confirmHTML() : ''}
      <div class="row"><button class="btn warn" data-act="ask-wipe" ${H.length || S.att || Object.keys(S.disc).length ? '' : 'disabled'}>Apagar todo o histórico</button><button class="btn" data-act="home">Fazer um simulado</button></div>
    </section>
  </div>`;
}

function vDisc() {
  const D = DMAP[S.discId] || DISCURSIVAS[0];
  const st = discState(D.id);
  let tot = 0, max = 0;
  D.itens.forEach(it => it.check.forEach((c, i) => { max += c.p; if (st.ck[it.id + i]) tot += c.p; }));
  const anyRev = D.itens.some(it => st.rev[it.id]);
  const items = D.itens.map(it => {
    const words = (st[it.id] || '').trim().split(/\s+/).filter(Boolean).length;
    const sub = it.check.reduce((s, c, i) => s + (st.ck[it.id + i] ? c.p : 0), 0), subMax = it.check.reduce((s, c) => s + c.p, 0);
    return `<div class="item">
      <div class="it"><b>${it.id})</b><div>${it.txt}</div></div>
      <label for="txt-${it.id}" class="eyebrow">Sua resposta, item ${it.id}</label>
      <textarea id="txt-${it.id}" data-item="${it.id}" placeholder="Escreva aqui sua resposta (até 15 linhas na prova).">${esc(st[it.id] || '')}</textarea>
      <div class="row" style="justify-content:space-between"><span class="wc" id="wc-${it.id}">${words} palavras</span>
        <button class="btn small" data-act="rev" data-id="${it.id}">${st.rev[it.id] ? 'Ocultar padrão de resposta' : 'Ver padrão de resposta'}</button></div>
      ${st.rev[it.id] ? `<div class="padrao"><h4>Padrão de resposta (INEP)</h4>${it.padrao}
        <h4 style="margin-top:12px">Autoavaliação: marque o que sua resposta contemplou</h4>
        <div class="checks">${it.check.map((c, i) => `<button class="ck" role="checkbox" data-act="ck" data-k="${it.id + i}" aria-checked="${!!st.ck[it.id + i]}"><span class="box">${st.ck[it.id + i] ? '✓' : ''}</span><span>${c.t}</span><span class="pt">${c.p.toFixed(1).replace('.', ',')}</span></button>`).join('')}</div>
        <p style="margin:10px 0 0" class="selfscore">Item ${it.id}: ${sub.toFixed(1).replace('.', ',')} / ${subMax.toFixed(1).replace('.', ',')}</p></div>` : ''}
    </div>`;
  }).join('');
  return `<div class="stack">
    <div class="qbar" style="margin:0"><div class="title"><span class="eyebrow">Componente Específico · ${D.ano}</span><b>${esc(D.titulo)}</b></div>
      <div class="row"><button class="btn small" data-act="disc-list">← Discursivas</button><button class="btn small warn" data-act="ask-disc-reset">↺ Zerar resposta</button></div></div>
    ${S.confirm && S.confirm.type === 'disc-reset' ? confirmHTML() : ''}
    <article class="qcard">
      <div class="qhead"><span class="qn">Discursiva ${two(D.n)}</span><span class="tag">${D.ano}</span><span class="area">${AREAS[D.area]}</span></div>
      <div class="qbody">${D.stem}</div>
      ${items}
    </article>
    ${anyRev ? `<section class="mode"><div class="mode-head"><h3>Sua autoavaliação</h3><span class="selfscore">${tot.toFixed(1).replace('.', ',')} / ${max.toFixed(1).replace('.', ',')}</span></div>
      <p>A divisão de pontos por critério é uma sugestão para estudo, não a grade oficial do INEP. Se tiver dúvida, leve sua resposta para o professor da disciplina.</p></section>` : ''}
    <p class="note">Seu texto é salvo automaticamente neste navegador enquanto você escreve.</p>
  </div>`;
}

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  const z = e.target.closest('.qfig img');
  if (z) { openLb(z.getAttribute('src'), z.alt); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, a = S.att;
  switch (act) {
    case 'home': go('home'); break;
    case 'stats': S.confirm = null; go('stats'); break;
    case 'disc': S.confirm = null; S.discId = el.dataset.id || (DISCURSIVAS.find(d => !a || d.ano === a.year) || DISCURSIVAS[0]).id; go('disc'); break;
    case 'disc-list': go('home'); setTimeout(() => { const d = document.getElementById('discursivas'); if (d) d.scrollIntoView(); }, 0); break;
    case 'prova': startProva(+el.dataset.y); break;
    case 'year': {
      const y = +el.dataset.y, i = S.cfg.years.indexOf(y);
      if (i >= 0) { if (S.cfg.years.length === 1) { toast('Mantenha pelo menos uma edição.'); return; } S.cfg.years.splice(i, 1); } else S.cfg.years.push(y);
      store.set('cfg', S.cfg); render(); break; }
    case 'custom': startCustom(); break;
    case 'resume': S.confirm = null; go('quiz'); break;
    case 'area': {
      const k = el.dataset.a, i = S.cfg.areas.indexOf(k);
      i >= 0 ? S.cfg.areas.splice(i, 1) : S.cfg.areas.push(k); store.set('cfg', S.cfg); render(); break; }
    case 'areas-all': S.cfg.areas = Object.keys(AREAS); store.set('cfg', S.cfg); render(); break;
    case 'areas-none': S.cfg.areas = []; store.set('cfg', S.cfg); render(); break;
    case 'treino': S.cfg.treino = !S.cfg.treino; store.set('cfg', S.cfg); render(); break;
    case 'pick': {
      if (!a || a.done) return; const n = a.qs[a.idx];
      if (a.treino && a.checked[n]) return;
      a.ans[n] === el.dataset.k ? delete a.ans[n] : a.ans[n] = el.dataset.k;
      save(); render(); break; }
    case 'check': { const n = a.qs[a.idx]; if (!a.ans[n]) return; a.checked[n] = true; save(); render(); break; }
    case 'mark': { const n = a.qs[a.idx]; a.mark[n] ? delete a.mark[n] : a.mark[n] = true; save(); render(); break; }
    case 'prev': if (a.idx > 0) { a.idx--; save(); go('quiz'); } break;
    case 'next': if (a.idx < a.qs.length - 1) { a.idx++; save(); go('quiz'); } break;
    case 'goto': a.idx = +el.dataset.i; save(); go('quiz'); break;
    case 'sheet': S.sheetOpen = !S.sheetOpen; render(); break;
    case 'ask-reset': S.confirm = { type: 'reset' }; render(); scrollToConfirm(); break;
    case 'ask-finish': S.confirm = { type: 'finish' }; render(); scrollToConfirm(); break;
    case 'ask-wipe': S.confirm = { type: 'wipe' }; render(); scrollToConfirm(); break;
    case 'ask-disc-reset': S.confirm = { type: 'disc-reset' }; render(); scrollToConfirm(); break;
    case 'cancel': S.confirm = null; render(); break;
    case 'do-reset': resetAttempt(); break;
    case 'do-finish': finish(); break;
    case 'redo': resetAttempt(); break;
    case 'do-wipe':
      S.hist = []; S.att = null; S.disc = {}; S.confirm = null; store.del('history'); store.del('attempt'); store.del('disc');
      render(); toast('Histórico apagado.'); break;
    case 'do-disc-reset':
      S.disc[S.discId] = blankDisc(); store.set('disc', S.disc); S.confirm = null; render(); toast('Discursiva zerada.'); break;
    case 'toggle': { const n = el.dataset.n; S.open[n] = !S.open[n]; render(); break; }
    case 'open-wrong': S.open = {}; a.qs.forEach(n => { if (a.ans[n] !== QMAP[n].gab) S.open[n] = true; }); render(); break;
    case 'close-all': S.open = {}; render(); break;
    case 'rev': { const st = discState(S.discId); st.rev[el.dataset.id] = !st.rev[el.dataset.id]; store.set('disc', S.disc); render(); break; }
    case 'ck': { const st = discState(S.discId); const k = el.dataset.k; st.ck[k] ? delete st.ck[k] : st.ck[k] = true; store.set('disc', S.disc); render(); break; }
    case 'zoom': openLb(el.dataset.src, 'Alternativa ' + el.dataset.k + ' ampliada'); break;
    case 'lb-close': if (e.target.tagName !== 'IMG') closeLb(); break;
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'qty') { S.cfg.qty = e.target.value; store.set('cfg', S.cfg); }
});
let typeT = null;
document.addEventListener('input', e => {
  const it = e.target.dataset && e.target.dataset.item; if (!it) return;
  const st = discState(S.discId); st[it] = e.target.value;
  const w = e.target.value.trim().split(/\s+/).filter(Boolean).length;
  const wc = document.getElementById('wc-' + it); if (wc) wc.textContent = w + ' palavras';
  clearTimeout(typeT); typeT = setTimeout(() => store.set('disc', S.disc), 400);
});
document.addEventListener('keydown', e => {
  if (S.view !== 'quiz' || !S.att || S.att.done || e.target.closest('textarea, input, select')) return;
  const k = e.key.toUpperCase();
  if (LET.includes(k)) { const b = app.querySelector(`.opt[data-k="${k}"]:not(:disabled)`); if (b) b.click(); }
  else if (e.key === 'ArrowRight') { const b = app.querySelector('[data-act="next"]'); if (b) b.click(); }
  else if (e.key === 'ArrowLeft') { const b = app.querySelector('[data-act="prev"]:not(:disabled)'); if (b) b.click(); }
});
window.addEventListener('pagehide', () => { save(); if (Object.keys(S.disc).length) store.set('disc', S.disc); });
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

function scrollToConfirm() { const c = app.querySelector('.confirm'); if (c) c.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
const lb = document.getElementById('lb'), lbImg = document.getElementById('lb-img');
function openLb(src, alt) { lbImg.src = src; lbImg.alt = alt || 'Figura ampliada'; try { lb.showModal(); } catch (err) { lb.setAttribute('open', ''); } }
function closeLb() { try { lb.close(); } catch (err) { lb.removeAttribute('open'); } }

try { if (window.self !== window.top) document.getElementById('fs-link').hidden = false; } catch (e) { document.getElementById('fs-link').hidden = false; }
// estado inicial
if (S.att && S.att.done) S.view = 'home';
render();
})();
</script>

</body>
</html>

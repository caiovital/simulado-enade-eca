{ ano: 2014, n: 16, area: 'ger', gab: 'D',
  stem: `<p>Uma indústria de blocos cerâmicos pretende utilizar queima de biomassa resultante de resíduos de madeira, para gerar energia térmica para seus fornos, que, atualmente, utilizam gás natural. Tal iniciativa poderá reduzir o consumo de combustível, porém será necessário um investimento no valor de 20% do consumo/ano atual de combustível, visando à adaptação dos fornos. Além disso, o transporte anual dos resíduos da fonte geradora até a indústria irá custar 5% do consumo/ano atual de combustível. Estima-se que essa alteração promova uma economia, no consumo/ano atual de combustível, de 10% ao ano.</p>
<p>A partir da situação descrita, avalie as afirmações a seguir.</p>
<ol class="roman"><li>A partir do quinto ano, a indústria começaria a ter benefícios econômicos.</li><li>Na proposta apresentada, a indústria substituiria o combustível atual por uma fonte de energia com menor produção e emissão de partículas devido ao processo de combustão (particulados).</li><li>Na proposta apresentada, a indústria substituiria o combustível atual por uma fonte renovável de energia.</li><li>O valor do investimento supera os benefícios promovidos com a economia de combustível durante os 5 primeiros anos.</li></ol>
<p>É correto apenas o que se afirma em</p>`,
  opts: ['II.', 'IV.', 'I e II.', 'I e III.', 'III e IV.'],
  com: `<p>Ganho líquido anual: 10% − 5% = 5% do consumo. Para pagar 20% de investimento, são necessários 4 anos.</p>
<ul><li><b>I – correta.</b> Após 4 anos o investimento está pago, e o benefício aparece a partir do 5º ano.</li><li><b>II – incorreta.</b> A queima de biomassa sólida emite mais particulados que o gás natural.</li><li><b>III – correta.</b> Resíduo de madeira é biomassa, uma fonte renovável.</li><li><b>IV – incorreta.</b> Em 5 anos o benefício acumulado é 25% &gt; 20%.</li></ul>` },

{ ano: 2014, n: 17, area: 'ger', gab: 'B',
  stem: `<p>Existem controvérsias acerca da magnitude dos fatores que influenciam o voto do eleitor. Embora, atualmente, as pesquisas eleitorais possam ser divulgadas próximo ao dia da eleição, durante muito tempo essa divulgação não era permitida sob a alegação de que as mesmas influenciavam a decisão de um tipo particular de eleitor, o qual desejava “votar no candidato ganhador” e tendia a votar nos candidatos cuja suposta probabilidade de vitória é maior, independentemente do conteúdo da proposta política apresentada.</p>
${fig('y14_q17.png', 'Gráfico I: barras de 45% e 55% com eixo a partir de zero. Gráfico II: mesmas barras com eixo começando em 40%')}
<p>Considerando que o Candidato B esteja interessado no voto do tipo de eleitor mencionado no texto e esteja examinando os dois gráficos acima para apresentar, em seu material de propaganda, os resultados de uma pesquisa eleitoral, avalie as afirmações que se seguem.</p>
<ol class="roman"><li>Os dois gráficos apresentam resultados diferentes.</li><li>Em relação aos objetivos do Candidato B, o gráfico I é mais adequado que o II.</li><li>A decisão a ser tomada apresenta implicações de natureza ética, além das de natureza técnica.</li></ol>
<p>É correto o que se afirma em</p>`,
  opts: ['I, apenas.', 'III, apenas.', 'I e II, apenas.', 'II e III, apenas.', 'I, II e III.'],
  com: `<ul><li><b>I – incorreta.</b> Os dados são os mesmos (45% e 55%). Muda só a escala do eixo.</li><li><b>II – incorreta.</b> Para parecer o "favorito", o gráfico II é mais vantajoso para B: o eixo truncado em 40% exagera visualmente a diferença.</li><li><b>III – correta.</b> Escolher uma escala que distorce a percepção é uma decisão ética, e não só técnica.</li></ul>` },

{ ano: 2014, n: 18, area: 'mec', gab: 'A',
  stem: `<p>No Brasil, é comercializada uma cadeira de rodas de alumínio com peso aproximado de 12 kg, que representa cerca da metade do peso de um modelo convencional. Construída em estrutura tubular de uma liga de alumínio aeronáutico, essa cadeira de rodas possui alta resistência mecânica, além de ter custo reduzido.</p>
<p class="src">Disponível em: &lt;http://www.hospitalar.com&gt;. Acesso em: 26 jul. 2014 (adaptado).</p>
<p>O alumínio aeronáutico possui uma combinação única de propriedades que o torna um material de construção versátil, altamente utilizável e atrativo. Essas características são devidas a quais propriedades?</p>`,
  opts: ['Alta resistência mecânica e baixa densidade.', 'Baixa plasticidade e alto ponto de fusão.', 'Alta dureza a quente e baixa dutilidade.', 'Baixa plasticidade e alta soldabilidade.', 'Alta dureza e alta densidade.'],
  com: `<p>As ligas aeronáuticas (séries 2xxx e 7xxx) unem alta resistência mecânica à baixa densidade do alumínio (cerca de 2,7 g/cm³, um terço da do aço). O texto destaca justamente o peso reduzido com resistência alta.</p>
<p>O alumínio tem ponto de fusão relativamente baixo, é dúctil e tem baixa densidade, o que elimina as demais opções.</p>` },

{ ano: 2014, n: 19, area: 'inst', gab: 'A',
  stem: `<p>Um detector de fumaça é uma câmara formada por dois compartimentos nos quais são inseridas duas células fotocondutoras, que são elementos cuja resistência varia com a luminosidade, e uma fonte de luz, conforme ilustra a figura I. Em condições normais, os raios de luz provenientes da fonte atingem as duas células igualmente. Na ocorrência de um incêndio, apenas a câmara inferior será preenchida pela fumaça e, assim, a luminosidade na célula será alterada, causando mudança na sua resistência.</p>
${fig('y14_q19_f1.png', 'Câmara com lâmpada, célula de referência na parte superior e detector de fumaça na parte inferior, separadas por barreira opaca', 'Figura I - Esquemático do detector de fumaça')}
<p class="src">BOYLESTAD, R. L. <b>Introdução à Análise de Circuitos</b>, 10 ed. Pearson Prentice Hall, 2004.</p>
<p>O circuito do detector de fumaça é mostrado na figura II, no qual existe uma ponte de Wheatstone. Em condições normais, as resistências das duas células são iguais e o circuito está equilibrado, de modo que a tensão Vab é nula. Na presença de fumaça, as resistências das células fotocondutivas tornam-se diferentes e, assim, surge uma diferença de potencial entre os pontos a e b. Se essa tensão for maior que um valor pré-estabelecido, um relé será acionado, o que por sua vez, disparará um alarme.</p>
${fig('y14_q19_f2.png', 'Ponte com R1 (ajustável) e R2 = 10 kΩ (detector) em cima, R3 = 10 kΩ (referência) e R4 = 20 kΩ embaixo, alimentada por 12 V, com relé entre a e b', 'Figura II - Circuito do detector de fumaça')}
<p class="src">BOYLESTAD, R. L. <b>Introdução à Análise de Circuitos</b>, 10 ed. Pearson Prentice Hall, 2004 (adaptado).</p>
<p>Considerando o circuito e os dados da figura II, em que valor deverá ser ajustada a resistência variável R1 para que, em condições normais, a tensão Vab seja nula?</p>`,
  opts: ['5 kΩ.', '10 kΩ.', '12 kΩ.', '15 kΩ.', '20 kΩ.'],
  com: `<p>Na ponte equilibrada, os divisores dos dois lados são iguais. R1 está acima de b com R3 abaixo, e R2 está acima de a com R4 abaixo:</p>
<p class="eq">R1/R3 = R2/R4 → R1 = 10 k × 10 k / 20 k = 5 kΩ</p>
<p>Confira: no ponto b, 12 × 10/(5+10) = 8 V; no ponto a, 12 × 20/(10+20) = 8 V. Vab = 0, coerente com os 8 V indicados em R4.</p>` },

{ ano: 2014, n: 20, area: 'ctrl', gab: 'B',
  stem: `<p>Considere o sistema de controle de um processo industrial descrito pelo diagrama de blocos apresentado na figura abaixo:</p>
${fig('y14_q20.png', 'Controlador com ramos paralelos 1, H1(s) e H2(s) somados e multiplicados por H3(s); perturbação P(s) na entrada da planta G(s); ruído R(s) na realimentação')}
<p>No diagrama, X(s), Y(s), E(s), U(s), P(s) e R(s) representam, respectivamente, os sinais de referência, saída, erro, ação de controle, perturbação na entrada da planta e ruído de medição. G(s) é a função de transferência da planta a ser controlada. Os demais blocos constituem o controlador, que é descrito pelas seguintes funções de transferência:</p>
<p class="eq">1. H<sub>1</sub>(s) = 1/(τ<sub>1</sub>s)<br>2. H<sub>2</sub>(s) = τ<sub>2</sub>s / (1 + ατ<sub>2</sub>s)<br>3. H<sub>3</sub>(s) = K</p>
<p>em que τ<sub>1</sub>, τ<sub>2</sub>, α e K são as constantes não nulas sintonizadas pelo projetista do sistema de controle.</p>
<p>Considere que, nos testes, durante o comissionamento do sistema, verificou-se que a aplicação de um sinal de referência x(t) do tipo degrau resulta em uma ação de controle u(t) com um elevado pulso imediatamente após a aplicação do degrau. Esse pulso é inadequado para o processo, pois causa fadiga precoce do atuador. Para contornar esse problema, é necessário</p>`,
  opts: ['alterar a estrutura do controlador, fazendo com que a ação proporcional atue somente sobre o percurso de retroação.', 'alterar a estrutura do controlador, fazendo com que a ação derivativa atue somente sobre o percurso de retroação.', 'inserir um filtro para atenuar o efeito da perturbação, após a alteração abrupta do valor de referência.', 'inserir um filtro para atenuar o efeito do ruído, após a alteração abrupta do valor de referência.', 'alterar a estrutura do controlador atual para um PID tradicional.'],
  com: `<p>O controlador é um PID paralelo (1 + H<sub>1</sub> + H<sub>2</sub>) com derivativo filtrado, todo atuando sobre o erro. Um degrau na referência faz o erro saltar, e o derivativo responde com um pico: é o chamado <i>derivative kick</i>.</p>
<p>A solução clássica é derivar apenas a <b>saída medida</b> (estrutura PI-D), que varia de forma contínua. Assim o derivativo continua atenuando perturbações sem reagir a degraus de referência.</p>
<p>O controlador já é um PID tradicional (E), e o problema não vem de ruído nem de perturbação (C, D).</p>` },

{ ano: 2014, n: 21, area: 'inst', gab: 'A',
  stem: `<p>Sensores ultrassônicos são usados na medição de grandezas como distância e nível. Alguns desses sensores emitem um sinal na frequência de 40 kHz que, ao atingir um objeto, retorna e, quando captado, permite calcular a distância do objeto ao sensor.</p>
<p>Nesse contexto, avalie as afirmações a seguir.</p>
<ol class="roman"><li>O cálculo da distância pode ser obtido usando-se equações da mecânica clássica.</li><li>Para evitar uma interferência entre o sinal enviado e sinais espúrios advindos de fontes eletromagnéticas, deve-se usar um filtro.</li><li>No caso específico de um sensor ultrassônico, o cálculo da distância baseia-se na variação da velocidade e, dessa forma, no efeito <i>doppler</i>.</li><li>Para uma leitura adequada do sinal desse sensor em um sistema de aquisição de dados, deve-se utilizar uma taxa de amostragem de no mínimo 80 kHz de forma a evitar o efeito <i>aliasing</i>.</li></ol>
<p>É correto apenas o que se afirma em</p>`,
  opts: ['I e IV.', 'II e III.', 'III e IV.', 'I, II e III.', 'I, II e IV.'],
  com: `<p><b>I – correta.</b> Tempo de voo: d = v·t/2, com v a velocidade do som. É cinemática elementar.</p>
<p><b>II – considerada incorreta pela banca.</b> O ultrassom é uma onda mecânica (acústica). As interferências relevantes são ecos e ruídos acústicos, e não fontes eletromagnéticas.</p>
<p><b>III – incorreta.</b> A medição de distância usa o tempo de ida e volta, e não o efeito Doppler (que mede velocidade).</p>
<p><b>IV – correta.</b> Pelo teorema de Nyquist, amostrar um sinal de 40 kHz exige pelo menos 80 kHz.</p>` },

{ ano: 2014, n: 22, area: 'comp', gab: 'C',
  stem: `<p>Um engenheiro, preocupado com o uso racional de energia, desenvolveu para a sala de sua residência um sistema microcontrolado para ajuste gradativo da iluminação por meio do acionamento de sete diferentes circuitos de iluminação e da abertura ou fechamento de janelas. O sistema contempla:</p>
<ol><li>sensores analógicos de luminosidade interna e externa com variação linear nominal do sinal de 0 a 5 V;</li><li>sensor digital de chuva, com nível alto quando está chovendo. O tratamento deste sinal deve ter prioridade sobre qualquer outra atividade do programa;</li><li>sistema de comando para abertura e fechamento da janela, realizado com um motor CC de 6 V com consumo de 30 W, acionado por um sinal PWM com frequência de chaveamento de 1 kHz e resolução de 1% na variação da largura dos pulsos;</li><li>comando digital de cada um dos circuitos de iluminação, possibilitando ajuste total da iluminação artificial do ambiente em diferentes níveis.</li></ol>
<p>Para seleção e programação do microcontrolador, avalie afirmações a seguir.</p>
<ol class="roman"><li>O microcontrolador deve possuir no mínimo uma entrada com função de interrupção externa.</li><li>Um circuito externo ao microcontrolador deve ser utilizado para acionar o motor.</li><li>O sensor de luz utilizado possui variação nominal de 0 a 5 V, porém, na sua calibração no ambiente real, suponha que o engenheiro observou que a variação limita-se a valores entre 2 V e 3 V. Nesse caso, para realizar a aquisição desta informação com 10 níveis de sensibilidade, é necessário que o conversor A/D tenha resolução mínima de 10 bits.</li></ol>
<p>É correto o que se afirma em</p>`,
  opts: ['I, apenas.', 'III, apenas.', 'I e II, apenas.', 'II e III, apenas.', 'I, II e III.'],
  com: `<p><b>I – correta.</b> A prioridade do sensor de chuva sobre qualquer outra tarefa pede uma interrupção externa.</p>
<p><b>II – correta.</b> 30 W a 6 V são 5 A, muito acima do que um pino de microcontrolador fornece (dezenas de mA). É preciso um driver (transistor, MOSFET ou ponte H).</p>
<p><b>III – incorreta.</b> 10 níveis em 1 V é um degrau de 0,1 V. Na faixa de 5 V do A/D, isso dá 50 níveis, e 6 bits (64 níveis) bastam.</p>` },

{ ano: 2014, n: 23, area: 'ctrl', gab: 'E',
  stem: `<p>Na modelagem um sistema linear invariante no tempo estável, foi levantada a sua resposta em frequência, obtendo-se os seguintes diagramas de Bode:</p>
${fig('y14_q23.png', 'Bode: módulo de −20 dB caindo para cerca de −40 dB perto de 1 rad/s, patamar até cerca de 100 rad/s e depois queda; fase de 0° com vale de cerca de −50° perto de 0,3 rad/s, volta a perto de 0° e termina em −90°')}
<p>A função de transferência que melhor representa o sistema é</p>`,
  opts: [g23(ns('−', '0,1'), fs('', '+', 10) + fs('', '+', 100)), g23(ns('−', 1), fs('', '+', '0,1') + fs('', '+', 100)), g23(ns('+', '0,1'), fs('', '+', 10) + fs('', '+', 100)), g23(ns('+', 1), fs('', '−', '0,1') + fs('', '+', 100)), g23(ns('+', 1), fs('', '+', '0,1') + fs('', '+', 100))],
  com: `<p>Leitura do diagrama:</p>
<ul><li>Ganho em baixa frequência de −20 dB, ou seja, 0,1.</li><li>A fase começa em 0° (ganho positivo) e termina em −90°: um polo a mais que zeros, todos de fase mínima.</li><li>O módulo cai a partir de ~0,1 rad/s (polo), estabiliza a partir de ~1 rad/s (zero) e volta a cair a partir de ~100 rad/s (polo).</li></ul>
<p>G(s) = (s+1)/((s+0,1)(s+100)) tem ganho estático 1/(0,1 × 100) = 0,1 = −20 dB. ✓</p>
<p>D tem um polo instável em +0,1, mas o enunciado diz que o sistema é estável. B tem zero de fase não mínima e A e C têm polos e zeros nas posições erradas.</p>` },

{ ano: 2014, n: 24, area: 'redes', gab: 'C',
  stem: `<p>As redes de comunicação são essenciais para o processo de automação industrial. Existem diversos tipos de rede, as quais se diferenciam em alguns aspectos, como topologia de conexão, tipos de dispositivos aos quais se conectam e velocidade de transmissão, entre outros. São exemplos de redes industriais: ASI, HART, DeviceNet, Profibus, Ethernet. Não existe uma rede certa ou errada, mas, sim, uma rede mais apropriada para determinada aplicação. De acordo com o tipo de dispositivo que as redes conectam, elas são classificadas em <i>Sensorbus</i>, <i>DeviceBus</i>, <i>FieldBus</i> e <i>Databus</i>. A figura abaixo apresenta um esquema da faixa de aplicação das redes.</p>
${fig('y14_q24.png', 'Faixas de aplicação: Sensorbus para dispositivos simples e controle lógico; DeviceBus intermediário; Fieldbus para dispositivos complexos e controle de processo; Ethernet abrangendo tudo')}
<p>Em relação à classificação das redes de comunicação para automação, avalie afirmações a seguir.</p>
<ol class="roman"><li>As redes <i>Sensorbus</i> são de baixo custo, utilizadas para a comunicação de sensores e atuadores discretos, contemplando distâncias pequenas.</li><li>As redes <i>Devicebus</i> conectam dispositivos como CLPs, controladores, sistemas de medição inteligentes, <i>drivers</i> e outros dispositivos que se comunicam por dados em formato de <i>bytes</i>.</li><li>As redes <i>Fieldbus</i> conectam dispositivos microprocessados e podem transmitir vários tipos de dados: discretos, analógicos, parâmetros, programas e informações de usuários.</li><li>As redes <i>Fieldbus</i> são mais apropriadas para aplicações de controle de processos distribuídos porque possuem alta taxa de transmissão de dados.</li></ol>
<p>É correto apenas o que se afirma em</p>`,
  opts: ['II.', 'I e IV.', 'I, II e III.', 'I, III e IV.', 'II, III e IV.'],
  com: `<p><b>I, II e III – corretas.</b> Descrevem a classificação usual: <i>sensorbus</i> (bits, como AS-i), <i>devicebus</i> (bytes, como DeviceNet) e <i>fieldbus</i> (blocos de dados, dispositivos inteligentes, como Profibus PA e FF).</p>
<p><b>IV – incorreta.</b> O <i>fieldbus</i> é adequado ao controle de processos pela capacidade de transmitir blocos de dados e distribuir funções, e não por ter alta taxa de transmissão. A Foundation Fieldbus H1, por exemplo, opera a apenas 31,25 kbit/s.</p>` },

{ ano: 2014, n: 25, area: 'inst', gab: 'B',
  stem: `<p>A figura abaixo representa um sensor de vazão de vórtice volumétrico (composto por transdutor e transmissor) instalado em uma tubulação para medição de vazão de água que abastece uma caldeira, na qual é arbitrado um sentido de fluxo. Esse sensor pode ser adquirido na configuração 4-20 mA/0-20 m³/h ou 0-10 V/0-20 m³/h.</p>
${fig('y14_q25.png', 'Medidor de vazão tipo vórtice instalado entre flanges na tubulação, com seta de fluxo')}
<p class="src">CONTECH. Contech Séries M22 e M23 medidores de vazão de vórtice volumétrico Pro-V™. Disponível em: &lt;http://www.contechind.com.br&gt;. Acesso em: 28 jul. 2014.</p>
<p>Nesse contexto, avalie as afirmações a seguir.</p>
<ol class="roman"><li>As duas configurações apresentam o mesmo alcance (<i>span</i>).</li><li>As duas configurações apresentam a mesma faixa de medida (<i>range</i>).</li><li>A medição de vazão de água independe do sentido de passagem de fluxo de água arbitrado no sensor.</li><li>O sensor com configuração 0-10 V/0-20 m³/h fornece menor confiabilidade que o sensor com configuração 4-20 mA/0-20 m³/h.</li><li>A configuração 0-10 V/0-20 m³/h tem melhor imunidade a ruído, enquanto a configuração 4-20 mA/0-20 m³/h é melhor para aplicações em pequenas distâncias.</li></ol>
<p>É correto apenas o que se afirma em</p>`,
  opts: ['I e V.', 'I, II e IV.', 'I, III e IV.', 'II, III e V.', 'II, III, IV e V.'],
  com: `<p><b>I e II – corretas.</b> As duas medem de 0 a 20 m³/h: mesma faixa e mesmo span (20 m³/h). A diferença está só no sinal de saída.</p>
<p><b>III – incorreta.</b> O medidor de vórtice é direcional e deve ser instalado no sentido de fluxo indicado.</p>
<p><b>IV – correta.</b> No 4-20 mA, o "zero vivo" (4 mA) permite detectar fio rompido, e a corrente não sofre queda de tensão no cabo.</p>
<p><b>V – incorreta.</b> É o contrário: o laço de corrente tem melhor imunidade a ruído e serve para longas distâncias.</p>` },

{ ano: 2014, n: 26, area: 'ger', gab: 'C',
  stem: `<p>Os sistemas integrados de manufatura (SIM) apresentam uma abordagem estratégica embasada em tecnologia, que respondem aos desafios competitivos de fabricação. Uma forma de caracterizar esses sistemas é a partir da matriz de variedade (de partes/peças diferentes) e volume (da quantidade de partes/peças produzidas) da manufatura, conforme ilustra a figura abaixo.</p>
${fig('y14_q26.png', 'Matriz 3×3: volume crescente da coluna 1 para a 3 e variedade crescente da linha A para a C')}
<p>Considerando a matriz de variedade x volume representada na figura, avalie as afirmações a seguir.</p>
<ol class="roman"><li>Sistemas totalmente dedicados são adequados para produzir uma variedade limitada de configurações de partes/peças, no entanto, podem trabalhar com volumes muito altos de produção, ocupando a faixa A3 da matriz.</li><li>Sistemas flexíveis de manufatura (FMS) podem ocupar o nível mais alto da matriz de volume e variedade, ocupando a faixa C3, ou seja, são capazes de se adequar a alta variedade de partes/peças e alto volume de produção de partes/peças.</li><li>Sistemas que utilizam máquinas baseadas em CNC (computador numericamente controlado) podem trabalhar com alta variedade de programação de partes/peças, ocupando a faixa C1 da matriz, mas podem ser inviáveis economicamente se os volumes não forem baixos.</li></ol>
<p>É correto o que se afirma em</p>`,
  opts: ['I, apenas.', 'II, apenas.', 'I e III, apenas.', 'II e III, apenas.', 'I, II e III.'],
  com: `<p><b>I – correta.</b> Linhas dedicadas (transfer) ficam em baixa variedade e alto volume (A3).</p>
<p><b>II – incorreta.</b> O FMS ocupa a região intermediária (em torno de B2). Nenhum sistema atende ao mesmo tempo variedade e volume máximos (C3).</p>
<p><b>III – correta.</b> Máquinas CNC isoladas atendem alta variedade com baixo volume (C1).</p>` },

{ ano: 2014, n: 27, area: 'ctrl', gab: 'D',
  stem: `<p>Um processo que envolve uma antena pode ser representado pelo sistema de 3ª. ordem apresentado na figura I.</p>
${fig('y14_q27_f1.png', 'Malha com controlador K, planta 1/(s(s+1)(s+5)) e H(s) = 1', 'Figura I')}
<p>A figura II apresenta o lugar das raízes desse sistema, em malha aberta, quando se varia o ganho K.</p>
${fig('y14_q27_f2.png', 'Lugar das raízes com dois ramos cruzando o eixo imaginário', 'Figura II')}
<p>Considerando que o ganho K é positivo e pode variar de 0 a infinito, avalie as afirmações a seguir.</p>
<ol class="roman"><li>Um sistema com 10 &lt; K &lt; 20 é estável.</li><li>Para K = 60, o sistema é criticamente amortecido.</li><li>Existe um valor de K que torna o sistema marginalmente estável.</li><li>O sistema com K = 30 apresenta resposta temporal, para uma entrada de degrau unitário, com oscilações constantes e de mesma amplitude.</li></ol>
<p>É correto apenas o que se afirma em</p>`,
  opts: ['I e II.', 'I e III.', 'II e IV.', 'I, III e IV.', 'II, III e IV.'],
  com: `<p>Equação característica: s³ + 6s² + 5s + K = 0. Pelo critério de Routh, a linha s¹ é (30 − K)/6.</p>
<ul><li>Estável para 0 &lt; K &lt; 30. Logo, <b>I é correta</b>.</li><li>K = 60 é instável. <b>II é incorreta</b>.</li><li>Em K = 30 os polos estão no eixo imaginário (s = ±j√5): sistema marginalmente estável. <b>III é correta</b>.</li><li>Com polos em ±j√5, a resposta tem oscilação sustentada de amplitude constante. <b>IV é correta</b>.</li></ul>` },

{ ano: 2014, n: 28, area: 'inst', gab: 'B',
  stem: `<p>A figura abaixo contém a representação esquemática de uma aplicação para o controle de temperatura de um forno utilizando um controlador lógico programável (CLP). O sensor de temperatura em conjunto com o transdutor fornece um sinal analógico 0-10 V / 20-150°C enviado ao CLP, o qual por sua vez, envia um sinal de 0-20 mA para a válvula, permitindo a variação de sua abertura e a dosagem gradativa da quantidade de combustível enviado ao forno. Assim, pode-se modificar a temperatura do forno conforme a necessidade.</p>
${fig('y14_q28.png', 'CLP com unidades A/D e D/A; sinal 0-20 mA para a válvula proporcional de combustível; sensor de temperatura 0-10 V / 20-150 °C no forno', 'Figura 1')}
<p class="src">PRUDENTE. <b>Automação industrial</b>: PLC, teoria e aplicações (curso básico). Rio de Janeiro: LTC, 2010 (adaptado).</p>
<p>Em relação ao sistema de automação apresentado, avalie as afirmações a seguir.</p>
<ol class="roman"><li>O uso da unidade A/D de 8 bits no CLP permite aquisição de temperatura com uma resolução de, aproximadamente, 0,508 °C.</li><li>A unidade D/A no CLP pode ser substituída por um módulo de saída digital a relé especificado para um valor de saída de corrente de até 10 A, valor maior que o sinal de saída enviado para a válvula.</li><li>Para comunicação entre o CLP e um sistema SCADA (<i>supervisory control and data acquisition</i>), podem ser usadas, entre outras, rede industrial PROFIBUS ou comunicação serial com protocolo MODBUS, sendo a primeira mais onerosa que a segunda.</li><li>O sistema supervisório pode ser programado diretamente no CLP, sem a necessidade de dispositivos adicionais, reduzindo o custo de implementação do sistema como um todo.</li><li>A realização dessa automação requer um CLP de grande porte, devido ao sistema operar em malha fechada, o que implica o uso de blocos específicos de programação.</li></ol>
<p>É correto apenas o que se afirma em</p>`,
  opts: ['I e II.', 'I e III.', 'II e IV.', 'III e V.', 'IV e V.'],
  com: `<p><b>I – correta.</b> Faixa de 150 − 20 = 130 °C dividida por 2⁸ = 256 níveis ≈ 0,508 °C.</p>
<p><b>II – incorreta.</b> Uma saída a relé é liga/desliga e não gera o sinal proporcional de 0-20 mA que a válvula precisa.</p>
<p><b>III – correta.</b> As duas redes servem, e Profibus (hardware e interfaces dedicadas) costuma ser mais cara que Modbus serial.</p>
<p><b>IV – incorreta.</b> O supervisório roda em um computador ou IHM à parte, e não no CLP.</p>
<p><b>V – incorreta.</b> Uma malha PID simples roda em CLPs pequenos, que já trazem blocos de PID.</p>` },

{ ano: 2014, n: 29, area: 'rob', gab: 'D',
  stem: `<p>O estudo da cinemática direta de um manipulador robótico tem como objetivo obter equações para o cálculo da posição e da orientação do efetuador do robô em relação à sua base como função das variáveis das juntas. Para determinar as equações da cinemática direta de manipuladores robóticos de cadeia aberta, usualmente são utilizados os parâmetros de Denavit-Hartenberg. O quadro abaixo traz esses parâmetros para um robô comercial específico.</p>
<p>Parâmetros de Denavit-Hartenberg</p>
<div class="tbl"><table class="std"><thead><tr><th>Junta i</th><th>α<sub>i</sub> (graus)</th><th>a<sub>i</sub> (cm)</th><th>d<sub>i</sub></th><th>θ<sub>i</sub> (graus)</th></tr></thead><tbody>
<tr><td>1</td><td>0</td><td>0</td><td>50</td><td>θ<sub>1</sub></td></tr><tr><td>2</td><td>90</td><td>0</td><td>d<sub>2</sub></td><td>90</td></tr><tr><td>3</td><td>0</td><td>0</td><td>d<sub>3</sub></td><td>0</td></tr><tr><td>4</td><td>0</td><td>0</td><td>150</td><td>θ<sub>4</sub></td></tr><tr><td>5</td><td>0</td><td>0</td><td>10</td><td>θ<sub>5</sub></td></tr></tbody></table></div>
<p>Com base na situação descrita, avalie as asserções a seguir e a relação proposta entre elas.</p>
<ol class="roman"><li>O robô comercial apresentado possui cinco graus de liberdade, sendo classificado como robô do tipo polar.</li></ol>
<p class="center"><b>PORQUE</b></p>
<ol class="roman" start="2"><li>Das cinco variáveis do robô, as que correspondem às três primeiras juntas são: uma de rotação e duas de translação, respectivamente.</li></ol>
<p>A respeito dessas asserções, assinale a opção correta.</p>`,
  opts: asr,
  com: `<p>As variáveis de junta são θ<sub>1</sub>, d<sub>2</sub>, d<sub>3</sub>, θ<sub>4</sub> e θ<sub>5</sub>: cinco graus de liberdade.</p>
<p><b>II – verdadeira.</b> As três primeiras juntas são R, P, P.</p>
<p><b>I – falsa.</b> A configuração RPP é <b>cilíndrica</b>. O robô polar (esférico) tem as três primeiras juntas RRP.</p>` },

{ ano: 2014, n: 30, area: 'inst', gab: 'A',
  stem: `<p>Um engenheiro de controle e automação necessita especificar um transdutor de temperatura para um projeto de controle automático de um forno. É requisito de projeto que o controlador lógico programável (CLP) esteja localizado na sala de comando, a qual está a uma distância de 300 metros do forno.</p>
<p>Nesse contexto, considerando-se que o engenheiro escolheu um transdutor com transmissão no padrão 4 mA a 20 mA, avalie as seguintes asserções e a relação proposta entre elas.</p>
<ol class="roman"><li>A transmissão de sinal de transdutores distantes do CLP é mais segura no padrão 4 mA a 20 mA, que nos padrões 0 V a 5 V ou 0 mA a 20 mA.</li></ol>
<p class="center"><b>PORQUE</b></p>
<ol class="roman" start="2"><li>No padrão 4 mA a 20 mA é possível identificar perda de sinal nos cabos de transmissão, como, por exemplo, por problemas de rompimento de cabo ou desconexão com o CLP.</li></ol>
<p>A respeito dessas asserções, assinale a opção correta.</p>`,
  opts: asr,
  com: `<p><b>I – verdadeira.</b> Em longas distâncias, um sinal em corrente não sofre com a queda de tensão no cabo e é mais imune a ruído do que um sinal em tensão.</p>
<p><b>II – verdadeira e justifica a I.</b> Com o "zero vivo" de 4 mA, uma leitura de 0 mA indica falha (cabo rompido ou desconectado), algo que não se distingue de um valor válido no padrão 0-20 mA ou 0-5 V. Isso torna a transmissão mais segura.</p>` },

{ ano: 2014, n: 31, area: 'pot', gab: 'A',
  stem: `<p>O <i>soft-starter</i> é um dispositivo eletrônico formado por seis tiristores, sendo utilizado para a partida de motores de indução em gaiola. O diagrama a seguir ilustra uma aplicação desse dispositivo.</p>
${fig('y14_q31.png', 'Rede trifásica, três pares de tiristores em antiparalelo e motor de indução, com circuito de controle e disparo')}
<p>Considerando o diagrama acima e os princípios de funcionamento de uma máquina de indução, avalie as afirmações a seguir.</p>
<ol class="roman"><li>A finalidade principal do <i>soft-starter</i> é reduzir a corrente de partida em motores de indução em gaiola.</li><li>A configuração do diagrama permite utilizar o <i>soft-starter</i> para realizar a frenagem do motor de indução.</li><li>O <i>soft-starter</i> também pode ser utilizado para controlar a velocidade do motor de indução em gaiola para aplicações em servomecanismos.</li><li>Para realizar a partida suave do motor, o <i>soft-starter</i> varia a frequência da tensão aplicada ao motor, iniciando em 0 Hz (máquina parada) e aumentando gradativamente até atingir a frequência nominal.</li></ol>
<p>É correto apenas o que se afirma em</p>`,
  opts: ['I e II.', 'I e III.', 'III e IV.', 'I, II e IV.', 'II, III e IV.'],
  com: `<p><b>I – correta.</b> Controlando o ângulo de disparo, o soft-starter aplica tensão reduzida e crescente, limitando a corrente de partida.</p>
<p><b>II – correta.</b> A mesma ponte de tiristores permite parada suave (rampa de desaceleração) e frenagem por injeção de corrente contínua, recurso comum nesses equipamentos.</p>
<p><b>III – incorreta.</b> Variar só a tensão não controla a velocidade com precisão nem com torque adequado para servomecanismos. Para isso usa-se inversor de frequência ou servoacionamento.</p>
<p><b>IV – incorreta.</b> A frequência é sempre a da rede. Quem varia a frequência é o inversor.</p>` },

{ ano: 2014, n: 32, area: 'disc', gab: 'E',
  stem: `<p>O sistema de distribuição de peças mostrado na figura I é composto por uma esteira de entrada de peças (E1), uma esteira de distribuição de peças (E2), duas esteiras de saída (E3 e E4), e dois cilindros pneumáticos de ação simples com posição de repouso recuado (C1 e C2). As esteiras de saída E3 e E4 estão sempre ligadas.</p>
${fig('y14_q32_f1.png', 'Esteira E1 entrando em E2; E3 sob o cilindro C1 e E4 sob o cilindro C2; sensores a, b, c, d, e, g', 'Figura I')}
<p>O sistema deve funcionar de forma que as peças devem ser distribuídas para as esteiras de saída E3 e E4, alternadamente, isto é, quando uma peça é empurrada pelo cilindro C1, a próxima deve ser empurrada pelo cilindro C2, e vice-versa. A primeira peça que entra no sistema deve ser distribuída para a esteira E3. Os sinais binários do sistema são apresentados no quadro 1 e a figura II apresenta o diagrama Ladder que controla o sistema, em que a linha 3 está omitida.</p>
${fig('y14_q32_q.png', 'Quadro 1 com os significados dos sinais a, b, c, d, e, g, E1, E2, C1 e C2', 'Quadro 1')}
${fig('y14_q32_f2.png', 'Ladder com linhas 1, 2, 4, 5 e 6 e a linha 3 em branco; a linha 5 usa E2, d e h para setar C2 e resetar E2 e h', 'Figura II')}
<p>Com base nas informações apresentadas, conclui-se que a linha 3 que completa o código corretamente no diagrama é</p>`,
  opts: [img('y14_q32_A.png'), img('y14_q32_B.png'), img('y14_q32_C.png'), img('y14_q32_D.png'), img('y14_q32_E.png')],
  com: `<p>A memória <b>h</b> registra para onde vai a próxima peça. Pela linha 5, quando h = 1 a peça segue até d, C2 empurra e h é resetado.</p>
<p>A linha 3 deve fazer o complementar: com a esteira E2 ligada, peça em frente a C1 (c) e h = 0 (contato NF) → aciona C1 (S), para E2 (R) e marca h (S), para que a próxima peça passe direto até C2.</p>
<p>É a opção E. A e C usam E1 no lugar de E2. B inverte c e h. D reseta h e liga E2 em vez de fazer o contrário.</p>` },

{ ano: 2014, n: 33, area: 'inst', gab: 'A',
  stem: `<p>Um veículo aéreo não tripulado (VANT), também chamado UAV (do inglês <i>Unmaned Aerial Vehicle</i>), é todo e qualquer tipo de aeronave que não necessita de pilotos embarcados para ser guiada. Esses veículos são controlados por meios eletrônicos e computacionais, sob a supervisão humana remota ou sem a sua intervenção.</p>
<p class="src">Disponível em: &lt;http://pt.wikipedia.org/&gt;. Acesso em: 13 ago. 2014 (adaptado).</p>
<p>A respeito da navegação autônoma dos VANTs, avalie as afirmações a seguir.</p>
<ol class="roman"><li>O GPS tem como funcionalidade básica determinar coordenadas geográficas.</li><li>O acelerômetro tem como funcionalidade básica determinar variação na orientação.</li><li>O giroscópio tem como funcionalidade básica determinar variação no posicionamento.</li></ol>

<p><b>II – incorreta.</b> O acelerômetro mede aceleração linear. A variação de orientação é medida pelo giroscópio.</p>
<p><b>III – incorreta.</b> O giroscópio mede velocidade angular, ou seja, variação de orientação, e não de posição.</p>
<p>As afirmações II e III trocam as funções dos dois sensores.</p>` },

{ ano: 2014, n: 34, area: 'disc', gab: 'D',
  stem: `<p>Um projeto de automação de um sistema consiste em botoeiras de liga e desliga locais com requisito de desligamento seguro, de modo que, em caso de desconexão da botoeira de desliga do CLP, o sistema deverá desligar automaticamente e não permitir novo ligamento local até que a botoeira de desliga seja destravada.</p>
<p>Considerando que BL é a botoeira de liga, BD é a botoeira de desliga e K1 é a carga a ser acionada, o circuito que implementa a lógica de liga/desliga com selo e com o desligamento seguro requisitado é</p>`,

  com: `<p>Para o desligamento ser seguro em caso de fio rompido, a botoeira de desliga precisa ser <b>normalmente fechada (NF)</b> na ligação física. Assim, em operação normal a entrada I4 fica em 1, e qualquer desconexão leva I4 a 0, como se BD tivesse sido pressionada.</p>
<p>No programa, I4 entra então como contato <b>NA</b> em série com o selo (I1 em paralelo com Q1). Além disso, o requisito de só religar após "destravar" pede uma botoeira com <b>trava</b>.</p>
<p>A opção D reúne os três pontos: BD NF com trava, I4 NA no Ladder e selo com Q1. As outras usam BD NA na ligação (falha insegura) ou I4 NF no programa.</p>` },

{ ano: 2014, n: 35, area: 'inst', gab: 'E',
  stem: `<p>Um engenheiro de controle e automação, responsável por gerenciar a instalação de um sistema de controle de um reservatório de água quente de um hospital, deve assessorar a equipe encarregada de sua montagem. A malha de controle do tanque de aquecimento está representada na figura abaixo.</p>
${fig('y14_q35.png', 'Tanque com LT1 e LIC1 atuando na válvula da carga de entrada; TE1, TY1A, TIC1 e TY1B atuando na resistência R')}

<p>Com base na análise do diagrama de instrumentação e controle, escolha a opção em que as variáveis manipuladas (MV) e as variáveis de processo (PV) estão corretamente relacionadas na forma MV / PV para uma mesma malha de controle.</p>`,

  com: `<p>Duas malhas:</p>
<ul><li><b>Nível</b>: LT1 mede o nível (PV), e LIC1 atua na válvula da carga, ou seja, na vazão de entrada (MV).</li><li><b>Temperatura</b>: TE1/TY1A medem a temperatura (PV), e TIC1/TY1B atuam na tensão da resistência (MV).</li></ul>

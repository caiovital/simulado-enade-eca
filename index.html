  com: `<ul><li><b>X = X + E·Kx</b> acumula o erro a cada ciclo. É uma soma, a forma discreta da integral.</li>
<li><b>Y = E·Ky</b> é proporcional ao erro atual.</li>
<li><b>Z = (E − E_anterior)·Kz</b> é a diferença entre erros consecutivos, ou seja, uma aproximação da derivada.</li></ul>
<p>Observação de projeto: no código, as variáveis são locais e não inicializadas dentro de <code>loop()</code>. Na prática, X e E_anterior deveriam ser <code>static</code> ou globais para guardar o valor entre ciclos.</p>` },

{ ano: 2019, n: 19, area: 'inst', gab: 'E',
  stem: `<p>A Ponte de Wheatstone, ilustrada na figura a seguir, é um circuito elétrico utilizado para determinação de uma resistência elétrica de valor desconhecido. Essa resistência é obtida no momento em que essa ponte se encontra em equilíbrio (V = 0), ou seja, R<sub>1</sub>R<sub>3</sub> = R<sub>x</sub>R<sub>2</sub>.</p>
${fig('y19_q19_f1.png', 'Ponte de Wheatstone com R1, R2, Rx e R3 alimentada por Vcc')}
<p>O PTC (<i>positive temperature coefficient</i>), ou seja, o termistor, é um componente cuja resistência elétrica varia em relação direta com a temperatura. O gráfico a seguir, em escala logarítmica, apresenta a taxa de variação de resistência elétrica em função da temperatura para o termistor PTC TDK D105, modelo TPT1058-Z.</p>
${fig('y19_q19_f2.png', 'Curva do PTC em escala log: resistência sobe de cerca de 70 Ω a 10 °C até cerca de 3 MΩ a 160 °C, passando por cerca de 300 kΩ a 120 °C')}
<p class="src">Disponível em &lt;https://www.tdk-electronics.tdk.com&gt;. Acesso em: 16 ago. 2019 (adaptado).</p>
<p>Considerando-se a taxa de variação desse termistor, cuja temperatura de sensibilidade é de 60 °C, acoplado no interior de uma autoclave cuja temperatura é de 120 °C, qual será o valor da resistência elétrica (R<sub>1</sub>), para que a Ponte de Wheatstone atinja o equilíbrio (R<sub>2</sub> = 100 kΩ e R<sub>3</sub> = 50 kΩ)?</p>`,
  opts: ['100 kΩ', '300 kΩ', '400 kΩ', '500 kΩ', '600 kΩ'],
  com: `<p>O termistor é o R<sub>x</sub>. Na curva, a 120 °C, R<sub>x</sub> ≈ 3 × 10<sup>5</sup> Ω = 300 kΩ.</p>
<p class="eq">R<sub>1</sub> = R<sub>x</sub>·R<sub>2</sub> / R<sub>3</sub> = 300 k × 100 k / 50 k = 600 kΩ</p>
<p>O distrator de 300 kΩ é o valor do próprio termistor, sem aplicar a condição de equilíbrio.</p>` },

{ ano: 2019, n: 20, area: 'ger', gab: 'D',
  stem: `<p>O gestor de uma pequena indústria alimentícia pretende automatizar o sistema de distribuição de água, apresentado na figura, para aumentar a margem de lucro estimado em R$ 2.000,00 por mês.</p>
${fig('y19_q20.png', 'Reservatório alimentando dois tanques por V1 e V2, com sensores h1, b1, h2, b2 e válvulas de saída W1 e W2; botão m')}
<p>Legenda: m: botão de comando; h<sub>1</sub>, b<sub>1</sub> e h<sub>2</sub>, b<sub>2</sub>: sensores de nível; V<sub>1</sub> e V<sub>2</sub>: válvulas do tipo abre/fecha; W<sub>1</sub> e W<sub>2</sub>: válvulas com controle proporcional.</p>
<p>A tabela a seguir apresenta quatro orçamentos para implantação do sistema.</p>

<tr><th>Custo total</th><td>R$ 18.000,00</td><td>R$ 30.000,00</td><td>R$ 22.000,00</td><td>R$ 16.000,00</td></tr></tbody></table></div>
<p>Com base nas informações técnicas e financeiras apresentadas na tabela e considerando que todo o lucro obtido mensalmente devido à implantação do sistema automatizado será utilizado para pagá-lo em um prazo de 12 meses, avalie as afirmações a seguir.</p>

<li>A proposta da Empresa D não atende aos critérios técnicos e financeiros para implantação do sistema.</li></ol>
<p>É correto o que se afirma em</p>`,

  com: `<p><b>Requisito técnico:</b> 5 entradas digitais (m, h1, b1, h2, b2), 2 saídas digitais (V1, V2) e 2 saídas analógicas (W1, W2 proporcionais).</p>
<p><b>Requisito financeiro:</b> 12 × R$ 2.000 = R$ 24.000 no máximo.</p>

{ ano: 2019, n: 21, area: 'ctrl', gab: 'A',
  stem: `<p>Para o controle da variável de um processo de primeira ordem, foi desenvolvido um sistema em malha fechada, utilizando-se controle proporcional, integral e derivativo (PID). O diagrama de blocos da figura a seguir representa o sistema implementado.</p>
${fig('y19_q21_f1.png', 'Diagrama de blocos PID paralelo com ganhos Kp, Ki (com integrador) e Kd (com derivador) atuando sobre o processo')}
<p>Após um ajuste do sistema e testes preliminares, obteve-se a resposta representada no gráfico a seguir. A referência foi fixada na amplitude 5, no entanto, a variável do processo estabilizou-se abaixo desta referência, caracterizando erro em regime permanente.</p>
${fig('y19_q21_f2.png', 'Referência em 5 e variável do processo estabilizando perto de 4,2 após pequena oscilação')}
<p>Com base no gráfico apresentado, assinale a opção em que são apresentados, respectivamente, o ajuste de sintonia que elimina o erro estacionário e a consequente resposta do sistema.</p>`,
  opts: ['Aumento do ganho integral (Ki), tornando a resposta mais lenta.', 'Aumento do ganho integral (Ki), tornando a resposta mais rápida.', 'Aumento do ganho proporcional (Kp), tornando a resposta mais lenta.', 'Aumento do ganho proporcional (Kp), tornando a resposta mais rápida.', 'Aumento do ganho derivativo (Kd), tornando a resposta mais lenta.'],
  com: `<p>Um processo de primeira ordem (tipo 0) sob ação proporcional sempre deixa erro ao degrau. O erro constante no gráfico indica ação integral ausente ou muito fraca.</p>
<ul><li>Só a <b>ação integral</b> zera o erro estacionário, porque acrescenta um polo na origem. Aumentar Kp só reduz o erro, sem eliminá-lo, e Kd não atua no regime permanente.</li>
<li>Pelo gabarito, a consequência é uma resposta <b>mais lenta</b>: o integrador introduz atraso de fase de 90°, e a parcela final do erro é eliminada aos poucos, à medida que a integral se acumula.</li></ul>` },

{ ano: 2019, n: 22, area: 'ctrl', gab: 'A',
  stem: `<p>Os controladores lógicos programáveis (CLP) são utilizados na indústria para controle e automação de processos industriais. Um sistema de controle típico pode ser visto na figura a seguir, em que o CLP é indicado com algumas de suas partes principais: o processador e os conversores analógico-digital (A/D) e digital-analógico (D/A).</p>
${fig('y19_q22.png', 'Malha com CLP contendo A/D, processador, clock e D/A, planta com perturbação w(t) e sensor na realimentação')}
<p class="src">Disponível em: &lt;http://www.me.unm.edu&gt;. Acesso em: 05 jun. 2019 (adaptado).</p>
<p>Para execução da tarefa de implementação do controle do tipo proporcional integral (PI) nesse CLP, foi apresentada a função de transferência discreta do controlador já sintonizado, expressa pela equação a seguir.</p>
<p class="eq center">${M(`<msub><mi>G</mi><mtext>controlador</mtext></msub><mo>=</mo><mfrac><mrow><mn>3</mn><mo>−</mo><mn>2,5</mn><msup><mi>z</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup></mrow><mrow><mn>1</mn><mo>−</mo><msup><mi>z</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup></mrow></mfrac>`)}</p>
<p>Com base na função de transferência, qual equação deve ser implementada no CLP?</p>`,
  opts: ['u[k] = u[k − 1] + 3e[k] − 2,5e[k − 1]', `u[k] = ${M(fr('1', '3'))} u[k − 1] + ${M(fr('1', '3'))} e[k] − ${M(fr('2,5', '3'))} e[k − 1]`, 'u[k] = 3u[k − 1] + 2,5e[k] − e[k − 1]', 'u[k] = u[k + 1] + 3e[k] − 2,5e[k + 1]', 'u[k] = 3u[k + 1] + 2,5e[k] − e[k + 1]'],
  com: `<p>G = U(z)/E(z). Multiplicando em cruz:</p>
<p class="eq">U(z)(1 − z<sup>−1</sup>) = E(z)(3 − 2,5z<sup>−1</sup>)</p>
<p>Como z<sup>−1</sup> corresponde a um atraso de uma amostra:</p>
<p class="eq">u[k] − u[k−1] = 3e[k] − 2,5e[k−1] → u[k] = u[k−1] + 3e[k] − 2,5e[k−1]</p>
<p>É a forma incremental (de velocidade) do PI. D e E usam amostras futuras (k+1) e, por isso, não são implementáveis em tempo real.</p>` },

{ ano: 2019, n: 23, area: 'circ', gab: 'B',
  stem: `<p>Uma indústria da área de alimentos necessita substituir uma etapa do seu sistema de controle, atualmente realizado por meio de um termostato, dispositivo pouco preciso no controle da temperatura. Assim, um engenheiro foi contratado para desenvolver o projeto de um circuito para controle de temperatura do tipo "liga-desliga" (ON/OFF) que atenda às seguintes especificações básicas:</p>
<ul><li>potência da resistência para o aquecimento: 600 W;</li><li>temperatura desejada: 40 °C;</li><li>utilização de dois sensores em pontos de leitura distintos.</li></ul>
<p>A figura a seguir apresenta o circuito de controle a ser desenvolvido pelo engenheiro, em que Vi<sub>sensor1</sub> é a leitura de tensão do sensor1 e Vi<sub>sensor2</sub> é a leitura de tensão do sensor2.</p>
${fig('y19_q23_f1.png', 'Dois comparadores com referências por divisores R1 = 6 kΩ com Rx e R2 = 8 kΩ com Ry a partir de 12 V; porta AND, inversor, optoacoplador e TRIAC acionando carga de 600 W')}
<p>No gráfico a seguir está representada a curva característica do sensor de temperatura do projeto.</p>
${fig('y19_q23_f2.png', 'Sensor linear: 1 V a cada 10 °C, 6 V a 60 °C')}
<p>Nesse contexto, para o desligamento do circuito de potência quando a temperatura alcançar 40 °C, os valores dos resistores Rx e Ry, respectivamente, são</p>`,
  opts: ['Rx = 4 kΩ e Ry = 3 kΩ.', 'Rx = 3 kΩ e Ry = 4 kΩ.', 'Rx = 3 kΩ e Ry = 3 kΩ.', 'Rx = 6 kΩ e Ry = 8 kΩ.', 'Rx = 8 kΩ e Ry = 3 kΩ.'],
  com: `<p>Pela curva, o sensor fornece 0,1 V/°C, ou seja, 4,0 V a 40 °C. Cada comparador deve ter referência de 4 V, gerada pelo divisor a partir de 12 V:</p>
<p class="eq">12·Rx / (6 k + Rx) = 4 → Rx = 3 kΩ<br>12·Ry / (8 k + Ry) = 4 → Ry = 4 kΩ</p>` },

{ ano: 2019, n: 24, area: 'ctrl', gab: 'B',
  stem: `<p>A figura a seguir ilustra a versão simplificada de quimiostato, um tipo de biorreator utilizado em processos de fabricação de produtos alimentícios e farmacêuticos, em que uma cultura de bactérias é continuamente alimentada para gerar um produto fermentado na saída.</p>
${fig('y19_q24.png', 'Quimiostato: alimentação bombeada para tanque agitado e produto bombeado na saída')}
<p>De forma simplificada, o funcionamento do sistema consiste em manter constantes o volume V de cultura e as vazões de entrada e saída, que devem ser iguais a J<sub>0</sub>, regulando a concentração C<sub>B</sub> de bactérias por meio da manipulação da concentração C<sub>I</sub> de alimento na entrada. O modelo desse processo pode ser aproximado por duas equações. A primeira descreve o crescimento da cultura de bactérias no interior do tanque:</p>
<p class="eq center">V·dC<sub>B</sub>/dt = −(J<sub>0</sub> + k<sub>1</sub>)C<sub>B</sub> + Vk<sub>2</sub>C<sub>A</sub></p>
<p>em que C<sub>A</sub> é a concentração de alimento no interior do tanque, k<sub>1</sub> e k<sub>2</sub> são constantes características de cada tipo de bactéria. A segunda equação descreve o consumo do alimento no interior do tanque, dada por:</p>
<p class="eq center">V·dC<sub>A</sub>/dt = J<sub>0</sub>C<sub>I</sub> − J<sub>0</sub>C<sub>A</sub> − k<sub>3</sub>VC<sub>B</sub></p>
<p>em que k<sub>3</sub> também é uma constante característica do tipo de bactéria em cultura. Manipulando-se essas expressões, obtém-se a função de transferência em malha aberta, apresentada a seguir.</p>
<p class="eq center">${M(`<mfrac><mrow><msub><mi>C</mi><mi>B</mi></msub><mo>(</mo><mi>s</mi><mo>)</mo></mrow><mrow><msub><mi>C</mi><mi>I</mi></msub><mo>(</mo><mi>s</mi><mo>)</mo></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mi>k</mi><mn>2</mn></msub><mi>V</mi><msub><mi>J</mi><mn>0</mn></msub></mrow><mrow><msup><mi>V</mi><mn>2</mn></msup><msup><mi>s</mi><mn>2</mn></msup><mo>+</mo><mo>(</mo><mn>2</mn><mi>V</mi><msub><mi>J</mi><mn>0</mn></msub><mo>+</mo><msub><mi>k</mi><mn>1</mn></msub><msup><mi>V</mi><mn>2</mn></msup><mo>)</mo><mi>s</mi><mo>+</mo><mo>(</mo><msubsup><mi>J</mi><mn>0</mn><mn>2</mn></msubsup><mo>+</mo><msub><mi>k</mi><mn>1</mn></msub><mi>V</mi><msub><mi>J</mi><mn>0</mn></msub><mo>+</mo><msub><mi>k</mi><mn>2</mn></msub><msub><mi>k</mi><mn>3</mn></msub><msup><mi>V</mi><mn>2</mn></msup><mo>)</mo></mrow></mfrac>`)}</p>
<p>Considere que a concentração de bactérias em regime permanente não pode ser inferior a 90% de um valor de referência C<sub>R</sub>, e que este sistema é controlado em malha fechada pela lei de controle C<sub>I</sub>(s) = K<sub>P</sub>(C<sub>R</sub>(s) − C<sub>B</sub>(s)).</p>
<p>Qual o valor mínimo de K<sub>p</sub> que satisfaz a condição de operação pretendida?</p>`,
  opts: [kpf('0,9'), kpf('9'), kpf('90'), kpf('−0,9'), kpf('−9')],
  com: `<p>Seja g o ganho estático da planta (s = 0):</p>
<p class="eq">g = k<sub>2</sub>VJ<sub>0</sub> / (J<sub>0</sub>² + k<sub>1</sub>VJ<sub>0</sub> + k<sub>2</sub>k<sub>3</sub>V²)</p>
<p>Com controle proporcional, o ganho estático de malha fechada é K<sub>p</sub>g / (1 + K<sub>p</sub>g). A exigência de no mínimo 90% fica:</p>
<p class="eq">K<sub>p</sub>g / (1 + K<sub>p</sub>g) ≥ 0,9 → K<sub>p</sub>g ≥ 9 → K<sub>p</sub> ≥ 9/g</p>
<p>Que é a expressão da opção B. A opção A confunde o ganho de malha fechada com o de malha aberta.</p>` },

{ ano: 2019, n: 25, area: 'ctrl', gab: 'E',
  stem: `<p>A figura a seguir é o diagrama esquemático de um sistema de suspensão semiativa, em que um atuador exerce uma força regulável, com o intuito de ajustar o amortecimento equivalente do sistema global.</p>
${fig('y19_q25.png', 'Massa m apoiada em amortecedor b, mola k e atuador de força F regulável')}
<p>Sabendo-se que a parte passiva do sistema corresponde a uma dinâmica de 2ª ordem subamortecida, o diagrama do lugar geométrico das raízes que melhor representa o comportamento global do sistema em função de K<sub>F</sub> é</p>`,
  opts: [img('y19_q25_A.png'), img('y19_q25_B.png'), img('y19_q25_C.png'), img('y19_q25_D.png'), img('y19_q25_E.png')],
  com: `<p>A parte passiva (massa-mola-amortecedor) <b>subamortecida</b> tem um par de polos complexos conjugados no <b>semiplano esquerdo</b>, com parte real negativa, pois b &gt; 0. Isso elimina B (polos sobre o eixo jω, que seria b = 0) e as opções com polos reais (C, D).</p>
<p>Ao regular o amortecimento por realimentação de velocidade (F = −K<sub>F</sub>ẋ), há um zero na origem. Os polos saem do par complexo, descrevem um arco circular e chegam ao eixo real, onde um ramo vai para o zero e o outro para −∞. É o desenho da opção E: mais K<sub>F</sub> significa mais amortecimento.</p>` },

{ ano: 2019, n: 26, area: 'pot', gab: 'C',
  stem: `<p>A utilização dos motores elétricos de pequeno porte, tais como o motor de passo, o motor C.C. e o servomotor C.C., vem crescendo continuadamente nas áreas de eletrônica embarcada, robótica, entretenimento, sistemas de segurança, sistemas de automação, entre outras.</p>
<p>Para cada um desses motores, os acionamentos devem ser distintos, pois seus princípios construtivos e de funcionamento são diferentes. Consequentemente, os <i>drivers</i> para controlar velocidade, posição e corrente devem seguir as próprias características.</p>
<p>Considerando esse contexto, avalie as afirmações a seguir, acerca da descrição do sistema de controle genérico dos referidos motores e de sua respectiva representação.</p>
<ol class="roman"><li>Para acionar o motor de passo de 4 bobinas (Figura 1), na configuração de passo inteiro, a sequência de pulsos deve ser realizada conforme indicado na Figura 1, para rotacionar sempre no mesmo sentido.
${fig('y19_q26_f1.png', 'Motor de passo com bobinas A, B, C, D e pulsos sequenciais VA, VB, VC, VD', 'Figura 1 – Esquema do motor de passo e da sequência de pulsos para acionamento.')}</li>
<li>Para acionar o servomotor C.C. (Figura 2), a sequência de pulsos deve ser simétrica, ou seja, a duração de tempo de um pulso na posição ON deve ser igual à duração de tempo de um pulso na posição OFF.
${fig('y19_q26_f2.png', 'Servomotor CC com sequência simétrica ON/OFF', 'Figura 2 – Esquema do servomotor C.C. e da sequência de pulsos para acionamento.')}</li>
<li>Para acionar ou controlar o motor C.C. (Figura 3), uma das técnicas é adotar sequência de pulsos na configuração P.W.M., em que se pode controlar de 0% até 100% da energia fornecida pela fonte.
${fig('y19_q26_f3.png', 'Motor CC chaveado por transistor com sinal PWM', 'Figura 3 – Esquema do motor C.C. e sequência de pulsos para acionamento.')}</li></ol>
<p>É correto o que se afirma em</p>`,
  opts: ['I, apenas.', 'II, apenas.', 'I e III, apenas.', 'II e III, apenas.', 'I, II e III.'],
  com: `<p><b>I – correta.</b> As bobinas são energizadas uma de cada vez, em ordem circular. Isso faz o rotor avançar um passo por pulso, sempre no mesmo sentido.</p>
<p><b>II – incorreta.</b> O servomotor é comandado pela <b>largura</b> do pulso (tipicamente 1 a 2 ms a cada 20 ms), que define a posição. Uma onda simétrica de 50% não comanda posições diferentes.</p>
<p><b>III – correta.</b> No PWM, a razão cíclica de 0% a 100% controla a tensão média no motor e, portanto, a velocidade.</p>` },

{ ano: 2019, n: 27, area: 'disc', gab: 'C',
  stem: `<p>Uma esteira de transporte de peças é dotada de três sensores, um indutivo (SA), um capacitivo (SB) e um fotoelétrico (SC), responsáveis por identificar o material que compõe as peças transportadas. As peças que passam pela esteira podem ser Plásticas Transparentes (PT), Plásticas Opacas (PO) ou Metálicas Opacas (MO). Os sinais dos sensores são enviados a um Controlador Lógico Programável (CLP) que tem a função de monitorar os sensores a fim de identificar as peças e exibir o resultado em um sistema supervisório. A esteira conta também com três barreiras capacitivas, B1, B2 e B3, cuja funcionalidade é identificar a posição das peças ao longo da esteira. As peças são colocadas e retiradas da esteira, uma a uma, por um manipulador robótico. A figura a seguir representa este processo.</p>
${fig('y19_q27_f1.png', 'Esteira com sensores SA, SB e SC e barreiras B1, B2 e B3')}
<p>O engenheiro responsável pelo projeto desenvolveu a programação <i>Ladder</i> ilustrada na figura a seguir.</p>
${fig('y19_q27_f2.png', 'Ladder com auxiliares AUXMO, AUXO e AUXCAP e saídas MO, PO e PT, com legenda')}
<p>Considerando as informações a respeito do processo e o diagrama Ladder desenvolvido, avalie as asserções a seguir e a relação proposta entre elas.</p>
<ol class="roman"><li>A lógica implementada em Ladder não é capaz de identificar corretamente os três tipos de peça.</li></ol>
<p class="center"><b>PORQUE</b></p>
<ol class="roman" start="2"><li>A forma como os sensores estão dispostos na esteira impossibilita a identificação da peça Plástica Transparente.</li></ol>`,
  opts: asr,
  com: `<p><b>I – verdadeira.</b> O sensor capacitivo SB não aparece em nenhuma linha do programa. A memória AUXCAP, que deveria registrar a detecção capacitiva, é selada pela saída PO, e a saída PT depende de AUXCAP. Com isso, uma peça transparente (não metálica e não vista pelo fotoelétrico) nunca é reconhecida.</p>
<p><b>II – falsa.</b> A disposição física dos sensores permite identificar os três materiais: o indutivo vê metal, o capacitivo vê qualquer material e o fotoelétrico distingue opaco de transparente. O problema está na lógica, e não no arranjo.</p>` },

{ ano: 2019, n: 34, area: 'comp', gab: 'A',
  stem: `<p>Uma empresa que fabrica peças para decoração criou um sistema inteligente utilizando uma plataforma com sensores lógicos que usa o algoritmo de busca em árvore binária para identificar automaticamente as peças que ela produz. As peças podem ser de metal ou madeira, e possuem algumas características próprias. O algoritmo a seguir descreve como é feita a implementação de busca em árvore binária para o sistema de identificação.</p>
<pre class="code">boolean tipo;       // tipo da peça.
boolean objeto;     // presença do objeto na plataforma.
boolean superficie; // tipo de superfície da peça de metal.
boolean tamanho;    // tamanho da peça de metal.
boolean tonalidade; // tonalidade da peça de madeira.
boolean forma;      // forma da peça de madeira.
int main(void){
  while (1){
    if(objeto==1) {
      printf("Há peça na plataforma");
      if(tipo==1){
        printf("A peça é metálica");
        if(superficie == 1){ printf("A peça é lisa"); }
        if(superficie == 0){
          printf("A peça é escovada");
          if(tamanho == 1){ printf("A peça é grande"); }
          if(tamanho == 0){ printf("A peça é pequena"); }
        }
      }
      if(tipo==0){
        if(tonalidade == 1){ printf("A peça é escura"); }
        if(tonalidade == 0){
          printf("A peça é clara");
          if(forma == 1){ print("A peça é cilíndrica"); }
          if(forma == 0){ printf("A peça é esférica"); }
        }
      }
    }
    else{ printf("Não há peça na plataforma"); }
  }
  return 0;
}</pre>
<p>Com base no algoritmo apresentado, assinale a opção que representa corretamente o diagrama de busca binária implementado.</p>`,
  opts: [img('y19_q34_A.png'), img('y19_q34_B.png'), img('y19_q34_C.png'), img('y19_q34_D.png'), img('y19_q34_E.png')],
  com: `<p>Siga os <code>if</code> aninhados:</p>
<ul><li>Objeto → Metal (tipo = 1) ou Madeira (tipo = 0).</li>

<p>A árvore A é a única com os filhos certos: Grande e Pequena sob Escovada, Cilíndrica e Esférica sob Clara. B pendura tamanho em Lisa, e E troca os níveis de forma e tamanho.</p>` }

{ ano: 2019, n: 'D5', area: 'ctrl', titulo: 'Controle de nível de vaso-pulmão',
  stem: `<p>Uma manobra comumente adotada nas indústrias de processos é usar tanques como vasos-pulmão para absorver algumas perturbações oriundas dos desajustes de operação da planta. Nesse caso, o controle estrito do nível desses equipamentos torna-se dispensável, uma vez que não há necessidade de se operar o equipamento no valor desejado exatamente, mas permitem-se flutuações próximas desse ponto.</p>
<p>Considere o projeto de um sistema de controle de nível de um vaso-pulmão, mostrado na figura, que pode armazenar um fluido na fase líquida e possui uma seção transversal A, uma vazão volumétrica de alimentação q<sub>0</sub>, e é descarregado com vazão volumétrica q por meio de uma bomba ideal. Sabe-se ainda que a vazão de descarga do vaso é a variável manipulada, e a vazão de alimentação é o distúrbio externo para essa malha de controle.</p>
${fig('y19_d5.png', 'Tanque de nível h com alimentação q0 e descarga q por bomba')}
<p>Acerca desse sistema de controle, faça o que se pede nos itens a seguir.</p>`,
  itens: [
    { id: 'a', txt: 'Apresente o modelo dinâmico no domínio do tempo que rege esse sistema. (valor: 3,0 pontos)',
      padrao: `<p>A equação que governa a dinâmica do tanque é obtida mediante a aplicação da lei de conservação de massa, a saber:</p>
<p class="eq">dm/dt = d(ρAh)/dt = ρ<sub>0</sub>q<sub>0</sub> − ρq</p>
<p>Por se tratar de um fluido na fase líquida é plausível assumir que a massa específica é constante. Logo, a equação resultante é</p>
<p class="eq">dh/dt = (1/A)·q<sub>0</sub> − (1/A)·q</p>`,
      check: [ { p: 1.5, t: 'Partiu do balanço de massa (acúmulo = entrada − saída).' },
               { p: 1.5, t: 'Chegou a A·dh/dt = q0 − q, com massa específica constante.' } ] },
    { id: 'b', txt: 'Determine a função de transferência em malha aberta que relaciona o nível do vaso com as respectivas vazões de alimentação e descarga. (valor: 3,0 pontos)',
      padrao: `<p>Partindo da equação da dinâmica do nível do tanque e aplicando a transformada de Laplace com condições iniciais nulas:</p>
<p class="eq">sH(s) = (1/A)·[Q<sub>0</sub>(s) − Q(s)] → H(s) = G(s)[Q<sub>0</sub>(s) − Q(s)], onde G(s) = 1/(As)</p>
<p>Estritamente, a expressão acima não é uma função de transferência porque há duas entradas (Q(s) e Q<sub>0</sub>(s)). Respostas que considerem só uma dessas entradas podem ser aceitas com metade da pontuação total.</p>`,
      check: [ { p: 1.5, t: 'Aplicou Laplace com condições iniciais nulas e obteve G(s) = 1/(As), um integrador.' },
               { p: 1.5, t: 'Relacionou H(s) às duas entradas: H(s) = G(s)[Q0(s) − Q(s)]. Com só uma entrada, vale metade.' } ] },
    { id: 'c', txt: 'Demonstre que uma vazão q<sub>0</sub> constante implica um erro em regime permanente, considerando a implementação de um controlador com apenas ação proporcional G<sub>c</sub>(s) = −K<sub>c</sub>. (valor: 4,0 pontos)',
      padrao: `<p>Assumindo que os demais elementos do sistema (bomba, sensores etc.) sejam ideais, a expressão para H(s) em malha fechada é</p>
<p class="eq">H(s) = H<sub>1</sub>(s)Q<sub>0</sub>(s) − H<sub>2</sub>(s)Q(s), com H<sub>1</sub>(s) = 1/(As + K<sub>C</sub>) e H<sub>2</sub>(s) = K<sub>C</sub>/(As + K<sub>C</sub>)</p>
<p>O erro em regime permanente é o ganho estático (1/K<sub>C</sub>) multiplicado pela amplitude da perturbação em regime permanente. Como esse ganho estático não é nulo, o erro em regime permanente também não é.</p>
<p>Alternativamente: com SP = 0, q<sub>0</sub> = 1/s (degrau) e G(s) = k/s (k = 1/A), H(s) = −k/(s(s + kK<sub>c</sub>)). Pelo teorema do valor final, h(∞) = lim<sub>s→0</sub> sH(s) = −1/K<sub>c</sub>, o que mostra o erro de regime permanente no caso regulatório com ação apenas proporcional.</p>`,
      check: [ { p: 1.5, t: 'Montou a malha fechada com Gc = −Kc e obteve H(s) em função da perturbação q0.' },
               { p: 1.5, t: 'Aplicou o teorema do valor final para um degrau de q0.' },
               { p: 1.0, t: 'Concluiu que o erro em regime é ±1/Kc, diferente de zero (só some com ação integral).' } ] }
  ] }
);

<ul><li>substitua lâmpadas incandescentes por fluorescentes compactas ou lâmpadas de LED;</li><li>evite usar o chuveiro elétrico com a chave na posição “inverno” ou “quente”;</li><li>acumule grande quantidade de roupa para ser passada a ferro elétrico de uma só vez;</li><li>evite o uso de tomadas múltiplas para ligar vários aparelhos simultaneamente;</li><li>utilize, na instalação elétrica, fios de diâmetros recomendados às suas finalidades.</li></ul>
<p>A característica comum a essas recomendações é a proposta de economizar energia por intermédio da redução</p>`,
  opts: ['da potência de aparelhos e dispositivos elétricos.', 'do tempo de utilização de aparelhos e dispositivos elétricos.', 'do consumo de energia elétrica convertida em energia térmica.', 'do consumo de energia elétrica por correntes de fuga.', 'do consumo de energia térmica convertida em energia elétrica.'],
  com: `<p>Todas as recomendações combatem a conversão de energia elétrica em calor (efeito Joule):</p>
<ul><li>lâmpadas incandescentes perdem a maior parte da energia como calor;</li><li>chuveiro no "inverno" e ferro de passar são resistências de aquecimento (o ferro gasta para reaquecer a cada uso);</li><li>tomadas múltiplas e fios subdimensionados aquecem por excesso de corrente e resistência.</li></ul>
<p>As opções A e B valem só para algumas recomendações, e não para todas.</p>` },

{ ano: 2017, n: 17, area: 'mat', gab: 'D',
  stem: `<p>A importância da otimização no processo produtivo é inegável. Do ponto de vista matemático, para otimizar determinada grandeza, é necessário modelá-la de acordo com uma função e, a partir daí, conforme a situação, procurar um máximo ou um mínimo. Uma das formas usadas para minimizar funções é o método dos multiplicadores de Lagrange.</p>
<p>Um fabricante de latinhas de refrigerante deve propor uma lata cilíndrica de volume V<sub>0</sub>. Essa lata será fabricada usando-se duas ligas metálicas distintas, sendo uma para a parte lateral e outra para a base e a tampa. Ele deseja calcular o raio (r) e a altura (h) da lata para que o custo de sua produção seja o menor possível. Sabe-se que a área total da lata é dada por A(r,h) e que o custo total de produção da lata, que depende apenas do material utilizado na sua produção, é C(r,h). Para a solução desse problema, será utilizado o método dos multiplicadores de Lagrange.</p>
<p>Com base nessa situação, avalie as afirmações a seguir, acerca da solução desse problema.</p>
<ol class="roman"><li>O custo de produção da lata pode ser expresso por C(r,h) = 2π(K<sub>1</sub>rh + K<sub>2</sub>r<sup>2</sup>), em que K<sub>1</sub> e K<sub>2</sub> são constantes que dependem do custo de cada uma das ligas metálicas por unidade de área.</li>
<li>A função a ser minimizada da área total da lata é A(r,h) = 2πrh + 2πr<sup>2</sup>.</li>
<li>O vínculo na minimização, relacionado ao volume da lata, é dado por g(r,h) = πr<sup>2</sup>h − V<sub>0</sub>.</li>
<li>O sistema de equações a ser montado é ∇C(r,h) = λ∇g(r,h), no qual λ é denominado multiplicador de Lagrange.</li></ol>
<p>É correto apenas o que se afirma em</p>`,
  opts: ['I e II.', 'I e IV.', 'II e III.', 'I, III e IV.', 'II, III e IV.'],
  com: `<p><b>I – correta.</b> A lateral (2πrh) e a base mais a tampa (2πr²) usam ligas de custos diferentes: C = K<sub>1</sub>·2πrh + K<sub>2</sub>·2πr².</p>
<p><b>II – incorreta.</b> A função a minimizar é o <b>custo</b> C(r,h), e não a área. Com ligas de preços diferentes, minimizar a área não minimiza o custo.</p>
<p><b>III – correta.</b> A restrição é o volume fixo: g(r,h) = πr²h − V<sub>0</sub> = 0.</p>
<p><b>IV – correta.</b> A condição de Lagrange é ∇C = λ∇g, junto com g = 0.</p>` },

{ ano: 2017, n: 18, area: 'mec', gab: 'B',
  stem: `<p>O ensaio de flexão é utilizado em materiais frágeis ou de alta dureza, tais como cerâmicas estruturais ou aços-ferramenta. Em uma de suas modalidades mais comuns, o ensaio de flexão a 3 pontos, é provocada uma flexão ao se aplicar o carregamento em 3 pontos, o que causa uma tensão de tração surgida no ponto central e inferior da amostra, onde a fratura do material terá início.</p>
<p>Assumindo-se um comportamento de tensão-deformação linear, a tensão de flexão σ do material pode ser obtida por meio da fórmula:</p>
<p class="eq center">σ = 3Fd / (2wh<sup>2</sup>),</p>
<p>em que F é a carga, d é a distância entre os pontos de apoio, w é a largura do corpo de prova e h é a espessura do corpo de prova.</p>
<p>Considere dois corpos de prova A e B do mesmo compósito reforçado com fibras de vidro, cuja resistência à flexão é de 290 MPa. O corpo de prova A tem o triplo da largura e a metade da espessura do corpo de prova B e ambos são submetidos ao mesmo ensaio de flexão.</p>
<p>Nessa situação, qual porcentagem da força necessária para o rompimento do corpo de prova B deverá ser aplicada ao corpo de prova A para que este também se rompa?</p>`,
  opts: ['50%', '75%', '100%', '125%', '200%'],
  com: `<p>Mesma resistência (σ) e mesmo d, então a força de ruptura é proporcional a w·h²:</p>
<p class="eq">F<sub>A</sub>/F<sub>B</sub> = (w<sub>A</sub>h<sub>A</sub>²)/(w<sub>B</sub>h<sub>B</sub>²) = 3 × (1/2)² = 0,75</p>
<p>São necessários 75% da força. A espessura pesa ao quadrado, por isso reduzi-la à metade importa mais do que triplicar a largura.</p>` },

{ ano: 2017, n: 19, area: 'pot', gab: 'D',
  stem: `<p>Suponha que, em uma indústria, seja necessário especificar um sistema eletrônico de acionamento eficiente para uma máquina elétrica de indução trifásica. Além disso, considere que:</p>
<ul><li>o sistema seja capaz de realizar a partida evitando picos de corrente e mantendo o torque constante.</li><li>seja necessário, durante a operação, variar, de modo controlado, a velocidade da máquina.</li><li>a máquina opere em regime de carga variável.</li></ul>
<p>Com base nessa situação, avalie as afirmações a seguir.</p>
<ol class="roman"><li>Um inversor de frequência pode ser utilizado para realizar o acionamento descrito, pois possibilita tanto a partida do motor em torque constante, quanto o controle da velocidade em condições de carga variável.</li>
<li>Um sistema de partida suave (<i>soft-starter</i>) pode ser utilizado para realizar o acionamento descrito, pois possibilita tanto a partida do motor em torque constante, quanto o controle da velocidade em condições de carga variável.</li>
<li>Para realizar o controle de velocidade em condições de carga variável, é necessário utilizar um sensor de velocidade ou alguma forma indireta para estimação dessa grandeza.</li>
<li>Caso a indústria disponha apenas de um sistema elétrico monofásico, é possível alimentar o motor de indução trifásico a partir de um inversor de frequência alimentado pela fonte monofásica.</li></ol>
<p>É correto apenas o que se afirma em</p>`,
  opts: ['I e II.', 'I e IV.', 'II e III.', 'I, III e IV.', 'II, III e IV.'],
  com: `<p><b>I – correta.</b> O inversor (controle V/f ou vetorial) faz partida com torque constante e corrente limitada e varia a velocidade.</p>
<p><b>II – incorreta.</b> O soft-starter só reduz a tensão na partida. Não varia a frequência e, portanto, não controla a velocidade em regime.</p>
<p><b>III – correta.</b> Com carga variável, o escorregamento muda. Para manter a velocidade é preciso medi-la (encoder, tacogerador) ou estimá-la (controle vetorial sensorless).</p>
<p><b>IV – correta.</b> Há inversores com entrada monofásica e saída trifásica (o retificador monofásico alimenta o barramento CC).</p>` },

{ ano: 2017, n: 20, area: 'ger', gab: 'D',
  stem: `<p>Em um sistema integrado de manufatura, engenheiros de controle e automação devem organizar e propor <i>layouts</i> fabris que incorporem a tecnologia de grupo. O objetivo é melhorar, por exemplo, a programação da produção, a redução de tempo de início de processo, a redução de movimentação de material e a padronização de ferramental. Para implementar a tecnologia de grupo, é importante que o engenheiro identifique as famílias de peças produzidas pela empresa e também consiga diferenciar equipamentos que proporcionem maior flexibilidade e/ou maior produtividade em função de demandas específicas da produção.</p>
${fig('y17_q20.png', 'Gráfico flexibilidade versus produtividade com equipamentos 1 (alta flexibilidade, baixa produtividade), 2, 3 e 4 (baixa flexibilidade, alta produtividade)')}
<p>Considerando as características de flexibilidade e produtividade, identifique os equipamentos que correspondem, respectivamente, à sequência 1, 2, 3 e 4, no gráfico acima.</p>`,
  opts: ['Célula flexível de manufatura, sistema flexível de manufatura, linha de transferência e fresadora convencional.', 'Sistema flexível de manufatura, célula flexível de manufatura, máquina ferramenta CNC e linha de transferência.', 'Linha de transferência, máquina ferramenta CNC, célula flexível de manufatura e torno convencional.', 'Torno convencional, fresadora CNC, sistema flexível de manufatura e linha de transferência.', 'Fresadora convencional, torno CNC, linha de transferência e célula flexível de manufatura.'],
  com: `<ul><li><b>1</b> (máxima flexibilidade, mínima produtividade): máquina convencional, como o torno, que faz qualquer peça mas devagar.</li>
<li><b>2</b> (flexibilidade e produtividade intermediárias): máquina CNC isolada.</li>
<li><b>3</b> (alta flexibilidade e boa produtividade): sistema flexível de manufatura (FMS).</li>
<li><b>4</b> (máxima produtividade, mínima flexibilidade): linha de transferência dedicada.</li></ul>` },

{ ano: 2017, n: 21, area: 'disc', gab: 'D',
  stem: `<p>Uma equipe de engenharia foi encarregada de realizar a automação de um processo de dosagem e expedição, conforme ilustrado na figura a seguir.</p>
${fig('y17_q21.png', 'Silos A, B, C, D com válvulas VA a VD despejando nas balanças BM1 e BM2, que descarregam por VBM1 e VBM2 em um caminhão')}
<p>Legenda: PA = peso do produto do silo A; PB = peso do produto do silo B; PC = peso do produto do silo C; PD = peso do produto do silo D; VA = válvula de saída do silo A; VB = válvula de saída do silo B; VC = válvula de saída do silo C; VD = válvula de saída do silo D.</p>
<p>O referido processo tem início quando pressionado um botão Liga (BT_Liga). As balanças BM1 e BM2 funcionam em paralelo, de maneira semelhante: primeiro, é despejado o material de um dos silos até que seja disparado o sinal correspondente ao peso desejado do produto; em sequência, é despejado o material do segundo produto até que se obtenha um outro sinal correspondente ao peso desejado do produto. Após ser feita a dosagem de cada um dos produtos, as válvulas de saída das balanças (VBM1 e VBM2) devem ser abertas por 10 segundos para o seu esvaziamento e para a destinação ao carregamento de um caminhão na etapa de expedição. Para realizar uma nova dosagem, o botão Liga deve ser acionado novamente.</p>
<p>Considerando a situação descrita, assinale a opção em que é apresentada a implementação correta, em Grafcet, desse processo.</p>`,
  opts: [img('y17_q21_A.png'), img('y17_q21_B.png'), img('y17_q21_C.png'), img('y17_q21_D.png'), img('y17_q21_E.png')],
  com: `<p>Requisitos que o Grafcet precisa ter:</p>
<ul><li>Divergência em <b>E</b> (traço duplo) após BT_Liga, porque as duas balanças trabalham em paralelo.</li>
<li>Em cada ramo, dosagem <b>sequencial</b>: VA até PA, depois VB até PB (e VC até PC, depois VD até PD).</li>
<li>Abertura de VBM1 e VBM2 com temporização de 10 s.</li>
<li>Convergência em <b>E</b> (traço duplo), esperando os dois ramos terminarem antes de voltar à etapa 0.</li></ul>
<p>A e B abrem VA e VB juntas (dosagem simultânea, não sequencial). C não tem a transição de tempo de 10 s. E fecha com convergência simples (OU), que voltaria ao início sem esperar o outro ramo. D atende a tudo.</p>` },

{ ano: 2017, n: 22, area: 'circ', gab: 'A',
  stem: `<p>Um sistema de controle digital tem capacidade de receber informação de sensores analógicos e, para isso, utiliza conversores analógico-digital (A/D) que aceitam entradas em tensão na faixa entre 0 e 5 V. Existem sensores analógicos que produzem saída em tensão na faixa entre -500 mV e +500 mV de modo proporcional à variável medida. A utilização de um circuito de condicionamento analógico de sinais com amplificadores operacionais possibilita que a tensão de saída desses sensores seja adequada para que possa ocupar toda a faixa dinâmica dos conversores A/D.</p>
<p>Com base no exposto, assinale a opção em que é apresentado o circuito capaz de fazer o acoplamento adequado entre a tensão de saída desses sensores analógicos e as entradas dos conversores A/D do sistema de controle.</p>`,
  opts: [img('y17_q22_A.png'), img('y17_q22_B.png'), img('y17_q22_C.png'), img('y17_q22_D.png'), img('y17_q22_E.png')],
  com: `<p>É preciso levar −0,5…+0,5 V para 0…5 V: somar 0,5 V (offset) e multiplicar por 5.</p>
<p>No circuito A, o 1º estágio é um somador inversor: V<sub>1</sub> = −(50k/10k)(V<sub>s</sub> + 0,5) = −5(V<sub>s</sub> + 0,5), que vai de 0 a −5 V. O 2º estágio é um inversor de ganho −1: V<sub>o</sub> = 5(V<sub>s</sub> + 0,5), de 0 a 5 V. ✓</p>
<ul><li>B: ganho total 10 × 2 = 20, faixa demais.</li><li>C e E: aplicam o offset depois do ganho, com valores que não fecham a faixa.</li><li>D: mesmos resistores de A, mas com a fonte de 0,5 V invertida (−0,5 V), o que desloca o sinal para −5…0 V na saída.</li></ul>` },

{ ano: 2017, n: 23, area: 'ctrl', gab: 'A',
  stem: `<p>Um sistema de controle monovariável é representado pelo diagrama de blocos a seguir.</p>
${fig('y17_q23.png', 'Malha com controlador 1/s, planta 8/(s+4) e sensor 1/(s+2) na realimentação')}

{ ano: 2017, n: 24, area: 'ctrl', gab: 'C',
  stem: `<p>Um sistema massa-mola-amortecedor é descrito pela seguinte equação diferencial linear de segunda ordem:</p>
<p class="eq center">mẍ + bẋ + kx = f(t)</p>
<p>em que x representa o deslocamento do objeto; f, a força aplicada; m, a massa do objeto; b, o coeficiente de amortecimento; e k, a constante da mola; m, b e k são constantes reais positivas e, conforme o valor desses três parâmetros, o sistema apresenta formas distintas de resposta.</p>
<p>Considerando que o referido sistema está inicialmente em repouso e que uma força em degrau unitário é aplicada à massa, avalie as afirmações a seguir.</p>
<ol class="roman"><li>Caso os três parâmetros (m, b, k) sejam unitários, o sistema possuirá um par de polos complexos conjugados e, portanto, sua resposta será do tipo oscilatória com amplitude decrescente ao longo do tempo.</li>
<li>Caso o coeficiente de amortecimento seja nulo, a resposta do sistema será oscilatória com amplitude crescente ao longo do tempo.</li>
<li>Caso os três parâmetros (m, b, k) sejam tais que o sistema possua dois polos reais, a resposta não apresentará oscilações.</li></ol>
<p>É correto o que se afirma em</p>`,
  opts: ['I, apenas.', 'II, apenas.', 'I e III, apenas.', 'II e III, apenas.', 'I, II e III.'],
  com: `<p><b>I – correta.</b> s² + s + 1 = 0 → s = −0,5 ± j0,87. São polos complexos com parte real negativa, então a oscilação é amortecida.</p>
<p><b>II – incorreta.</b> Com b = 0, os polos ficam sobre o eixo imaginário (±j√(k/m)). A oscilação é sustentada, com amplitude <b>constante</b>, e não crescente.</p>
<p><b>III – correta.</b> Dois polos reais negativos (super ou criticamente amortecido) dão resposta exponencial, sem oscilação.</p>` },

{ ano: 2017, n: 25, area: 'flu', gab: 'D',
  stem: `<p>Em um processo de transporte, produtos chegam por uma esteira transportadora, são elevados por meio de um cilindro pneumático A e empurrados pelo cilindro pneumático B para dentro da embalagem. Devido a condições do projeto, a haste do cilindro B somente poderá retornar após a haste do cilindro A ter retornado. A figura a seguir representa esse processo.</p>
${fig('y17_q25.png', 'Unidade de transferência: cilindro A eleva o produto da esteira e cilindro B empurra para a caixa')}
<p>Considerando o exposto, assinale a opção em que o diagrama trajeto-passo para o processo descrito está corretamente representado.</p>`,
  opts: [img('y17_q25_A.png'), img('y17_q25_B.png'), img('y17_q25_C.png'), img('y17_q25_D.png'), img('y17_q25_E.png')],
  com: `<p>Sequência pedida: A+ (eleva), B+ (empurra), A− (desce) e só então B− (B só retorna depois de A ter retornado).</p>
<p>No diagrama D: A avança em 1→2, B avança em 2→3, A recua em 3→4 e B recua em 4→5. ✓</p>
<p>A tem B voltando junto com A. B tem A e B simultâneos. C inverte a ordem. E não mantém as hastes avançadas.</p>` },

{ ano: 2017, n: 26, area: 'redes', gab: 'B',
  stem: `<p>A figura a seguir apresenta os diferentes níveis hierárquicos de um sistema de automação industrial.</p>
${fig('y17_q26.png', 'Pirâmide da automação: nível 1 dispositivos de campo, 2 controle, 3 supervisão, 4 gerenciamento da planta, 5 gerenciamento corporativo')}
<p class="src">MORAES, C. C.; CASTRUCCI, P. L. <b>Engenharia de automação industrial</b>. Rio de Janeiro: LTC, 2007 (adaptado).</p>
<p>Considerando a figura apresentada e os diferentes padrões utilizados para redes de comunicação industrial, avalie as afirmações a seguir.</p>
<ol class="roman"><li>Os protocolos de comunicação projetados para os níveis 1 e 2 devem atender a critérios relacionados à velocidade de transmissão e à imunidade ao ruído.</li>
<li>Protocolos de comunicação como CAN e AS-I são utilizados para estabelecer a comunicação entre os níveis hierárquicos 2 e 3.</li>
<li>A complexidade da informação transmitida aumenta com o nível hierárquico, ao passo que os requisitos de resposta em tempo-real diminuem.</li>
<li>Se a comunicação entre os níveis 2 e 3 for interrompida, recomenda-se, por segurança, interromper também a comunicação entre os níveis 1 e 2.</li></ol>
<p>É correto apenas o que se afirma em</p>`,
  opts: ['I e II.', 'I e III.', 'II e IV.', 'I, III e IV.', 'II, III e IV.'],
  com: `<p><b>I – correta.</b> No chão de fábrica, determinismo, velocidade e robustez a ruído eletromagnético são essenciais.</p>
<p><b>II – incorreta.</b> CAN e AS-i são redes de dispositivos e sensores, que ligam os níveis 1 e 2. Entre controle e supervisão usam-se redes como Ethernet industrial.</p>
<p><b>III – correta.</b> Subindo na pirâmide, os pacotes ficam maiores e mais complexos, e a exigência de tempo real diminui.</p>
<p><b>IV – incorreta.</b> O controle local (níveis 1 e 2) deve continuar funcionando mesmo sem a supervisão. Cortá-lo pararia o processo sem necessidade.</p>` },

{ ano: 2017, n: 27, area: 'redes', gab: 'C',
  stem: `<p><i>Fieldbus Foundation</i> é uma arquitetura aberta para integrar informação, cujo objetivo principal é interconectar equipamentos de controle e automação industrial, distribuindo funções de controle pela rede e fornecendo informações a todas as camadas do sistema, conforme representado na figura a seguir.</p>
${fig('y17_q27.png', 'Rede de serviço HSE ligada a um painel e rede H1 com instrumentos em barramento e caixa de junção')}
<p>A respeito dessa temática e com base nas informações apresentadas, avalie as afirmações a seguir.</p>
<ol class="roman"><li>A topologia de barramento com <i>Spurs</i> se caracteriza pela ligação em série de todos os instrumentos utilizados na aplicação.</li>
<li>A rede de serviço HSE baseia-se na mesma camada física <i>Ethernet</i>, operando com o protocolo TCP/IP.</li>
<li>As redes H1 e HSE pertencem a diferentes camadas físicas e ambas as redes operam com a mesma velocidade de transmissão.</li>
<li>A rede H1 representa uma solução de comunicação digital para o chão de fábrica em áreas classificadas.</li></ol>
<p>É correto apenas o que se afirma em</p>`,
  opts: ['I e III.', 'I e IV.', 'II e IV.', 'I, II e III.', 'II, III e IV.'],
  com: `<p><b>I – incorreta.</b> Na topologia com <i>spurs</i>, cada instrumento é ligado ao tronco por uma derivação. É uma ligação em paralelo, e não em série (a série é o <i>daisy chain</i>).</p>
<p><b>II – correta.</b> HSE (High Speed Ethernet) usa a camada física Ethernet com TCP/IP e UDP.</p>
<p><b>III – incorreta.</b> As camadas físicas são diferentes, e as velocidades também: H1 a 31,25 kbit/s e HSE a 100 Mbit/s.</p>
<p><b>IV – correta.</b> A H1 (IEC 61158-2) pode alimentar os instrumentos pelo próprio par e admite segurança intrínseca para áreas classificadas.</p>` },

{ ano: 2017, n: 28, area: 'comp', gab: 'E',
  stem: `<p>Os motores de passo (MP), dispositivos eletromecânicos que convertem pulsos elétricos digitais em movimentos mecânicos discretos do eixo, são utilizados em aplicações em que se deseja fazer posicionamentos, como equipamentos de informática, instrumentos médicos, automação industrial, equipamentos aeroespaciais etc. O acionamento de um MP de quatro fases é feito a partir da aplicação de sinais discretos (pulsos) nos enrolamentos do motor, para que este gire na direção desejada.</p>
<p>A figura 1, a seguir, ilustra esses pulsos, cuja frequência determina a velocidade de rotação do motor. Tais pulsos podem ser gerados a partir de um microcontrolador, conforme evidenciado na figura 2. Posteriormente, os pulsos gerados pelo microcontrolador são amplificados através de transistores e injetados nas chaves do circuito de potência, conforme representado na figura 3.</p>
<p>A lógica dos pulsos que devem ser enviados para o circuito de potência está demonstrada no quadro 1. Os transistores T<sub>1</sub>, T<sub>2</sub>, T<sub>3</sub> e T<sub>4</sub> são ligados (através do estágio de amplificação) aos pinos RB0, RB1, RB2 e RB3 do microcontrolador. Conforme demonstrado no quadro 1, o acionamento foi dividido em 4 estágios de energização das fases. No primeiro estágio, as fases 1 e 4 devem ser desenergizadas e as fases 2 e 3 devem ser energizadas. No segundo estágio, as fases 1 e 2 permanecem no mesmo estado e as fases 3 e 4 mudam de estado.</p>
${fig('y17_q28_f1.png', 'Pulsos T1 a T4 aplicados às fases do motor ao longo do tempo', 'Figura 1. Pulsos aplicados às fases do motor.')}
${fig('y17_q28_f2.png', 'Microcontrolador com RB0 a RB3 ligados a amplificadores e chaves de potência T1 a T4, e chave em RA0', 'Figura 2. Esquema de ligação do microcontrolador.')}
${fig('y17_q28_q.png', 'Quadro com o nível lógico das fases 1 a 4 nos estágios 1 a 4', 'Quadro 1. Lógica do acionamento das fases.')}
${fig('y17_q28_f3.png', 'Quatro enrolamentos com transistores T1 a T4 e diodos de roda livre D1 a D4', 'Figura 3. Circuito de potência + Enrolamentos do MP.')}
${fig('y17_q28_prog.png', 'Programa 01 (sequência fixa em laço) e Programa 02 (sequência direta ou inversa conforme a entrada PIN_A0)')}
<p>Com base nesse contexto, avalie as afirmações a seguir, a respeito dos programas 1 e 2 acima apresentados.</p>
<ol class="roman"><li>O Programa 01 gera os pulsos de disparo para as chaves T1, T2, T3 e T4 fazendo o motor de passo girar em determinada direção; sua velocidade de giro dependerá do valor fornecido à variável “tempo”.</li>
<li>O Programa 02 tem a função de acionar o motor de passo e, conforme o valor da variável “x”, o motor poderá girar nos sentidos horário ou anti-horário.</li>
<li>Nos Programas 01 e 02, os pinos R<sub>B0</sub>, R<sub>B1</sub>, R<sub>B2</sub> e R<sub>B3</sub> fornecem os pulsos de comando das fases do motor de passo.</li></ol>
<p>É correto o que se afirma em</p>`,
  opts: ['I, apenas.', 'III, apenas.', 'I e II, apenas.', 'II e III, apenas.', 'I, II e III.'],
  com: `<p><b>I – correta.</b> O Programa 01 repete em laço infinito os quatro estágios do quadro 1. O <code>delay_ms(tempo)</code> define o intervalo entre passos e, portanto, a velocidade.</p>
<p><b>II – correta.</b> O Programa 02 lê a chave em RA0 (<code>x = input(PIN_A0)</code>). Com x = 1 executa a sequência num sentido e, caso contrário, a sequência inversa.</p>
<p><b>III – correta.</b> As saídas <code>PIN_B0</code> a <code>PIN_B3</code> comandam os amplificadores e chaves de potência de cada fase.</p>` },

{ ano: 2017, n: 29, area: 'rob', gab: 'C',
  stem: `<p>A descrição dos movimentos de robôs pode ser realizada por meio do modelo cinemático direto. Uma das ferramentas desse modelo, a matriz de transformação, converte coordenadas de um ponto em um sistema fixo ao robô P<sub>(u, v, w)</sub> para o sistema de coordenadas global P<sub>(x, y, z)</sub>. Os movimentos de rotação ao redor dos eixos principais, normalmente, são chamados de guinada, arfagem e rolamento. Assim, caso se considere o deslocamento de um robô móvel, o ângulo θ<sub>1</sub>, definido como guinada, consiste na rotação em torno do eixo vertical do veículo, ou seja, a rotação será executada no eixo z; o ângulo θ<sub>2</sub>, definido como arfagem, consiste na rotação em torno do eixo transversal, ou seja, o movimento será feito no eixo x; por fim, o ângulo θ<sub>3</sub>, definido como rolamento, consiste na rotação em torno do eixo longitudinal, ou seja, o deslocamento será executado no eixo y, conforme a figura a seguir.</p>
${fig('y17_q29.png', 'Robô móvel com rotações de guinada (θ1 em z), arfagem (θ2 em x) e rolamento (θ3 em y)', 'Movimento robôs móveis')}
<p>Considerando que um robô móvel descreve os seguintes deslocamentos angulares durante a sua locomoção: θ<sub>1</sub> = 15°, θ<sub>2</sub> = 10°, θ<sub>3</sub> = 3°, assinale a opção em que é apresentada a sequência correta das matrizes de transformação.</p>`,
  opts: [img('y17_q29_A.png'), img('y17_q29_B.png'), img('y17_q29_C.png'), img('y17_q29_D.png'), img('y17_q29_E.png')],
  com: `<p>As matrizes homogêneas de rotação elementares são:</p>
<p class="eq">R<sub>z</sub>(θ) = [[cos θ, −sen θ, 0]; [sen θ, cos θ, 0]; [0, 0, 1]]<br>R<sub>x</sub>(θ) = [[1, 0, 0]; [0, cos θ, −sen θ]; [0, sen θ, cos θ]]<br>R<sub>y</sub>(θ) = [[cos θ, 0, sen θ]; [0, 1, 0]; [−sen θ, 0, cos θ]]</p>
<p>A opção C usa exatamente essas formas: T<sub>z</sub> com 15°, T<sub>x</sub> com 10° e T<sub>y</sub> com 3°.</p>
<p>A e B trocam seno e cosseno. D e E associam os ângulos aos eixos errados.</p>` },

{ ano: 2017, n: 30, area: 'ctrl', gab: 'A',
  stem: `<p>No início da década de 1950, época em que os recursos computacionais ainda eram precários para as demandas dos projetos de controle, Walter R. Evans criou um método para determinar graficamente como mudanças em um dos parâmetros do sistema modificavam a posição de seus polos de malha fechada, alterando, assim, a resposta dinâmica do sistema. Tal método foi chamado de Lugar das Raízes e, em geral, o parâmetro escolhido para variar era o ganho de malha aberta.</p>
${fig('y17_q30.png', 'Malha com ganho k, bloco (s+2)/(s²+2s+1) e bloco 1/(s²+2s+2), realimentação unitária')}
<p>Considerando o método criado por Evans, assinale a opção em que o gráfico do Lugar das Raízes está associado ao sistema de controle exibido na figura acima.</p>`,
  opts: [img('y17_q30_A.png'), img('y17_q30_B.png'), img('y17_q30_C.png'), img('y17_q30_D.png'), img('y17_q30_E.png')],
  com: `<p>Malha aberta: k(s+2) / [(s+1)²(s² + 2s + 2)].</p>
<ul><li>Polos: −1 (duplo) e −1 ± j1. Zero: −2.</li>
<li>4 polos − 1 zero = 3 assíntotas (±60° e 180°), centradas em σ = (−4 − (−2))/3 ≈ −0,67.</li>
<li>No eixo real, o lugar fica à esquerda de −2 e no ponto duplo em −1. Os polos em −1 saem do eixo, contornam e voltam ao eixo real, formando o laço em torno do zero.</li></ul>
<p>A é o único gráfico com zero em −2, polos complexos em −1 ± j, laço simétrico entre o polo duplo e o zero, e ramos que seguem as assíntotas de ±60°. B tem o zero em +2. C e D não têm o laço. E é assimétrico em relação ao eixo real, o que é impossível para um sistema com coeficientes reais.</p>` },

{ ano: 2017, n: 31, area: 'comp', gab: 'B',
  stem: `<p>A Internet das Coisas (IoT - <i>Internet of Things</i>) pode ser conceituada como a comunicação de objetos diversos via internet, que trocam informações como medições, localização, funcionalidades, falhas etc. Tais dados permitem, em determinadas situações, que o próprio sistema tome decisões sem intervenção humana.</p>
<p>Suponha o desenvolvimento de um sistema IoT para monitorar o consumo de energia elétrica residencial com sensores, microcontroladores e módulos de comunicação sem fio. Como teste inicial, será monitorado o consumo de energia elétrica de uma lâmpada, como mostra o diagrama simplificado da figura 1. O sistema coleta os dados e os envia a cada 24 horas para uma plataforma na internet.</p>
${fig('y17_q31_f1.png', 'Lâmpada com interruptor, circuito de interface ligado ao pino 13 do microcontrolador, que se comunica por TX/RX com módulo sem fio', 'Figura 1. Diagrama simplificado do sistema.')}
<p>As informações enviadas para o módulo de comunicação sem fio devem estar organizadas em um quadro (<i>frame</i>) de dados obedecendo à estrutura mostrada na figura 2.</p>
${fig('y17_q31_f2.png', 'Quadro de 32 bits: bits 0-7 de início, 8-15 custo diário, 16-23 CRC, 24-31 bits de fim', 'Figura 2. Estrutura do quadro de dados.')}
<p>Considere que o módulo de comunicação sem fio já está configurado, e que ao receber os dados do microcontrolador ele os envia automaticamente para a internet.</p>
<p>A figura 3 mostra o código desenvolvido para o microcontrolador. Considere que as funções utilizadas no código fazem parte da biblioteca “iot.h”.</p>
${fig('y17_q31_f3.png', 'Código C: lê o estado do pino, conta ciclos, a cada 86 400 s calcula valor_kwh, custo diário e CRC e envia quatro bytes pela serial', 'Figura 3. Código desenvolvido para o microcontrolador.')}
<p>A respeito do código apresentado na figura 3, avalie as afirmações a seguir.</p>
<ol class="roman"><li>A instrução da linha 30 é utilizada de maneira correta para a precificação da energia.</li>
<li>Devido à configuração da comunicação serial do microcontrolador, o <i>frame</i> precisa ser fragmentado para o envio de dados.</li>
<li>O programa faz uso de interrupção, o que torna o microcontrolador mais eficiente em termos de processamento e consumo de energia.</li></ol>
<p>É correto o que se afirma em</p>`,
  opts: ['I, apenas.', 'II, apenas.', 'I e III, apenas.', 'II e III, apenas.', 'I, II e III.'],
  com: `<p><b>I – incorreta.</b> A linha 30 calcula a energia com <code>periodo_diario</code> (as 24 h do dia inteiro) em vez do tempo em que a lâmpada ficou ligada (<code>tempo_ligada</code>, calculado na linha 29 e não usado). O custo sairia como se a lâmpada ficasse sempre acesa.</p>
<p><b>II – correta.</b> A serial está em 8N1 (8 bits por caractere), e o quadro tem 32 bits. Por isso o envio é feito em 4 bytes separados (<code>Serial.write</code> ×4).</p>
<p><b>III – incorreta.</b> Não há rotina de interrupção. O estado do pino é lido por varredura (<i>polling</i>) dentro de <code>loop()</code>.</p>` },

{ ano: 2017, n: 32, area: 'disc', gab: 'E',
  stem: `<p>Uma máquina utilizada para a injeção de matéria-prima de polímeros no processamento de produtos plásticos é controlada por um controlador lógico programável (CLP). Durante o processo de fabricação, essa máquina simplesmente parou de acionar o pistão pneumático (S1) responsável pela abertura do molde e retirada das peças produzidas. Na manutenção corretiva do referido equipamento, foi realizada inspeção por meio do <i>software</i> de supervisão do próprio CLP. A sequência de instruções em programação <i>Ladder</i> para a inspeção está ilustrada na figura a seguir.</p>
${fig('y17_q32.png', 'Ladder: S1 = A (NF) · B · C · D (NF); S2 = (A NF · C + E NF · G NF) · F NF; legenda dos sensores')}
<p>Considerando as possíveis causas de o molde não ter sido aberto, avalie as afirmações a seguir.</p>
<ol class="roman"><li>O sensor C está em sinal baixo, pois não reconheceu o final do processo.</li>
<li>O sensor B está em sinal baixo, pois não atingiu a temperatura necessária para a abertura do molde de injeção.</li>
<li>O sensor D está em sinal alto, pois reconheceu que a matéria-prima ainda estava no compartimento do molde.</li></ol>
<p>É correto o que se afirma em</p>`,
  opts: ['I, apenas.', 'II, apenas.', 'I e III, apenas.', 'II e III, apenas.', 'I, II e III.'],
  com: `<p>A linha de S1 tem A (NF), B (NA), C (NA) e D (NF) em série. S1 só é acionado com B = 1, C = 1 e D = 0 (além de A em repouso).</p>
<ul><li><b>I</b>: C = 0 (tempo de injeção não concluído) abre a linha.</li>
<li><b>II</b>: B = 0 (temperatura não atingida) abre a linha.</li>
<li><b>III</b>: D = 1 (matéria-prima ainda enchendo) abre o contato NF.</li></ul>
<p>Qualquer uma das três condições explica o molde não ter aberto.</p>` },

{ ano: 2017, n: 34, area: 'ctrl', gab: 'B',
  stem: `<p>As figuras 1 e 2, a seguir, ilustram, respectivamente, um diagrama de blocos de um sistema de controle e topologias típicas de compensadores analógicos que utilizam amplificadores operacionais, capacitores e resistores.</p>
${fig('y17_q34_f1.png', 'Malha fechada: referência, somador, compensador, atuador, processo e sensor', 'Figura 1. Diagrama de blocos de controle em malha fechada de processo.')}
${fig('y17_q34_f2.png', 'Quatro compensadores com amplificadores operacionais: 1 com R2 e C1 em série na realimentação; 2 só com resistores; 3 com C1 na realimentação; 4 com C1 em paralelo com R1 na entrada', 'Figura 2. Circuito com compensadores.')}
<p>Considerando as informações apresentadas, assinale a opção que corresponde à sequência correta dos compensadores segundo a ordem numérica apresentada.</p>`,
  opts: ['Proporcional derivativo; proporcional; integral; proporcional integral.', 'Proporcional integral; proporcional; integral; proporcional derivativo.', 'Proporcional integral; integral; proporcional; proporcional derivativo.', 'Proporcional integral derivativo; proporcional; integral; proporcional integral.', 'Proporcional derivativo; integral; proporcional; proporcional integral derivativo.'],
  com: `<p>Para um inversor com impedância de entrada Z<sub>i</sub> e de realimentação Z<sub>f</sub>, o ganho é −Z<sub>f</sub>/Z<sub>i</sub>:</p>
<ul><li><b>1</b>: Z<sub>f</sub> = R<sub>2</sub> + 1/(sC<sub>1</sub>) → (R<sub>2</sub>/R<sub>1</sub>)(1 + 1/(R<sub>2</sub>C<sub>1</sub>s)): <b>PI</b>.</li>
<li><b>2</b>: só resistores: <b>P</b>.</li>
<li><b>3</b>: Z<sub>f</sub> = 1/(sC<sub>1</sub>) → −1/(R<sub>1</sub>C<sub>1</sub>s): <b>I</b>.</li>
<li><b>4</b>: entrada R<sub>1</sub> ∥ C<sub>1</sub> → (R<sub>2</sub>/R<sub>1</sub>)(1 + R<sub>1</sub>C<sub>1</sub>s): <b>PD</b>.</li></ul>
<p>O segundo amplificador de cada circuito só inverte o sinal (com ganho R<sub>4</sub>/R<sub>3</sub>).</p>` },

{ ano: 2017, n: 35, area: 'ctrl', gab: 'A',
  stem: `<p>Considere um sistema de controle em malha fechada conforme a figura a seguir.</p>
${fig('y17_q35.png', 'Malha com controlador C(s) e planta G(s), realimentação unitária')}
<p>Sabe-se que C(s) é um controlador proporcional e integral (PI) ideal com ganho proporcional K<sub>p</sub> e ganho integral K<sub>i</sub>, conforme a equação:</p>
<p class="eq center">u(t) = K<sub>p</sub>e(t) + K<sub>i</sub>∫<sub>0</sub><sup>t</sup> e(τ)dτ</p>
<p>Deseja-se implementar um controlador digital equivalente em um sistema microprocessado, fazendo-se necessária a sua transformação para equação a diferenças.</p>
<p>Utilizando-se o método de Tustin para a discretização do controlador, onde ${M(`<mi>s</mi><mo>=</mo><mfrac><mn>2</mn><mrow><mi>Δ</mi><mi>t</mi></mrow></mfrac><mfrac><mrow><mo>(</mo><mi>z</mi><mo>−</mo><mn>1</mn><mo>)</mo></mrow><mrow><mo>(</mo><mi>z</mi><mo>+</mo><mn>1</mn><mo>)</mo></mrow></mfrac>`)}, em que Δt é o período de amostragem, qual é a equação a diferenças para o controlador PI?</p>`,
  opts: [img('y17_q35_A.png'), img('y17_q35_B.png'), img('y17_q35_C.png'), img('y17_q35_D.png'), img('y17_q35_E.png')],
  com: `<p>C(s) = K<sub>p</sub> + K<sub>i</sub>/s. Substituindo s por (2/Δt)(z−1)/(z+1):</p>
<p class="eq">U/E = K<sub>p</sub> + (K<sub>i</sub>Δt/2)·(z+1)/(z−1)</p>
<p>Multiplicando por (1 − z<sup>−1</sup>):</p>
<p class="eq">u[k] − u[k−1] = (K<sub>i</sub>Δt/2 + K<sub>p</sub>)e[k] + (K<sub>i</sub>Δt/2 − K<sub>p</sub>)e[k−1]</p>
<p>É a opção A. E esquece o Δt. B, C e D usam amostras futuras (k+1).</p>` }
);

{ ano: 2017, n: 'D3', area: 'ctrl', titulo: 'Erro estacionário no controle de posição de motor CC',
  stem: `<p>Os motores CC são usados em diversos dispositivos, tais como brinquedos infantis e manipuladores robóticos industriais. A relação entre a tensão aplicada na armadura e o ângulo de rotação do motor pode ser modelada como um sistema linear invariante no tempo dado pela seguinte função de transferência:</p>
<p class="eq center">G(s) = K / (s(τs + 1))</p>
<p>Para o controle de posição do motor descrito, considere o sistema com realimentação unitária representado na figura a seguir.</p>
${fig('y17_d3.png', 'Malha com controlador Kc e planta K/(s(τs+1)), realimentação unitária')}
<p>Nesse contexto, faça o que se pede nos itens a seguir.</p>`,
  itens: [
    { id: 'a', txt: 'Considerando K<sub>c</sub> = 1, calcule o erro estacionário para uma entrada do tipo rampa unitária. (valor: 6,0 pontos)',
      padrao: `<p>Para K<sub>c</sub> = 1, a FTMF é C(s)/R(s) = G/(1+G) = K/(τs² + s + K). O sinal de erro é E(s) = R(s) − C(s) = [(τs² + s)/(τs² + s + K)]·R(s).</p>
<p>Para rampa unitária, R(s) = 1/s², logo E(s) = (τs + 1)/(τs³ + s² + Ks).</p>
<p>Pelo Teorema do Valor Final: e(∞) = lim<sub>s→0</sub> sE(s) = lim<sub>s→0</sub> (τs² + s)/(τs³ + s² + Ks) = <b>1/K</b>.</p>
<p>Alternativamente, o estudante pode usar o tipo do sistema: G(s) = K/(s(τs+1)) é do tipo 1, então e(∞) = 1/K<sub>v</sub>, com K<sub>v</sub> = lim<sub>s→0</sub> sG(s) = K. Logo, e(∞) = 1/K.</p>`,
      check: [ { p: 2.0, t: 'Montou a malha fechada ou a expressão do erro E(s) = R(s)/(1 + G(s)).' },
               { p: 2.0, t: 'Aplicou R(s) = 1/s² e o Teorema do Valor Final (ou identificou sistema tipo 1 e Kv = K).' },
               { p: 2.0, t: 'Concluiu e(∞) = 1/K.' } ] },
    { id: 'b', txt: 'Considerando ação integradora, isto é, K<sub>c</sub> = 1/s, calcule o erro estacionário para uma entrada do tipo rampa unitária. (valor: 4,0 pontos)',
      padrao: `<p>Para K<sub>c</sub> = 1/s, a FTRD é G(s) = K/(s²(τs+1)) e a FTMF fica K/(τs³ + s² + K).</p>
<p>E(s) = [(τs³ + s²)/(τs³ + s² + K)]·R(s) e, para R(s) = 1/s², E(s) = (τs + 1)/(τs³ + s² + K).</p>
<p>e(∞) = lim<sub>s→0</sub> sE(s) = lim<sub>s→0</sub> (τs² + s)/(τs³ + s² + K) = <b>0</b>.</p>
<p>Alternativamente: com N = 2 (tipo 2, dois integradores no ramo direto), o erro em regime permanente para rampa unitária é nulo.</p>
<p class="unoff">Observação para estudo: o padrão não discute estabilidade. Com essa FTMF (sem termo em s no denominador), a malha fechada não é estável pelo critério de Routh, e o Teorema do Valor Final só vale para sistemas estáveis.</p>`,
      check: [ { p: 2.0, t: 'Incluiu o integrador no ramo direto: G(s) = K/(s²(τs+1)), sistema tipo 2.' },
               { p: 2.0, t: 'Concluiu que o erro estacionário à rampa é nulo.' } ] }
  ] },

{ ano: 2017, n: 'D4', area: 'inst', titulo: 'Controle de temperatura de reservatório com CLP',
  stem: `<p>Em um processo de dosagem de dois produtos, deseja-se controlar a temperatura no interior do reservatório por meio da abertura de uma válvula proporcional de vapor, como mostra a figura a seguir. Nesse processo, alterações na temperatura ambiente e na vazão do vapor podem alterar significativamente a temperatura no reservatório.</p>
${fig('y17_d4.png', 'Sistema de controle de aquecimento: CLP com controlador, módulo de saída analógico comandando válvula de vapor, sensor de temperatura com transmissor no módulo de entrada analógico; produtos 1 e 2 entram no reservatório', 'Sistema de Controle de Aquecimento.')}
<p class="src">FRANCHI, C. M. <b>Controle de processos industriais</b>: princípios e aplicações. São Paulo: Saraiva, 2017 (adaptado).</p>
<p>Com base no processo apresentado, faça o que se pede nos itens a seguir.</p>`,
  itens: [
    { id: 'a', txt: 'Identifique as seguintes variáveis: de processo, manipulada e de perturbações. (valor: 5,0 pontos)',

{ ano: 2017, n: 'D5', area: 'rob', titulo: 'Robô SCARA em operação pick and place',
  stem: `<p>O desenvolvimento e a aplicação de robôs industriais em sistemas flexíveis de manufatura dependem, além da análise de viabilidade econômica, do atendimento a diversos requisitos técnicos, entre os quais podem ser citados: capacidade de carga, volume de trabalho, velocidade de operação e precisão. No projeto de um determinado sistema optou-se por utilizar um robô do tipo SCARA na movimentação de peças entre duas esteiras (operação <i>pick and place</i>), como mostrado na figura a seguir.</p>
${fig('y17_d5.png', 'Robô SCARA entre duas esteiras transportando peças')}
<p>Considere que:</p>
<ul><li>os motores e os redutores de velocidade estão localizados diretamente nas articulações do robô;</li><li>o alcance máximo do robô é de 600 mm;</li><li>a distância entre as duas esteiras é de 1,2 metros, com o robô posicionado no centro desta distância;</li><li>os comprimentos dos dois primeiros elos do robô são a1 = 350 mm e a2 = 250 mm;</li><li>a velocidade máxima das articulações de rotação é de π rad/s.</li></ul>
<p>A partir das informações e da figura apresentadas, faça o que se pede nos itens a seguir.</p>`,
  itens: [
    { id: 'a', txt: 'Calcule a quantidade mínima necessária de robôs para atender a um sistema produzindo 15 peças por minuto. O tempo necessário para movimentação do eixo vertical (subida e descida) e do acionamento da ferramenta é de 1,5 segundos. Desprezar margens de segurança. (valor: 4,0 pontos)',
      padrao: `<p>O estudante deve indicar que, na aplicação proposta, cada ciclo <i>pick and place</i> é composto pelas seguintes etapas: (1) terceiro eixo desce, garra fecha e terceiro eixo sobe; (2) robô gira +180 graus; (3) terceiro eixo desce, garra abre e terceiro eixo sobe; e (4) robô gira −180 graus.</p>
<p>Portanto, considerando os tempos de 1,5 segundo para as etapas (1) e (3), e de 1 segundo para as etapas (2) e (4) (180 graus com velocidade de π rad/s), o tempo para movimentação de cada peça é de 1,5 s + 1 s + 1,5 s + 1 s = 5 segundos por peça.</p>
<p>Sendo cada robô capaz de movimentar 12 peças por minuto, devem ser empregados 2 robôs para produzir as 15 peças por minuto.</p>`,
      check: [ { p: 1.0, t: 'Identificou que cada ciclo exige girar 180° (π rad) na ida e na volta: 1 s cada a π rad/s.' },
               { p: 1.5, t: 'Somou o ciclo: 1,5 + 1 + 1,5 + 1 = 5 s por peça (12 peças/min por robô).' },
               { p: 1.5, t: 'Concluiu que são necessários 2 robôs para 15 peças/min.' } ] },
    { id: 'b', txt: 'Especifique as equações da cinemática direta para o manipulador que descrevem o movimento deste no plano horizontal em função dos ângulos das duas primeiras articulações (θ<sub>1</sub> e θ<sub>2</sub>). (valor: 6,0 pontos)',
      padrao: `<p>O estudante deve apresentar o modelo físico do robô SCARA (RRP) plano com 2 graus de liberdade de rotação, com indicação do sistema de referência de cada elo, das variáveis das juntas e dos comprimentos dos elos.</p>
<p>As equações da cinemática direta, ou seja, a posição do efetuador no sistema de referência (x<sub>0</sub>, y<sub>0</sub>), são:</p>
<p class="eq">x = a<sub>1</sub>cos(θ<sub>1</sub>) + a<sub>2</sub>cos(θ<sub>1</sub> + θ<sub>2</sub>)<br>y = a<sub>1</sub>sen(θ<sub>1</sub>) + a<sub>2</sub>sen(θ<sub>1</sub> + θ<sub>2</sub>)</p>
<p>Alternativamente, o estudante pode partir dos parâmetros de Denavit-Hartenberg (elo 1: a<sub>1</sub>, α = 0, d = 0, θ<sub>1</sub>; elo 2: a<sub>2</sub>, α = 0, d = 0, θ<sub>2</sub>) e das matrizes homogêneas A<sub>0</sub><sup>1</sup> e A<sub>1</sub><sup>2</sup>, cujo produto A<sub>0</sub><sup>2</sup> traz na última coluna a<sub>1</sub>C<sub>1</sub> + a<sub>2</sub>C<sub>12</sub> e a<sub>1</sub>S<sub>1</sub> + a<sub>2</sub>S<sub>12</sub>.</p>`,
      check: [ { p: 2.0, t: 'Representou o modelo plano com referenciais, variáveis de junta (θ1, θ2) e comprimentos a1, a2.' },
               { p: 2.0, t: 'Escreveu x = a1·cos θ1 + a2·cos(θ1 + θ2).' },
               { p: 2.0, t: 'Escreveu y = a1·sen θ1 + a2·sen(θ1 + θ2) (ou obteve as duas por D-H).' } ] }
  ] }
);

{ ano: 2014, n: 11, area: 'ger', gab: 'E',
  stem: `<p>A DBO (Demanda Bioquímica de Oxigênio) de uma amostra de água é a quantidade de oxigênio necessária para oxidar a matéria orgânica por decomposição aeróbia. Quando a amostra é guardada por 5 dias em uma temperatura de incubação de 20°C, ela é referida como DBO<sub>5,20</sub>, que é normalmente utilizada como um dos parâmetros para verificação da qualidade da água.</p>
<p>O seguinte quadro classifica um curso d’água em função da sua DBO<sub>5,20</sub>.</p>

<p>A imagem abaixo mostra um trecho de um rio com 5 seções (X, Y, Z, W e T), em que são coletadas amostras de água para a determinação de DBO<sub>5,20</sub> em laboratório.</p>

<p>O quadro abaixo apresenta os resultados, em diferentes unidades, das amostras colhidas.</p>
<div class="tbl"><table class="std"><thead><tr><th>Seção</th><th>DBO<sub>5,20</sub></th></tr></thead><tbody><tr><td>X</td><td>0,4 g/m³</td></tr><tr><td>Y</td><td>3 850 mg/m³</td></tr><tr><td>Z</td><td>2 500 mg/m³</td></tr><tr><td>W</td><td>3 000 mg/m³</td></tr><tr><td>T</td><td>0,01 kg/m³</td></tr></tbody></table></div>
<p>Considerando que pode ocorrer autodepuração no rio, em qual seção dele a água não pode ser classificada, no mínimo, como “razoável”?</p>`,

{ ano: 2014, n: 12, area: 'mec', gab: 'A',
  stem: `<p>Um ambiente termicamente confortável é uma das condições que devem ser consideradas em projetos de edificações. A fim de projetar um ambiente interno com temperatura de 20°C para uma temperatura externa média de 35°C, um engenheiro considerou, no dimensionamento, um fluxo de calor através de uma parede externa de 105 W/m², conforme ilustra a figura abaixo.</p>
${fig('y14_q12.png', 'Parede de 20 cm de espessura com 35 °C externos, 20 °C internos e fluxo de 105 W/m²')}
<p>A tabela a seguir apresenta os valores da condutividade térmica para alguns materiais de construção.</p>
<div class="tbl"><table class="std"><thead><tr><th>Material</th><th>Condutividade térmica λ (W·m<sup>−1</sup>·K<sup>−1</sup>)</th></tr></thead><tbody><tr><td>Concreto</td><td>1,40</td></tr><tr><td>Pedra natural</td><td>1,00</td></tr><tr><td>Placa de aglomerado de fibras de madeira</td><td>0,20</td></tr><tr><td>Placa de madeira prensada</td><td>0,10</td></tr><tr><td>Placa com espuma rígida de poliuretano</td><td>0,03</td></tr></tbody></table></div>
<p class="src">ASSOCIAÇÃO BRASILEIRA DE NORMAS TÉCNICAS. NBR 15220-1, 2005, p. 8 (adaptado).</p>
<p>A fim de se obter a temperatura interna desejada, qual deve ser o material selecionado, entre os apresentados na tabela acima, para composição da parede externa?</p>`,

  com: `<p>Lei de Fourier para condução em parede plana: q = λ·ΔT / L.</p>

<p>É o concreto. Observe que a questão fixa o fluxo de projeto: um isolante melhor daria fluxo menor do que o especificado.</p>` },

{ ano: 2014, n: 13, area: 'mec', gab: 'E',
  stem: `<p>Engenheiros de uma empresa holandesa encontraram uma maneira de fazer com que os elevadores terrestres subam até o topo de edifícios com 1 000 metros de altura, pois os cabos de aço usados nos elevadores atuais só conseguem alçá-los a alturas de, aproximadamente, 500 metros. Isso será possível com a criação de um novo cabo superleve e superforte, ou seja, uma espécie de cinta, tecida com fibras de carbono. Em vez dos fios de aço entrelaçados usados nos cabos de aço comuns, a cinta é formada por quatro fitas de fibra de carbono seladas em plástico transparente. O plástico é necessário para proteger do atrito as fibras de carbono e aumentar a vida útil do conjunto. Cada fita tem 4 centímetros de largura por 4 milímetros de espessura. Elas são parecidas com uma régua escolar flexível. Esse novo material supera ligeiramente a resistência à tensão do aço, mas pesa sete vezes menos que o atualmente usado. Assim, a força gasta para sustentar o peso do próprio cabo passa a ser aplicada para sustentar apenas o elevador, e o consumo de energia dos elevadores também é cerca de 15% menor do que os anteriores.</p>
<p class="src">Disponível em: &lt;http://www.inovacaotecnologica.com.br&gt;. Acesso em: 27 jul. 2014 (adaptado).</p>
<p>Tendo em vista a situação descrita, avalie as afirmações a seguir.</p>
<ol class="roman"><li>O cabo de fibra de carbono suporta elevadas cargas devido à sua elevada resistência à tração.</li><li>A fibra de carbono torna o cabo bem mais flexível, o que, aliado à sua resistência à tração, proporciona a esse material uma vantagem em relação aos cabos de aço convencionais.</li><li>A relação resistência/peso do cabo de fibra de carbono assegura vantagem desse material em relação aos cabos de aço, pois a economia do peso próprio do cabo pode ser usada para sustentar o elevador e reduzir o consumo de energia.</li><li>Apesar da resistência à tensão ser apenas ligeiramente maior no cabo de fibra de carbono, a vantagem principal de seu uso é a alta relação resistência/peso.</li></ol>
<p>É correto apenas o que se afirma em</p>`,
  opts: ['I.', 'II.', 'I e III.', 'II e IV.', 'III e IV.'],
  com: `<p>O texto diz que a resistência é só "ligeiramente" maior que a do aço, e que o ganho vem do peso sete vezes menor.</p>
<ul><li><b>I – incorreta.</b> Atribui a vantagem à resistência à tração, que é praticamente igual à do aço.</li><li><b>II – incorreta.</b> O texto não aponta flexibilidade como vantagem. As fitas são comparadas a uma régua escolar.</li><li><b>III – correta.</b> A alta resistência específica libera capacidade para a carga útil e reduz o consumo.</li><li><b>IV – correta.</b> A vantagem principal é a relação resistência/peso.</li></ul>` },

{ ano: 2014, n: 14, area: 'comp', gab: 'B',
  stem: `<p>O transporte de um fluido entre dois pontos no interior de um tubo ocorre simultaneamente, com perda de energia, devido ao atrito do fluido com a parede e ao escoamento turbulento. Portanto, quanto maior for a rugosidade da parede da tubulação ou mais viscoso for o fluido, maior será a perda de energia. A forma de determinação do fator de atrito foi estabelecida em 1939, por intermédio da equação de Colebrook-White, apresentada a seguir.</p>
<p class="eq center">${M(`<mfrac><mn>1</mn><msqrt><mi>f</mi></msqrt></mfrac><mo>=</mo><mo>−</mo><mn>2</mn><msub><mi>log</mi><mn>10</mn></msub><mrow><mo>(</mo><mfrac><mi>k</mi><mrow><mn>3,7</mn><mi>D</mi></mrow></mfrac><mo>+</mo><mfrac><mn>2,51</mn><mrow><msub><mi>R</mi><mi>e</mi></msub><msqrt><mi>f</mi></msqrt></mrow></mfrac><mo>)</mo></mrow>`)}</p>
<p>em que f é o fator de atrito de Darcy-Weisbach (adimensional); k é a rugosidade equivalente da parede do tubo (m); D é o diâmetro interno do tubo (m); R<sub>e</sub> é o número de Reynolds (adimensional).</p>
<p>A resolução dessa equação requer um processo iterativo, pois a função é implícita em relação ao fator de atrito (presente nos dois membros da equação). Em 1939, a resolução de equações por procedimentos iterativos demandava excesso de tempo, mas, com o desenvolvimento dos conhecimentos de computação, esse problema foi solucionado.</p>
<p>As etapas de um algoritmo que soluciona a equação, sem ordenação lógica, assim como seu fluxograma são apresentados a seguir.</p>
<p class="list-plain">A) D = 1<br>B) f<sub>0</sub> = 0,03<br>C) Início<br>D) Cálculo de f<sub>1</sub> através da equação de Colebrook-White<br>E) |f<sub>0</sub> − f<sub>1</sub>| &lt; 0,00001<br>F) Término<br>G) R<sub>e</sub> = 10 000<br>H) k = 0,0001<br>I) f<sub>0</sub> = f<sub>1</sub><br>J) Visualização do resultado</p>
${fig('y14_q14.png', 'Fluxograma: 1 terminal, 2 a 5 entradas, 6 processo, 7 decisão com laço por 10 de volta a 6, 8 saída, 9 terminal')}
<p>Com base nessas informações, verifica-se que a solução da equação é obtida pela seguinte associação das etapas do algoritmo com o fluxograma</p>`,
  opts: [seq('CBHGADEJIF'), seq('CHAGBDEJFI'), seq('CGAHBDJEIF'), seq('CABHGDJEFI'), seq('CBGHADEJIF')],
  com: `<p>Associe pela forma de cada bloco:</p>
<ul><li>1 e 9 são terminais: C (Início) e F (Término).</li><li>2 a 5 são entradas de dados. O 5 precisa ser o chute inicial B (f<sub>0</sub>), logo antes do cálculo. Os outros três são H, A e G.</li><li>6 é o processo: D (cálculo de f<sub>1</sub>).</li><li>7 é a decisão: E (teste de convergência).</li><li>10 é o que acontece quando não convergiu: I (f<sub>0</sub> = f<sub>1</sub>), voltando ao 6.</li><li>8 é a saída: J (visualização).</li></ul>
<p>Só a opção B põe B no 5, D no 6, E no 7, J no 8, F no 9 e I no 10.</p>` },

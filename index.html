<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Simulados com questões do Componente Específico do ENADE de Engenharia de Controle e Automação (2014, 2017, 2019 e 2023).">
<style>
*,*::before,*::after{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;font-size:14px;font-family:system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
.fullscreen-link{font-size:.85rem;font-weight:600;color:var(--sel);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
</style>
<title>Simulado ENADE ECA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: coluna única de leitura (≈ 46rem), barra superior fixa com cronômetro; cartão-resposta em grade como na folha do ENADE. */
:root {
  --bg: #EEF1F3;
  --surface: #FFFFFF;
  --surface-2: #F6F8F9;
  --ink: #16212B;
  --muted: #56646F;
  --line: #D2D9DF;
  --line-strong: #A9B5BE;
  --accent: #A35A00;
  --accent-fill: #D98A1C;
  --accent-soft: #FBEBD3;
  --sel: #1D4F7C;
  --sel-soft: #E1ECF6;
  --ok: #1D7445;
  --ok-soft: #DFF1E6;
  --bad: #B0261F;
  --bad-soft: #FAE3E1;
  --fig-bg: #FFFFFF;
  --shadow: 0 1px 2px rgba(22,33,43,.06), 0 4px 14px rgba(22,33,43,.05);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F151A; --surface: #172028; --surface-2: #1C2731; --ink: #E4EAEF; --muted: #98A6B1;
  --line: #2A3641; --line-strong: #44525E; --accent: #F2A946; --accent-fill: #E39A33; --accent-soft: #3A2A12;
  --sel: #8FBDEB; --sel-soft: #1B3149; --ok: #62CB8F; --ok-soft: #143325; --bad: #F08A82; --bad-soft: #3C1A18;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0F151A; --surface: #172028; --surface-2: #1C2731; --ink: #E4EAEF; --muted: #98A6B1;
  --line: #2A3641; --line-strong: #44525E; --accent: #F2A946; --accent-fill: #E39A33; --accent-soft: #3A2A12;
  --sel: #8FBDEB; --sel-soft: #1B3149; --ok: #62CB8F; --ok-soft: #143325; --bad: #F08A82; --bad-soft: #3C1A18;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; }

html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }
.wrap { max-width: 47rem; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px; min-height: 56px; padding-block: 6px; }
.brand { display: flex; flex-direction: column; line-height: 1.05; min-width: 0; margin-right: auto; background: none; border: 0; padding: 0; text-align: left; }
.brand b { font-family: var(--f-display); font-weight: 700; font-size: 1.35rem; letter-spacing: .01em; }
.brand span { font-size: .72rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag { font-family: var(--f-mono); font-size: .72rem; font-weight: 600; border: 1.5px solid var(--accent); color: var(--accent); border-radius: 999px; padding: 1px 8px; letter-spacing: .02em; }
.navbtn { background: none; border: 1px solid transparent; border-radius: 8px; padding: 6px 10px; font-weight: 600; font-size: .92rem; color: var(--muted); }
.navbtn:hover { color: var(--ink); background: var(--surface-2); }
.navbtn[aria-current="page"] { color: var(--ink); border-color: var(--line); }
.timer { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: .95rem; font-weight: 600; padding: 4px 10px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); }

main { padding-block: 24px 64px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; line-height: 1.1; text-wrap: balance; margin: 0; letter-spacing: .005em; }
h1 { font-size: clamp(2rem, 6vw, 2.75rem); }
h2 { font-size: 1.55rem; }
h3 { font-size: 1.2rem; font-weight: 600; }
.eyebrow { font-size: .74rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
.lede { color: var(--muted); max-width: 40rem; margin: 10px 0 0; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 8px; padding: 10px 16px; font-weight: 600; font-size: .98rem; border: 1px solid var(--line-strong); background: var(--surface); }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.primary:hover { opacity: .9; }
.btn.warn { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.btn.warn:hover { background: var(--bad-soft); }
.btn.small { padding: 6px 12px; font-size: .9rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--sel); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

/* home */
.hero { padding-block: 8px 20px; }
.hero-meta { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 14px; font-size: .92rem; color: var(--muted); }
.hero-meta b { color: var(--ink); font-family: var(--f-mono); font-weight: 600; }
.resume { border: 1.5px solid var(--accent-fill); background: var(--accent-soft); border-radius: var(--r); padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.resume .txt { flex: 1 1 16rem; min-width: 0; }
.resume .txt b { display: block; }
.resume .txt span { color: var(--muted); font-size: .92rem; }
.mode { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; }
.mode p { margin: 0; color: var(--muted); }
.mode-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.mode-head .count { font-family: var(--f-mono); font-size: .85rem; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: .9rem; display: inline-flex; gap: 6px; align-items: center; }
.chip .n { font-family: var(--f-mono); font-size: .78rem; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--sel-soft); border-color: var(--sel); color: var(--sel); }
.chip[aria-pressed="true"] .n { color: var(--sel); }
.field { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.field label { font-size: .92rem; color: var(--muted); display: inline-flex; align-items: center; gap: 8px; }
select { font: inherit; font-size: .95rem; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); }
.switch { display: inline-flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; font-size: .95rem; }
.switch .track { width: 40px; height: 22px; border-radius: 999px; background: var(--line-strong); position: relative; transition: background .15s; flex: none; }
.switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); transition: transform .15s; }
.switch[aria-checked="true"] .track { background: var(--ok); }
.switch[aria-checked="true"] .track::after { transform: translateX(18px); }
.note { font-size: .85rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; margin-top: 8px; }

/* quiz */
.qbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.qbar .title { min-width: 0; }
.qbar .title .eyebrow { display: block; }
.qbar .title b { font-family: var(--f-display); font-size: 1.3rem; font-weight: 600; }
.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-bottom: 14px; }
.progress i { display: block; height: 100%; background: var(--accent-fill); transition: width .2s; }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; margin-bottom: 16px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); margin-bottom: 10px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line-strong); display: inline-block; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; }
.cell { position: relative; height: 40px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--surface); font-family: var(--f-mono); font-size: .82rem; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; padding: 0; }
.cell small { font-size: .7rem; color: var(--muted); font-weight: 500; }
.cell.ans { background: var(--sel-soft); border-color: var(--sel); color: var(--sel); }
.cell.ans small { color: var(--sel); }
.cell.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.cell.ok small { color: var(--ok); }
.cell.ko { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.cell.ko small { color: var(--bad); }
.cell.cur { outline: 2px solid var(--ink); outline-offset: 1px; }
.cell.mk::after { content: ""; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent-fill); }

.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.qhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 18px; border-bottom: 1px dashed var(--line-strong); }
.qhead .qn { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; letter-spacing: .03em; text-transform: uppercase; }
.qhead .area { font-size: .8rem; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; }
.qhead .mk { margin-left: auto; }
.qbody { padding: 16px 18px 6px; }
.qbody p { margin: 0 0 12px; }
.qbody ul, .qbody ol { margin: 0 0 12px; padding-left: 1.4em; }
.qbody li { margin-bottom: 4px; }
ol.roman { list-style: upper-roman; padding-left: 2.2em; }
.src { font-size: .82rem; color: var(--muted); text-align: right; }
.list-plain { font-family: var(--f-mono); font-size: .95rem; }
.ov { text-decoration: overline; text-decoration-thickness: 1px; }
.eq { font-family: var(--f-body); font-variant-numeric: tabular-nums; background: var(--surface-2); border-left: 3px solid var(--line-strong); padding: 8px 12px; border-radius: 0 6px 6px 0; }
.eq.center { text-align: center; border-left: 0; border-radius: 6px; font-size: 1.05rem; }
.eq.inline { display: inline-block; margin-top: 6px; }
math { font-size: 1.08em; }
.qfig { margin: 6px 0 14px; background: var(--fig-bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; text-align: center; }
.qfig img { max-width: 100%; height: auto; cursor: zoom-in; display: block; margin: 0 auto; }
.qfig figcaption { font-size: .78rem; color: #3b4650; margin-top: 6px; font-weight: 600; }
pre.code { font-family: var(--f-mono); font-size: .8rem; line-height: 1.45; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 0 0 12px; white-space: pre; }
.qbody .center, p.center { text-align: center; }
.mono { font-family: var(--f-mono); font-size: .88rem; font-variant-numeric: tabular-nums; }
.years { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.yearbtn { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 10px 12px; }
.yearbtn:hover { background: var(--surface-2); border-color: var(--ink); }
.yearbtn b { font-family: var(--f-display); font-size: 1.5rem; line-height: 1; }
.yearbtn span { font-size: .8rem; color: var(--muted); }
.subhead { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.dlist { display: flex; flex-direction: column; gap: 6px; }
.ditem { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 12px; }
.ditem:hover { background: var(--surface-2); border-color: var(--line-strong); }
.ditem .yr { font-family: var(--f-mono); font-size: .8rem; font-weight: 600; color: var(--accent); }
.ditem .tt { font-weight: 600; font-size: .95rem; min-width: 0; }
.ditem .tt small { display: block; font-weight: 400; color: var(--muted); font-size: .8rem; }
.ditem .stt { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); white-space: nowrap; }
.ditem .stt.go { color: var(--sel); } .ditem .stt.done { color: var(--ok); }
.zoomrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .85rem; color: var(--muted); margin-top: 4px; }
.zoomrow .btn { padding: 3px 10px; font-family: var(--f-mono); }
.zoomhint { font-size: .75rem; color: var(--muted); text-align: right; margin: -10px 0 12px; }
.tbl { overflow-x: auto; margin: 0 0 12px; }
.tbl table { border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: .92rem; min-width: 100%; }
.tbl th, .tbl td { border: 1px solid var(--line-strong); padding: 5px 8px; text-align: center; white-space: nowrap; }
.tbl th { background: var(--surface-2); font-weight: 600; }
.tbl table.std th { white-space: normal; }

.opts { display: flex; flex-direction: column; gap: 8px; padding: 6px 18px 18px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; transition: border-color .12s, background .12s; }
.opt:hover:not(:disabled) { border-color: var(--line-strong); background: var(--surface-2); }
.opt .L { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 600; font-size: .85rem; border: 1.5px solid var(--line-strong); }
.opt .T { flex: 1; min-width: 0; padding-top: 2px; }
.opt .T img { max-width: min(100%, 440px); background: var(--fig-bg); border-radius: 4px; padding: 4px; display: block; }
.opt.sel { border-color: var(--sel); background: var(--sel-soft); }
.opt.sel .L { background: var(--sel); border-color: var(--sel); color: var(--surface); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .L { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .L { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.opt:disabled { cursor: default; }
.opt .tagr { margin-left: auto; flex: none; font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding-top: 5px; }
.opt.right .tagr { color: var(--ok); }
.opt.wrong .tagr { color: var(--bad); }

.feedback { margin: 0 18px 18px; border-radius: 8px; padding: 14px 16px; border: 1px solid var(--line); background: var(--surface-2); }
.feedback .verdict { font-weight: 700; margin-bottom: 6px; display: flex; gap: 8px; align-items: center; }
.feedback.ok { border-color: var(--ok); }
.feedback.ok .verdict { color: var(--ok); }
.feedback.ko { border-color: var(--bad); }
.feedback.ko .verdict { color: var(--bad); }
.feedback p { margin: 0 0 8px; }
.feedback ul { margin: 0 0 8px; padding-left: 1.3em; }
.feedback .unoff { font-size: .78rem; color: var(--muted); margin: 8px 0 0; }

.qnav { display: flex; justify-content: space-between; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.qnav .mid { display: flex; gap: 10px; flex-wrap: wrap; }

.confirm { border: 1.5px solid var(--bad); background: var(--bad-soft); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.confirm.neutral { border-color: var(--sel); background: var(--sel-soft); }
.confirm p { margin: 0; }

/* result */
.score { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; box-shadow: var(--shadow); display: grid; grid-template-columns: auto 1fr; gap: 18px 24px; align-items: center; }
.gauge { width: 132px; height: 132px; position: relative; }
.gauge svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.gauge .v { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-family: var(--f-display); font-weight: 700; font-size: 2.2rem; line-height: 1; }
.gauge .v small { display: block; font-size: .8rem; font-family: var(--f-body); color: var(--muted); font-weight: 600; margin-top: 2px; }
.score .facts { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.score .facts .big { font-family: var(--f-display); font-size: 1.6rem; font-weight: 700; }
.score .facts span { color: var(--muted); font-size: .95rem; }
.score .facts span b { color: var(--ink); font-family: var(--f-mono); font-weight: 600; }
@media (max-width: 520px) { .score { grid-template-columns: 1fr; justify-items: start; } }

.areas { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.arow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.arow:last-child { border-bottom: 0; }
.arow .nm { font-size: .95rem; }
.arow .vl { font-family: var(--f-mono); font-size: .85rem; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.arow .bar { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.arow .bar i { display: block; height: 100%; border-radius: 4px; }
.lvl-hi { background: var(--ok); } .lvl-md { background: var(--accent-fill); } .lvl-lo { background: var(--bad); }
.weak { font-size: .78rem; font-weight: 700; color: var(--bad); text-transform: uppercase; letter-spacing: .06em; margin-left: 6px; }

.revlist { display: flex; flex-direction: column; gap: 8px; }
.rev { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.rev > button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: none; border: 0; text-align: left; }
.rev .st { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .85rem; }
.rev .st.ok { background: var(--ok-soft); color: var(--ok); }
.rev .st.ko { background: var(--bad-soft); color: var(--bad); }
.rev .st.na { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.rev .info { flex: 1; min-width: 0; }
.rev .info b { font-family: var(--f-mono); font-size: .9rem; }
.rev .info span { display: block; font-size: .82rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rev .ans { font-family: var(--f-mono); font-size: .85rem; flex: none; text-align: right; }
.rev .chev { flex: none; transition: transform .15s; color: var(--muted); }
.rev[open] .chev { transform: rotate(90deg); }
.rev .inner { border-top: 1px solid var(--line); }
.rev .inner .qcard { border: 0; box-shadow: none; border-radius: 0; }

/* stats */
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.kpi b { display: block; font-family: var(--f-display); font-size: 1.9rem; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi span { font-size: .82rem; color: var(--muted); }
@media (max-width: 460px) { .kpis { grid-template-columns: 1fr 1fr; } .kpis .kpi:last-child { grid-column: 1 / -1; } }

.hist th, .hist td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }

.hist tr:last-child td { border-bottom: 0; }

/* discursiva */

  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(1.6em - 1px), var(--line) calc(1.6em - 1px), var(--line) 1.6em); background-attachment: local; background-position: 0 10px; }

.padrao h4 { margin: 0 0 8px; font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ok); }

.ck .box { flex: none; width: 20px; height: 20px; border-radius: 4px; border: 1.5px solid var(--line-strong); display: grid; place-items: center; margin-top: 2px; font-size: .8rem; font-weight: 700; color: var(--surface); }
.ck[aria-checked="true"] { border-color: var(--ok); }
.ck[aria-checked="true"] .box { background: var(--ok); border-color: var(--ok); }
.ck .pt { margin-left: auto; font-family: var(--f-mono); font-size: .8rem; color: var(--muted); flex: none; padding-left: 8px; }

/* lightbox */

.lb-inner img { margin: auto; max-width: none; width: min(1100px, 160vw); background: #fff; border-radius: 6px; padding: 8px; }
.lb-close { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); background: #fff; color: #111; border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 700; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 8px; font-weight: 600; font-size: .92rem; z-index: 50; box-shadow: 0 6px 20px rgba(0,0,0,.25); }

<script>
/* Banco de questões — ENADE Engenharia de Controle e Automação
   Edição 2023 · Componente Específico
   Gabarito: definitivo do INEP. Comentários: não oficiais. */

const ov = s => `<span class="ov">${s}</span>`;
const fig = (f, alt, cap) => `<figure class="qfig"><img src="img/${f}" alt="${alt}" loading="lazy">${cap ? `<figcaption>${cap}</figcaption>` : ''}</figure>`;
const M = s => `<math>${s}</math>`;
const gc = (k, inner) => M(`<msub><mi>G</mi><mi>c</mi></msub><mo>(</mo><mi>s</mi><mo>)</mo><mo>=</mo><mn>${k}</mn><mrow><mo>(</mo>${inner}<mo>)</mo></mrow>`);
const fr = (a, b) => `<mfrac><mn>${a}</mn><mn>${b}</mn></mfrac>`;
const sinv = `<msup><mi>s</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup>`;

const AREAS = {
  ctrl:  'Controle e sistemas dinâmicos',
  disc:  'Automação discreta (CLP, Grafcet, lógica)',
  flu:   'Pneumática e hidráulica',
  inst:  'Instrumentação e sensores',
  redes: 'Redes industriais e supervisão',
  rob:   'Robótica',
  pot:   'Máquinas elétricas e eletrônica de potência',
  circ:  'Circuitos elétricos',
  comp:  'Computação e sistemas embarcados',
  mec:   'Mecânica, materiais e fenômenos de transporte',
  mat:   'Matemática, estatística e lógica',
  ger:   'Gestão, produção e meio ambiente'
};

const QUESTOES = [
{ ano: 2023, n: 10, area: 'disc', gab: 'B',
  stem: `<p>Suponha que uma empresa utiliza um sistema de manufatura flexível (FMS) em sua produção, empregando uma esteira de transporte (Q2), uma válvula para controle de envase (Q1) e uma bomba de abastecimento (Q3) do tanque de produto. O processo é controlado por um controlador lógico programável (CLP), o qual permite alterar a sequência de controle conforme a demanda de cada produto.</p>
<p>A figura a seguir apresenta uma programação <i>Ladder</i> do processo. Esse programa pode ser convertido em álgebra booleana equivalente.</p>
${fig('q10.png', 'Diagrama Ladder com as linhas 001 a 004 acionando Q1 (válvula), Q2 (motor) e Q3 (bomba)')}
<p>Considerando o programa <i>Ladder</i> apresentado na figura, a equação booleana equivalente de acionamento do motor (Q2) é</p>`,
  opts: [
    `Q2 = ((${ov('I1')} + I2) · (I2 + I4)) · I5`,
    `Q2 = ((${ov('I1')} · I2) + (I2 · I4)) · I5`,
    `Q2 = (I1 · I2) + (I2 · I4) · I5`,
    `Q2 = ((I1 · I2) + (I2 · I4)) + I5`,
    `Q2 = (${ov('I1')} + I2) · (I2 + I4) + I5`
  ],
  com: `<p>As linhas 001 e 002 formam um paralelo que aciona Q1: o contato I1 é normalmente fechado (barrado) em série com I2, em paralelo com I2 em série com I4. Logo Q1 = (${ov('I1')}·I2) + (I2·I4).</p>
<p>A linha 003 aciona Q2 com o contato de Q1 em série com I5: Q2 = Q1·I5 = ((${ov('I1')}·I2) + (I2·I4))·I5. A linha 004 (bomba) não interfere em Q2.</p>` },

{ ano: 2023, n: 11, area: 'pot', gab: 'C',
  stem: `<p>Os motores de passo giram a um deslocamento angular predeterminado em resposta a uma entrada lógica e são encontrados nos controladores de papel em impressoras e em outros equipamentos periféricos de computador, como no posicionamento da cabeça do disco magnético.</p>
<p class="src">RASHID, M. H. <b>Eletrônica de potência.</b> São Paulo: Pearson, 2014 (adaptado).</p>
<p>Considerando esse tipo de motor, avalie as afirmações a seguir.</p>
<ol class="roman"><li>Os motores de passo são máquinas para controle de posição em malha aberta.</li>
<li>Os motores de passo são dispositivos eletromecânicos de movimento, utilizados, principalmente, para converter a informação em formato digital para movimento mecânico.</li>
<li>Para um motor de passo de relutância variável, é necessário apenas inverter o sentido da corrente nos enrolamentos do estator a fim de conseguir a rotação.</li></ol>
<p>É correto o que se afirma em</p>`,
  opts: ['II, apenas.', 'III, apenas.', 'I e II, apenas.', 'I e III, apenas.', 'I, II e III.'],
  com: `<p><b>I – correta.</b> Cada pulso corresponde a um ângulo fixo, então a posição é conhecida contando pulsos, sem realimentação.</p>
<p><b>II – correta.</b> O motor de passo converte uma sequência de pulsos digitais em deslocamento angular discreto.</p>
<p><b>III – incorreta.</b> No motor de relutância variável o torque não depende do sentido da corrente (o rotor busca a posição de menor relutância). A rotação é obtida energizando as fases do estator <i>em sequência</i>. A inversão de corrente é característica dos motores de ímã permanente e híbridos bipolares.</p>` },

{ ano: 2023, n: 12, area: 'inst', gab: 'E',
  stem: `<p>Uma empresa de inovação deseja desenvolver um medidor de temperatura de baixo custo para aplicação em tratores agrícolas, em determinadas temperaturas, para evitar perdas. De acordo com os técnicos responsáveis pelos controles dos processos agrícolas, a faixa de temperatura deve ficar entre 25 °C e 35 °C para se obter maior produtividade e menor perda.</p>
<p>O sensor para a aquisição de dados de temperatura escolhido para desenvolver o medidor foi o LM35, que apresenta a seguinte curva característica.</p>
${fig('q12_f1.png', 'Curva característica do LM35: tensão em mV cresce linearmente com a temperatura, 1200 mV a 120 °C')}
<p>O microcontrolador usado para coletar dados do sensor LM35 e o controle do processo devem ser de 10 bits na conversão A/D e a tensão de alimentação deve ser de 5 V, conforme apresenta a figura 2 a seguir.</p>
${fig('q12_f2.png', 'Esquema: LM35 alimentado em 5 V com saída ligada à entrada A0 de um microcontrolador de 10 bits com VREF de 5 V')}
<p>Considerando as informações apresentadas, é correto afirmar que a resolução e a faixa de medição para esse sistema são, respectivamente,</p>`,
  opts: ['3,22 mV/bit e 2,50 V até 3,50 V.', '3,22 mV/bit e 250 mV até 350 mV.', '4,88 mV/bit e 1,22 V até 1,71 V.', '4,88 mV/bit e 2,50 V até 3,50 V.', '4,88 mV/bit e 250 mV até 350 mV.'],
  com: `<p><b>Resolução:</b> 5 V / 2<sup>10</sup> = 5 V / 1024 ≈ 4,88 mV/bit. O valor 3,22 mV/bit corresponderia a uma referência de 3,3 V, mas o VREF está ligado a 5 V.</p>
<p><b>Faixa:</b> pela curva, o LM35 fornece 10 mV/°C (1200 mV a 120 °C). De 25 °C a 35 °C, a saída vai de 250 mV a 350 mV.</p>` },

{ ano: 2023, n: 13, area: 'redes', gab: 'E',
  stem: `<p>Para normatizar os requisitos de interoperabilidade, interconectividade, portabilidade e escalabilidade em redes de equipamentos eletrônicos, a <i>International Standard Organization</i> (ISO) procurou criar um modelo de arquitetura aberta padrão, baseada em camadas, sendo definido o Modelo de Referência para Interconexão de Sistemas Abertos (<i>Reference Model for Open Systems Interconnection</i> - RM OSI).</p>
<p class="src">AGUIRRE L. A. et al. <b>Enciclopédia de automática: controle e automação</b>, v. 2, 1. ed. São Paulo: Blucher, 2007 (adaptado).</p>
<p>Considerando os protocolos de comunicação industrial, avalie as afirmações a seguir.</p>
<ol class="roman"><li>A camada física tem como função básica a adaptação do sinal ao meio de transmissão e vice-versa.</li>
<li>A camada de enlace tem o objetivo de prover uma conexão confiável sobre um meio físico, sincronizar e empacotar dados.</li>
<li>A camada de aplicação faz a seleção do modo de diálogo, determina a qualidade de serviço aceitável na conexão, identifica futuros parceiros na comunicação, controla o acesso e integridade de dados.</li></ol>
<p>É correto o que se afirma em</p>`,
  opts: ['I, apenas.', 'III, apenas.', 'I e II, apenas.', 'II e III, apenas.', 'I, II e III.'],
  com: `<p><b>I – correta.</b> A camada física trata do meio: níveis elétricos, codificação do sinal, conectores e taxa de transmissão.</p>
<p><b>II – correta.</b> A camada de enlace organiza os bits em quadros, sincroniza, detecta erros e controla o acesso ao meio, oferecendo um enlace confiável entre nós vizinhos.</p>
<p><b>III – correta.</b> A afirmação reproduz a descrição da camada de aplicação dada na referência citada (Aguirre): é a camada que oferece os serviços ao usuário, como identificação de parceiros, qualidade de serviço e controle de acesso. Nas redes industriais (Profibus, Fieldbus etc.) costuma-se usar apenas as camadas 1, 2 e 7.</p>` },

{ ano: 2023, n: 14, area: 'mec', gab: 'D',
  stem: `<p>Considere que, durante a elaboração do projeto de uma esteira transportadora, seja necessário determinar o número de dentes da coroa e a distância entre eixos do sistema de engrenagem.</p>
<p>Considere, ainda, as seguintes características iniciais: o pinhão da correia terá 30 dentes com módulo de 50 mm, gira com velocidade de 900 r.p.m. e acionará uma engrenagem que girará com 500 r.p.m.</p>
<p>Com relação a essa situação hipotética, assinale a opção que apresenta corretamente o número de dentes da coroa e a distância entre eixos.</p>`,
  opts: ['17 dentes e distância de 1 500 mm.', '17 dentes e distância de 2 100 mm.', '54 dentes e distância de 1 500 mm.', '54 dentes e distância de 2 100 mm.', '54 dentes e distância de 2 700 mm.'],
  com: `<p><b>Dentes da coroa:</b> z<sub>1</sub>·n<sub>1</sub> = z<sub>2</sub>·n<sub>2</sub> → z<sub>2</sub> = 30 × 900 / 500 = 54 dentes. Como a coroa gira mais devagar, ela precisa ter mais dentes que o pinhão, o que já elimina 17.</p>
<p><b>Distância entre eixos:</b> a = m (z<sub>1</sub> + z<sub>2</sub>) / 2 = 50 × (30 + 54) / 2 = 2 100 mm.</p>` },

{ ano: 2023, n: 15, area: 'flu', gab: 'B',
  stem: `<p>Considere que um estudante do curso de automação industrial trabalhe como estagiário em uma empresa de sua região. Ao chegar ao seu posto de trabalho, é orientado, por seu supervisor, a automatizar um processo pneumático com três cilindros (atuadores). Para realizar essa atividade, o estudante recebe um formulário com instruções, conforme apresenta o diagrama trajeto-passo a seguir.</p>
${fig('q15.png', 'Diagrama trajeto-passo dos cilindros A, B e C nos passos 1 a 6')}
<p>Com relação a essa situação, assinale a opção que apresenta a sequência correta de acionamentos que descreve o funcionamento do circuito.</p>`,
  opts: ['A+ B+ C+ B− C− A−', 'A+ B+ C+ (B− C−) A−', 'A+ B+ C+ (B− C− A−)', '(A+ B+) C+ B− C− A−', 'A+ (B+ C+) B− C− A−'],
  com: `<p>Lendo o diagrama passo a passo:</p>
<ul><li>1 → 2: A avança (A+).</li><li>2 → 3: B avança (B+).</li><li>3 → 4: C avança (C+).</li><li>4 → 5: B e C recuam <b>ao mesmo tempo</b> (B− C−). Os parênteses indicam movimentos simultâneos.</li><li>5 → 6: A recua (A−).</li></ul>
<p>Sequência: A+ B+ C+ (B− C−) A−.</p>` },

{ ano: 2023, n: 16, area: 'rob', gab: 'D',
  stem: `<p>Considere um robô manipulador, com movimento plano vertical, composto por duas juntas rotacionais e por dois elos (L1 e L2). O robô manipulador tem sua origem em (x0, y0), onde está localizada a primeira junta. Os pontos localizados em (x1, y1) correspondem ao centro da segunda junta. Por fim, os pontos localizados em (x2, y2) definem o centro do efetuador, onde é acoplada a garra para a manipulação dos objetos.</p>
<p>A figura a seguir representa esse robô manipulador.</p>
${fig('q16.png', 'Manipulador planar de dois elos com ângulos θ1 e θ2')}
<p>Considere, ainda, que:</p>
<ul><li>o ângulo θ1 = 30° e o θ2 = 60°;</li><li>o ponto (x2, y2) está localizado em (13, 26), valores expressos em centímetros (cm);</li><li>as dimensões das juntas são desprezadas em relação ao sistema no todo; e</li><li>de acordo com as equações da cinemática direta, podemos obter os comprimentos de L1 e L2.</li></ul>
<p>A partir dessas informações, é correto afirmar que os comprimentos de L1 e L2 são, respectivamente,</p>`,
  opts: ['6,5 cm e 22,5 cm.', '11,25 cm e 13 cm.', '13 cm e 26 cm.', '15 cm e 18,5 cm.', '15 cm e 26 cm.'],
  com: `<p>Cinemática direta do manipulador planar RR:</p>
<p class="eq">x<sub>2</sub> = L1·cos θ1 + L2·cos(θ1 + θ2)<br>y<sub>2</sub> = L1·sen θ1 + L2·sen(θ1 + θ2)</p>
<p>Com θ1 + θ2 = 90°, cos 90° = 0 e sen 90° = 1:</p>
<p class="eq">13 = L1·cos 30° → L1 = 13 / 0,866 ≈ 15 cm<br>26 = 15·0,5 + L2 → L2 = 18,5 cm</p>` },

{ ano: 2023, n: 17, area: 'flu', gab: 'D',
  stem: `<p>Nos processos de automação industrial podem ser utilizados dispositivos elétricos, pneumáticos e hidráulicos. Parâmetros como força, velocidade, precisão e custo devem ser considerados para a otimização de equipamentos e de processos.</p>
<p>O diagrama a seguir apresenta parte de um dispositivo utilizado em um sistema de manufatura flexível (FMS).</p>
${fig('q17.png', 'Circuito pneumático: botão S (válvula 3/2) pilota uma válvula 5/2 que comanda o cilindro X')}
<p>Considerando o diagrama pneumático apresentado, é correto afirmar que, quando acionado o botão S, o dispositivo X</p>`,
  opts: ['não altera o funcionamento da haste e o retorno do botão S se dá por ação pneumática.', 'não altera o funcionamento da haste e o retorno do botão S se dá por ação de mola.', 'recolhe a haste e o retorno do botão S se dá por ação pneumática.', 'recolhe a haste e o retorno do botão S se dá por ação de mola.', 'recolhe a haste e o botão S trava após o acionamento.'],
  com: `<p><b>Botão S:</b> é uma válvula 3/2 normalmente fechada, com acionamento por botão e <b>retorno por mola</b> (símbolo de mola à direita). Isso elimina as opções A, C e E: o botão não trava e o retorno não é pneumático.</p>
<p><b>Efeito sobre X:</b> ao pressionar S, o ar chega ao piloto (A) da válvula 5/2, que comuta e inverte a alimentação das câmaras do cilindro. Na posição de repouso desenhada, a haste está avançada. Com a comutação, a haste recolhe. Assim, o acionamento de S altera o estado da haste, o que elimina a opção B.</p>` },

{ ano: 2023, n: 18, area: 'rob', gab: 'B',
  stem: `<p>Os robôs manipuladores podem ser classificados pela sua estrutura mecânica e forma de seu espaço de trabalho.</p>
<p>A seguir são dadas as sequências das três primeiras juntas de posicionamento, sendo R (rotação) e P (prismático).</p>
<p class="list-plain">1. RRP<br>2. PPP<br>3. RPP<br>4. RRR</p>
<p>Considerando a seguinte ordem de tipos de configuração: Cartesianos, Cilíndricos, Esféricos e Revolução (ou Articulados), correlacione as características das juntas com o tipo de configuração.</p>`,
  opts: ['2 1 3 4', '2 3 1 4', '2 3 4 1', '3 4 1 2', '4 1 2 3'],
  com: `<ul><li><b>Cartesiano:</b> três juntas prismáticas, PPP (2).</li><li><b>Cilíndrico:</b> uma rotação na base e dois eixos lineares, RPP (3).</li><li><b>Esférico (polar):</b> duas rotações e um eixo linear, RRP (1).</li><li><b>Articulado (revolução):</b> três rotações, RRR (4).</li></ul>
<p>Sequência: 2 3 1 4.</p>` },

{ ano: 2023, n: 19, area: 'circ', gab: 'B',
  stem: `<p>Considere que um engenheiro de controle e automação tem em mãos uma fonte de tensão CC cujos dados não estão disponíveis. Realizando alguns testes com duas cargas conectadas a essa fonte, constatou que a primeira carga consumia a potência de 196 W, que a tensão aplicada era de 98 V e que, para a segunda carga, a tensão aplicada caía para 96 V e a potência consumida era de 384 W.</p>
<p>Caso seja conectado um motor CC a essa fonte, cuja corrente nominal é 8 A, qual será a potência consumida na condição nominal?</p>`,
  opts: ['724 W.', '736 W.', '752 W.', '768 W.', '784 W.'],
  com: `<p>Modele a fonte como uma tensão E com resistência interna R: V = E − R·I.</p>
<p class="eq">Carga 1: I = 196 / 98 = 2 A → 98 = E − 2R<br>Carga 2: I = 384 / 96 = 4 A → 96 = E − 4R</p>
<p>Daí R = 1 Ω e E = 100 V. Com 8 A, V = 100 − 8 = 92 V e P = 92 × 8 = 736 W.</p>` },

{ ano: 2023, n: 20, area: 'flu', gab: 'C',
  stem: `<p>Um fabricante de prensas hidráulicas recebeu uma solicitação para projetar e construir elevadores hidráulicos para uma rede de postos de combustíveis, visando-se elevar cargas de até 3 000 kg. Esses dispositivos são constituídos por tubos interligados e preenchidos por um fluido hidráulico confinado entre dois êmbolos cilíndricos com áreas diferentes, conforme mostra a figura a seguir.</p>
${fig('q20.png', 'Elevador hidráulico com êmbolo 1 de 0,1 m e êmbolo 2 de 0,4 m de diâmetro')}
<p>O diâmetro do êmbolo 1 (d1) é de 0,1 m, e a transferência de fluido irá para o êmbolo 2, cujo diâmetro (d2) é de 0,4 m, para levantar-se a massa especificada de 3 000 kg, considerando-se que a aceleração da gravidade é de 9,81 m/s². No projeto, o motor dimensionado forneceu força de pressão igual à massa de 160 kg. Entretanto, durante os testes finais, o peso máximo elevado foi de 2 560 kg, ou seja, as especificações do projeto proposto não atingiram as especificações dadas pelo contratante.</p>
<p>A partir da situação apresentada, avalie as afirmações a seguir, referentes a sugestões para se atingir as especificações dadas pelo contratante.</p>
<ol class="roman"><li>É possível alterar a especificação do motor elétrico, para fornecer 190 kg, sem que sejam alterados os diâmetros dos êmbolos.</li>
<li>É possível alterar o diâmetro do êmbolo 1 para 0,095 m, sem que sejam alteradas as especificações do motor elétrico e o diâmetro do êmbolo 2.</li>
<li>É possível alterar o diâmetro do êmbolo 2 para 0,45 m, sem que sejam alteradas as especificações do motor elétrico e o diâmetro do êmbolo 1.</li></ol>
<p>É correto o que se afirma em</p>`,
  opts: ['I, apenas.', 'II, apenas.', 'I e III, apenas.', 'II e III, apenas.', 'I, II e III.'],
  com: `<p>Pelo princípio de Pascal, F2/F1 = (d2/d1)². Com os valores do projeto: (0,4/0,1)² = 16, e 160 × 16 = 2 560 kg, que é o valor medido no teste.</p>
<p><b>I – correta.</b> 190 × 16 = 3 040 kg ≥ 3 000 kg.</p>
<p><b>II – incorreta.</b> (0,4/0,095)² ≈ 17,7, e 160 × 17,7 ≈ 2 837 kg &lt; 3 000 kg.</p>
<p><b>III – correta.</b> (0,45/0,1)² = 20,25, e 160 × 20,25 = 3 240 kg ≥ 3 000 kg.</p>` },

{ ano: 2023, n: 21, area: 'inst', gab: 'E',
  stem: `<p>Um engenheiro de controle e automação recebeu o diagrama de processo e instrumentação (P&amp;I), conforme apresentado na figura, de uma malha de vazão em um processo industrial. Esse engenheiro será responsável por supervisionar a implementação dessa instrumentação no processo.</p>
${fig('q21.png', 'P&I de malha de vazão com FT 101, FY 101 (raiz quadrada), FIC 101 e válvula FCV 101')}
<p>Após análise do diagrama e considerando que os instrumentos foram identificados pelo nome completo, sinal recebido e transmitido e o local de instalação deles, avalie, as sequências a seguir, relativas a tais instrumentos.</p>
<ol class="roman"><li>FT101 – transmissor de vazão; conexão ao processo/elétrico; montado no campo.</li>
<li>FY101 – extrator de raiz quadrada; elétrico/elétrico; montado entre o campo e o painel.</li>
<li>FIC101 – controlador indicador de vazão; elétrico/elétrico e visual; montado em painel.</li>
<li>FCV101 – válvula controladora de vazão; elétrico/conexão ao processo; montado no campo.</li></ol>
<p>É correto o que se afirma em</p>`,
  opts: ['II, apenas.', 'I e IV, apenas.', 'III e IV, apenas.', 'I, II e III, apenas.', 'I, II, III e IV.'],
  com: `<p>Leitura pela norma ISA 5.1, em que a primeira letra indica a variável (F = vazão) e as seguintes a função:</p>
<ul><li><b>FT101:</b> transmissor de vazão. Recebe o sinal do elemento primário (placa de orifício) pela conexão ao processo e envia sinal elétrico (linha tracejada). Fica no campo.</li>
<li><b>FY101:</b> relé de cálculo com o símbolo √, ou seja, um extrator de raiz quadrada, pois a vazão é proporcional à raiz da pressão diferencial. Recebe e envia sinal elétrico. A banca aceitou a localização descrita.</li>
<li><b>FIC101:</b> controlador indicador de vazão. O traço cheio no círculo indica instrumento em painel acessível ao operador, por isso há saída visual.</li>
<li><b>FCV101:</b> válvula de controle de vazão. Recebe o sinal elétrico do controlador e atua diretamente no processo, no campo.</li></ul>
<p>Todas as afirmações estão corretas.</p>` },

{ ano: 2023, n: 22, area: 'disc', gab: 'D',
  stem: `<p>Uma empresa, sediada em uma região onde a disponibilidade de componentes eletrônicos é restrita, tem em uma das linhas de produção uma máquina que utiliza circuitos integrados com portas lógicas da família TTL. Essa máquina sofreu uma pane, devido a uma descarga elétrica. O técnico da manutenção, após analisar os circuitos, constatou que vários circuitos integrados haviam queimado e que, no almoxarifado, não havia os componentes para substituição, mas, sim, os do circuito integrado da série 7402 (portas NOR). O problema foi encaminhado ao setor de engenharia, que concluiu que a lógica de comando era igual à equação booleana a seguir.</p>
<p class="eq center">Motor = ${ov(`(${ov('B')} + ${ov('D')}) + (${ov('A')} · ${ov('C')})`)}</p>
<p>Utilizando-se somente os circuitos integrados 7402, foi desenvolvido um novo circuito para substituição das portas lógicas originais.</p>
<p>Considerando essa situação, assinale a opção que ilustra a equação booleana que apresenta o mesmo resultado lógico da equação original fornecida.</p>`,
  opts: [{ img: 'q22_A.png' }, { img: 'q22_B.png' }, { img: 'q22_C.png' }, { img: 'q22_D.png' }, { img: 'q22_E.png' }],
  com: `<p>A equação é a NOR de dois termos: Motor = NOR( (${ov('B')}+${ov('D')}) , (${ov('A')}·${ov('C')}) ). Basta montar cada termo só com portas NOR.</p>
<ul><li><b>${ov('A')}·${ov('C')}</b> = ${ov('A + C')} = NOR(A, C): uma porta.</li>
<li><b>${ov('B')}+${ov('D')}</b>: inverta B e D com NORs de entradas unidas, faça NOR(${ov('B')}, ${ov('D')}) = B·D e inverta de novo, obtendo ${ov('B·D')} = ${ov('B')}+${ov('D')}.</li>
<li>Uma NOR final combina os dois termos.</li></ul>
<p>O circuito D tem exatamente essa estrutura: dois inversores (B, D), uma NOR, um inversor, a NOR(A, C) na parte de baixo e a NOR final. O circuito B, por exemplo, não tem o inversor depois da NOR(${ov('B')}, ${ov('D')}), e acaba usando B·D no lugar de ${ov('B')}+${ov('D')}.</p>` },

{ ano: 2023, n: 23, area: 'inst', gab: 'C',
  stem: `<p>Uma barra de aço baixa liga deve receber o tratamento térmico de nitretação, a fim de apresentar maior dureza superficial e, consequentemente, maior resistência ao desgaste. Para que seja obtido esse efeito, necessita-se de aquecimento e controle da temperatura de um forno industrial na faixa de 500 °C a 550 °C na presença de gás nitrogênio. Sabe-se que um termopar, instrumento utilizado para serem realizadas medições de temperatura, foi calibrado a 0 °C.</p>
<p>A figura a seguir apresenta um esquema de ligação de um termopar genérico, em que a junta quente está inserida dentro do forno à temperatura de 500 °C, e a junta fria encontra-se conectada a um cabeçote do lado externo do forno à temperatura de 100 °C. O multímetro utilizado efetua a compensação automática de temperatura ambiente. Ao se realizar a instalação, o termopar ficou distante do multímetro e, como não havia fios/cabos de extensão/compensação, foram utilizados fios elétricos comuns de cobre entre o cabeçote e o multímetro.</p>
${fig('q23.png', 'Termopar no forno a 500 °C, cabeçote a 100 °C ligado por fios de cobre a multímetro a 25 °C')}
<p>A tabela a seguir apresenta a correlação entre a temperatura (°C) e a força eletromotriz (mV) gerada.</p>
<div class="tbl"><table><tr><th>T (°C)</th><td>0</td><td>25</td><td>50</td><td>75</td><td>100</td><td>125</td><td>150</td><td>175</td><td>200</td><td>225</td><td>250</td><td>275</td></tr>
<tr><th>F.E.M. (mV)</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td><td>10</td><td>11</td></tr></table></div>
<div class="tbl"><table><tr><th>T (°C)</th><td>325</td><td>350</td><td>375</td><td>400</td><td>425</td><td>450</td><td>475</td><td>500</td><td>525</td><td>550</td><td>575</td><td>600</td></tr>
<tr><th>F.E.M. (mV)</th><td>13</td><td>14</td><td>15</td><td>16</td><td>17</td><td>18</td><td>19</td><td>20</td><td>21</td><td>22</td><td>23</td><td>24</td></tr></table></div>
<p>Considerando a montagem ilustrada na figura e a tabela apresentada, conclui-se que a temperatura, em °C, registrada no visor do multímetro corresponde a</p>`,
  opts: ['500.', '475.', '425.', '400.', '375.'],
  com: `<p>Os fios de cobre não prolongam o termopar, então a junta de referência passa a ser o cabeçote, a 100 °C.</p>
<p class="eq">FEM gerada = E(500 °C) − E(100 °C) = 20 − 4 = 16 mV</p>
<p>O multímetro compensa apenas a sua própria temperatura ambiente, 25 °C, somando E(25 °C) = 1 mV:</p>
<p class="eq">16 + 1 = 17 mV → 425 °C</p>
<p>O erro de 75 °C vem justamente da falta de cabo de compensação entre o cabeçote e o instrumento.</p>` },

{ ano: 2023, n: 24, area: 'pot', gab: 'A',
  stem: `<p>Os conversores do tipo CC-CC, também denominados <i>choppers</i>, permitem o fornecimento de tensão contínua ajustável a um motor elétrico acionado por corrente contínua.</p>
<p>Uma topologia de circuito empregada para esse propósito é apresentada na figura a seguir.</p>
${fig('q24.png', 'Ponte H com quatro chaves Q1 a Q4 e diodos D1 a D4 alimentando um motor CC')}
<p>Sabe-se que, conforme o sentido da velocidade e do torque produzidos pelo motor CC, podem ser definidos quatro quadrantes de operação.</p>
<p>Com base nessas informações, conclui-se que a topologia apresentada permite</p>`,
  opts: ['a frenagem regenerativa nos sentidos direto e reverso.', 'a operação da máquina CC como motor, e não como gerador.', 'a operação de frenagem dinâmica nos sentidos direto e reverso.', 'o controle de velocidade através do enfraquecimento de campo.', 'a operação como motor no sentido direto, indicado pela polaridade de Va, e não no sentido reverso.'],
  com: `<p>A ponte H completa (quatro chaves com diodos em antiparalelo) inverte tanto a tensão V<sub>a</sub> quanto a corrente i<sub>a</sub>. É um chopper de quatro quadrantes: opera como motor e como gerador nos dois sentidos de rotação.</p>
<p>Operar como gerador com a energia voltando à fonte pelos diodos é a <b>frenagem regenerativa</b>, possível no sentido direto e no reverso.</p>
<ul><li>B e E são falsas porque a ponte não se limita ao modo motor nem a um sentido de rotação.</li><li>C é falsa: a frenagem dinâmica dissipa a energia em um resistor de frenagem, que não existe no circuito.</li><li>D é falsa: o conversor atua na armadura, e não no circuito de campo.</li></ul>` },

{ ano: 2023, n: 25, area: 'disc', gab: 'B',
  stem: `<p>Na figura a seguir, é representado um sistema em que se utiliza um diagrama de comando com duas motobombas, acionadas pelos contatores K1 (motobomba 1) e K2 (motobomba 2).</p>
${fig('q25.png', 'Diagrama de comando com S0, S1, S2 (botoeira dupla), contatores K1 e K2 com contatos de selo')}
<p>A partir da análise do diagrama, assinale a opção correta.</p>`,
  opts: ['A motobomba 2 só pode ser acionada se a motobomba 1 já estiver em operação.', 'Com a motobomba 2 em operação, é possível acionar a motobomba 1, sem se desligar a motobomba 2.', 'Com a motobomba 1 em operação, é possível acionar a motobomba 2, sem se desligar a motobomba 1.', 'O intertravamento indicado garante o acionamento da motobomba 2 sempre que a motobomba 1 for ligada.', 'O intertravamento indicado garante o desligamento da motobomba 2 sempre que a motobomba 1 for desligada.'],
  com: `<p>S0 (NF) é a parada geral. S2 é uma botoeira dupla: o contato NF (1-2) fica em série com K1, e o contato NA (3-4) liga K2. Cada contator tem seu contato de selo (13-14).</p>
<ul><li><b>B – correta.</b> K2 se mantém pelo próprio selo, que não depende de S2 nem de K1. Com K2 ligado, pressionar S1 energiza K1, pois o NF de S2 está fechado. As duas bombas funcionam juntas.</li>
<li><b>C – falsa.</b> Para ligar a bomba 2 é preciso pressionar S2, e isso abre o NF de S2, por onde passa o selo de K1. A bomba 1 desliga.</li>
<li><b>A, D, E – falsas.</b> Não há contato de K1 no ramo de K2, então K2 não depende de K1 nem é comandado por ele.</li></ul>` },

{ ano: 2023, n: 26, area: 'ctrl', gab: 'E',
  stem: `<p>Em uma unidade produtiva, o engenheiro de controle e automação ficará responsável por projetar e implementar um controlador em espaço de estados para uma dada área da planta. Está sob sua posse, o modelo dinâmico do sistema, descrito por uma realização linear em variáveis de estados e invariante no tempo, a saber:</p>
<p class="eq center"><i>ẋ</i>(t) = A<i>x</i>(t) + B<i>u</i>(t)<br><i>y</i>(t) = C<i>x</i>(t) + D<i>u</i>(t)</p>
<p>Considere que esse profissional optará por aplicar uma lei de controle da forma <i>u</i>(t) = −K<i>x</i>(t), em que K é a matriz de ganhos do controlador.</p>
<p>Com base nas informações apresentadas, avalie as afirmações a seguir sobre o sistema em malha fechada.</p>
<ol class="roman"><li>A lei de controle proposta pode ser aplicada desde que o par (A, B) seja controlável.</li>
<li>A representação matemática do sistema em malha fechada é regida pela expressão:<br><span class="eq inline"><i>ẋ</i>(t) = (A − BK)<i>x</i>(t)<br><i>y</i>(t) = (C − DK)<i>x</i>(t)</span></li>
<li>A matriz de ganhos do controlador K deve ser escolhida de tal forma que a matriz do sistema em malha fechada (A − BK) resulte em valores próprios estáveis.</li>
<li>A lei de controle <i>u</i>(t) = −K<i>x̂</i>(t) deve ser aplicada caso os estados não sejam medidos, porém estimados por <i>x̂</i>(t), exigindo que o par (A, C) seja observável.</li></ol>
<p>É correto o que se afirma em</p>`,
  opts: ['I, apenas.', 'II e IV, apenas.', 'III e IV, apenas.', 'I, II e III, apenas.', 'I, II, III e IV.'],
  com: `<p><b>I – correta.</b> A controlabilidade de (A, B) garante que os polos de malha fechada podem ser alocados arbitrariamente por realimentação de estados.</p>
<p><b>II – correta.</b> Substituindo u = −Kx: ẋ = Ax − BKx = (A − BK)x e y = Cx − DKx = (C − DK)x.</p>
<p><b>III – correta.</b> K é projetada para que os autovalores de (A − BK) fiquem no semiplano esquerdo, nas posições desejadas.</p>
<p><b>IV – correta.</b> Quando os estados não são medidos, usa-se um observador (por exemplo, de Luenberger), cujo projeto exige que (A, C) seja observável. A lei passa a ser u = −Kx̂ (princípio da separação).</p>` },

{ ano: 2023, n: 27, area: 'disc', gab: 'A',
  stem: `<p>A figura 1 apresenta um sistema de transferência de peças.</p>
${fig('q27_f1.png', 'Sistema de transferência: esteira M, sensores D1 e D2, cilindro vertical com posições C1 e F1 e dois cilindros horizontais', 'Figura 1: sistema de transferência de peças.')}
<p>Suponha que, por meio de uma esteira M, cheguem peças de tamanhos pequenos e grandes. A dimensão das peças é detectada por dois sensores ópticos (D1 e D2), que são ativados simultaneamente em caso de uma peça grande e, caso a peça seja pequena, somente D2 é ativado. Após a detecção do tamanho da peça, a esteira M é parada, e o cilindro sobe até a posição C1 (caso a peça seja pequena) e F1 (caso a peça seja grande).</p>
<p>Na sequência, para se retirarem as peças, é necessário movimentar os cilindros até o seu avanço correspondente (F2 ou F3). Os sinais responsáveis por avançar os cilindros são A1, A2 e A3 e, para retroceder, são R1, R2 e R3. Caso os cilindros não recebam nenhum sinal para avançar ou retroceder, deve-se considerar que eles fiquem em sua última posição. Deve-se pressionar o botão “início” não só para dar início ao processo, mas também para repetir o processo.</p>
<p>A figura 2 apresenta a descrição do processo em linguagem Grafcet, com uma parte suprimida.</p>
${fig('q27_f2.png', 'Grafcet com passos 0 a 8 e uma parte suprimida após o passo 1', 'Figura 2: descrição do processo em linguagem Grafcet.')}
<p>Considerando as informações sobre o processo e a descrição em linguagem Grafcet, assinale a opção que apresenta a parte suprimida da figura 2.</p>`,
  opts: [{ img: 'q27_A.png' }, { img: 'q27_B.png' }, { img: 'q27_C.png' }, { img: 'q27_D.png' }, { img: 'q27_E.png' }],
  com: `<p>Depois do passo 1 (esteira), o processo segue <b>um</b> de dois caminhos: peça pequena (passos 2–4) ou peça grande (passos 5–7). Isso é uma divergência em <b>OU</b> (seleção de sequência), desenhada com traço simples e com uma transição em cada ramo.</p>
<p>As transições precisam ser mutuamente exclusivas:</p>
<ul><li>peça pequena: só D2 ativo → ${ov('D1')}·D2;</li><li>peça grande: D1 e D2 ativos → D1·D2.</li></ul>
<p>B e C usam traço duplo (divergência em E), que ativaria os dois ramos ao mesmo tempo. D não é exclusiva: com peça grande, D2 também está ativo. E usa C1 e F1, posições que só são atingidas depois, nos passos 2 e 5.</p>` },

{ ano: 2023, n: 28, area: 'ctrl', gab: 'A',
  stem: `<p>A sintonia de controladores PID corresponde à escolha de valores convenientes que atribuam pesos adequados às ações proporcional, integral e derivativa na atuação de um controlador. O critério de Ziegler &amp; Nichols é um método clássico empregado na sintonia de controladores PID. Para sistemas cuja resposta em malha fechada atinja oscilação constante de período T, quando aplicado um ganho puramente proporcional correspondente a K, os valores indicados pelo critério Ziegler &amp; Nichols são os apresentados na tabela a seguir.</p>
<div class="tbl"><table class="std"><thead><tr><th>Tipo de controlador</th><th>Ganho proporcional K<sub>P</sub></th><th>Constante de tempo integral τ<sub>i</sub></th><th>Constante de tempo derivativa τ<sub>d</sub></th></tr></thead>
<tbody><tr><td>P</td><td>0,5 K</td><td>Infinita</td><td>0</td></tr><tr><td>PI</td><td>0,45 K</td><td>0,83 T</td><td>0</td></tr><tr><td>PID</td><td>0,6 K</td><td>0,5 T</td><td>0,125 T</td></tr></tbody></table></div>
<p>Considere um sistema de controle que apresente a característica a seguir, indicada pela representação gráfica do lugar das raízes.</p>
${fig('q28.png', 'Lugar das raízes cruzando o eixo imaginário: ganho 29,4, polo em ±2,21j, frequência 0,35 Hz')}
<p>Com base nas informações apresentadas, qual equação descreve o controlador PI aplicado a esse processo adequadamente sintonizado pelo critério de Ziegler &amp; Nichols?</p>`,
  opts: [
    gc('13,2', `<mn>1</mn><mo>+</mo>${fr('1', '2,4')}${sinv}<mo>+</mo><mn>0,0</mn><mi>s</mi>`),
    gc('14,7', `<mn>1</mn><mo>+</mo>${fr('1', '13,2')}<mi>s</mi><mo>+</mo><mn>17,6</mn><mi>s</mi>`),
    gc('13,2', `<mn>1</mn><mo>+</mo>${fr('1', '2,4')}<mi>s</mi><mo>+</mo><mn>0,06</mn><mi>s</mi>`),
    gc('17,6', `<mn>1</mn><mo>+</mo>${fr('1', '1,4')}<mi>s</mi><mo>+</mo><mn>0,35</mn><mi>s</mi>`),
    gc('13,2', `<mn>1</mn><mo>+</mo><mn>0,7</mn>${sinv}<mo>+</mo><mn>0,0</mn><mi>s</mi>`)
  ],
  com: `<p>No ponto em que o lugar das raízes cruza o eixo imaginário estão o ganho crítico e a frequência de oscilação:</p>
<p class="eq">K = 29,4 · f = 0,35 Hz → T = 1/0,35 ≈ 2,86 s</p>
<p>Para o PI, pela tabela:</p>
<p class="eq">K<sub>P</sub> = 0,45 × 29,4 ≈ 13,2<br>τ<sub>i</sub> = 0,83 × 2,86 ≈ 2,4 s · τ<sub>d</sub> = 0</p>
<p>G<sub>c</sub>(s) = K<sub>P</sub>(1 + 1/(τ<sub>i</sub>s) + τ<sub>d</sub>s) = 13,2(1 + (1/2,4)s<sup>−1</sup> + 0,0s). Atenção: o termo integral é s<sup>−1</sup>, e não s, o que elimina C.</p>` },

{ ano: 2023, n: 29, area: 'ctrl', gab: 'C',
  stem: `<p>Considere um dispositivo mecânico que apresenta comportamento dinâmico semelhante ao de um sistema constituído de um corpo sólido, de massa ideal, interligado a uma mola e um amortecedor, também ideais, dispostos paralelamente e conectados a um aparato fixo.</p>
<p>A partir de um dado instante de tempo, o sistema, em repouso e com o corpo na posição de origem (x=0), é submetido a uma força na forma de um degrau unitário.</p>
<p>Considere, ainda, que a unidade de medição da força é representada por N.</p>
<p>O deslocamento do conjunto massa, mola e amortecedor pode ser observado na figura a seguir.</p>
${fig('q29.png', 'Resposta ao degrau unitário: pico de cerca de 1,29 m perto de 2,4 s, valor final 1 m')}
<p>Acerca do comportamento dinâmico do referido sistema, avalie as afirmações a seguir.</p>
<ol class="roman"><li>O tempo de pico está entre 2 e 3 s.</li><li>O ganho do sistema é de 0,9 m/N.</li><li>O tempo de subida está entre 2 e 3 s.</li><li>O máximo sobressinal está entre 0,2 m e 0,4 m.</li><li>A dinâmica corresponde à de um sistema linear de primeira ordem.</li></ol>
<p>É correto apenas o que se afirma em</p>`,
  opts: ['III.', 'I e II.', 'I e IV.', 'IV e V.', 'II, III, V.'],

{ ano: 2023, n: 30, area: 'mec', gab: 'A',
  stem: `<p>Um sistema de condicionamento de ar é utilizado para manter a temperatura interna de um quarto a 23 °C no verão. Nessas condições, um estudante de engenharia fez diversas medidas da temperatura superficial interna de uma parede que compõe o quarto, alcançando um valor médio de 27 °C. A parede avaliada apresenta as seguintes dimensões: 5 m de comprimento e 4 m de altura.</p>
<p>Considerando-se que, no interior do referido quarto, o coeficiente convectivo corresponde a 5 W/(m²·K) e desprezando-se os efeitos da radiação nesse ambiente, conclui-se que a taxa de transferência de calor que passa pela mencionada parede é de</p>`,

  com: `<p>Lei do resfriamento de Newton (convecção):</p>

{ ano: 2023, n: 31, area: 'ctrl', gab: 'A',
  stem: `<p>A figura a seguir representa uma máquina de corrente contínua e é seguida por um conjunto de equações elétricas, obtido pela análise dos circuitos de campo e de armadura e, ainda, um conjunto de equações mecânicas mostradas (todas no domínio do tempo).</p>
${fig('q31.png', 'Circuitos de campo (Vf, Rf, Lf) e de armadura (Va, Ra, La, ea) de uma máquina CC com inércia J e atrito B', 'Figura - Circuitos de campo e armadura de uma máquina de corrente contínua.')}
<p>Para o controle adequado, é comum que os profissionais da área de Engenharia obtenham a função de transferência dos sistemas.</p>
<p>Considerando as informações apresentadas e a situação em que o profissional opte pelo controle do motor através da atuação no circuito de armadura, mantendo a corrente de campo constante e desconsiderando as não linearidades do circuito magnético (fluxo linear), em relação à função de transferência, assinale a opção que apresenta o diagrama de blocos correspondente a tal escolha.</p>`,
  opts: [{ img: 'q31_A.png' }, { img: 'q31_B.png' }, { img: 'q31_C.png' }, { img: 'q31_D.png' }, { img: 'q31_E.png' }],
  com: `<p>Com o campo constante, as equações no domínio de Laplace são:</p>
<p class="eq">V<sub>a</sub> − E<sub>a</sub> = (R<sub>a</sub> + sL<sub>a</sub>) I<sub>a</sub> · T<sub>em</sub> = K<sub>m</sub> I<sub>a</sub><br>T<sub>em</sub> = (Js + B) Ω · E<sub>a</sub> = K<sub>b</sub> Ω · θ = Ω / s</p>
<p>O diagrama tem o bloco elétrico da armadura com K<sub>m</sub>/(R<sub>a</sub>+sL<sub>a</sub>), seguido da mecânica 1/(Js+B), que dá Ω, e do integrador 1/s, que dá θ. A força contraeletromotriz K<sub>b</sub>·Ω volta subtraindo de V<sub>a</sub>. É a opção A.</p>
<ul><li>B usa o circuito de campo (R<sub>f</sub>+sL<sub>f</sub>).</li><li>C não tem a realimentação da fcem.</li><li>D troca a dinâmica mecânica por elementos do campo.</li><li>E realimenta a posição θ, e não a velocidade.</li></ul>` },

{ ano: 2023, n: 32, area: 'disc', gab: 'C',
  stem: `<p>O diagrama a seguir apresenta uma programação de um controlador lógico programável (CLP) em linguagem <i>Ladder</i> em que as saídas Q 0.0, Q 0.1 e Q 0.2 acionam três válvulas pneumáticas para a aplicação em diferentes tarefas no processo.</p>
${fig('q32.png', 'Ladder com três linhas acionando Q 0.0, Q 0.1 e Q 0.2')}
<p>Após a execução do ciclo, conforme mostrado no diagrama (com todas entradas em nível baixo na entrada do CLP) e após a realização da varredura nas entradas, observou-se que I0.0 e I0.1 alteraram seus <i>status</i> devido ao nível alto na entrada do CLP.</p>
<p>Com base na situação e no diagrama apresentados, verifica-se que apenas</p>`,
  opts: ['a saída Q 0.0 permanece acionada.', 'as saídas Q 0.0 e Q 0.1 permanecem acionadas.', 'as saídas Q 0.0 e Q 0.2 permanecem acionadas.', 'as saídas Q 0.1 e Q 0.2 permanecem acionadas.', 'as saídas Q 0.0, Q 0.1 e Q 0.2 permanecem acionadas.'],
  com: `<p><b>Ciclo inicial (todas as entradas em 0).</b> Os contatos NF estão fechados.</p>
<ul><li>Linha 1: I0.0, I0.1 e I0.2 (NF) fechados → Q0.0 = 1.</li><li>Linha 2: I0.3 e I0.4 (NF) fechados. I0.5 (NA) está aberto, mas o paralelo I0.1 (NF) está fechado → Q0.1 = 1.</li><li>Linha 3: I0.6 e I0.2 (NF) fechados. I0.7·I0.1 (NA) estão abertos, mas o selo Q0.0 está fechado → Q0.2 = 1.</li></ul>
<p><b>Com I0.0 = I0.1 = 1:</b></p>
<ul><li>Linha 1: os NF de I0.0 e I0.1 abrem, mas o selo Q0.0, em paralelo com eles, mantém a saída → <b>Q0.0 = 1</b>.</li><li>Linha 2: I0.5 continua aberto e o NF de I0.1 abriu → <b>Q0.1 = 0</b>.</li><li>Linha 3: o selo Q0.0 continua fechado → <b>Q0.2 = 1</b>.</li></ul>` },

{ ano: 2023, n: 33, area: 'redes', gab: 'E',
  stem: `<p>Na automação, a sigla SCADA (<i>Supervisory Control And Data Acquisition</i>) refere-se a sistemas de supervisão, controle e aquisição de dados. Um sistema supervisório destina-se a capturar informações sobre um processo de produção e armazená-las em um banco de dados. As informações vêm de sensores que capturam dados específicos (conhecidos como variáveis de processo) da planta industrial. O sistema SCADA é caracterizado por possuir, separadamente, o elemento de controle, normalmente um PLC (<i>Programmable Logic Controller</i> ou Controlador Lógico Programável), e o elemento de supervisão, geralmente um computador com um software supervisório. A supervisão de um processo com o sistema SCADA ocorre por meio da leitura de variáveis de processos no campo. Os valores dessas variáveis são associados a objetos do sistema chamados <i>Tags</i>.</p>
<p>Considerando a utilização da referida tecnologia para supervisão de sistemas industriais, avalie as afirmações a seguir.</p>
<ol class="roman"><li>No sistema de supervisão, podem existir dois tipos de objetos de alarme, o sumário e o histórico.</li>
<li>A medição dos estados é feita automaticamente, em tempo real, por equipamentos como controladores programáveis, unidades de aquisição, terminais remotos e dispositivos eletrônicos inteligentes.</li>
<li>O Tag tipo PLC é usado na troca de informações com os equipamentos de aquisição de dados utilizando drivers de I/O de acordo com o tipo do equipamento.</li></ol>
<p>É correto o que se afirma em</p>`,
  opts: ['I, apenas.', 'III, apenas.', 'I e II, apenas.', 'II e III, apenas.', 'I, II e III.'],
  com: `<p><b>I – correta.</b> Os supervisórios oferecem o objeto de alarme <i>sumário</i>, com os alarmes ativos ou não reconhecidos, e o <i>histórico</i>, com o registro de eventos já ocorridos.</p>
<p><b>II – correta.</b> A aquisição é feita no campo por CLPs, UTRs (RTUs), unidades de aquisição e IEDs, de forma automática e em tempo real.</p>
<p><b>III – correta.</b> As tags de comunicação (tipo PLC) leem e escrevem nos equipamentos por meio do driver de I/O específico de cada fabricante ou protocolo.</p>` },

{ ano: 2023, n: 34, area: 'mec', gab: 'A',
  stem: `<p>Em uma análise da estática dos corpos rígidos, a resultante das forças a eles aplicada é nula. Entre as forças que são analisadas, incluem-se as de reações de apoio, responsáveis pelo contato do corpo, dentro da estrutura, com pontos como solo e vigas, de modo a se assegurar o equilíbrio estático.</p>
<p>A figura a seguir apresenta uma viga biapoiada.</p>
${fig('q34.png', 'Viga com apoio A na extremidade esquerda e B a 4,5 m; cargas de 75 kN a 1,5 m e de 30 kN a 5,5 m e 6,5 m')}
<p>Com base na figura, conclui-se que o valor da força de apoio da viga no ponto A corresponde a</p>`,
  opts: ['30 kN.', '60 kN.', '75 kN.', '105 kN.', '135 kN.'],
  com: `<p>Posições a partir de A: carga de 75 kN em 1,5 m; apoio B em 4,5 m; cargas de 30 kN em 5,5 m e 6,5 m (balanço).</p>
<p>Somatório de momentos em relação a B (anti-horário positivo):</p>
<p class="eq">R<sub>A</sub>·4,5 = 75·3,0 − 30·1,0 − 30·2,0 = 225 − 90 = 135<br>R<sub>A</sub> = 30 kN</p>
<p>Verificação: R<sub>B</sub> = 135 − 30 = 105 kN, e R<sub>A</sub> + R<sub>B</sub> = 135 kN, igual à soma das cargas.</p>` },

{ ano: 2023, n: 35, area: 'mat', gab: 'C',
  stem: `<p>Em um sistema de classificação de animais, três características são utilizadas para o armazenamento dos dados: tipo da espécie, cor do animal e ações realizadas.</p>
<p>Considere que, para cada característica, existem os seguintes conjuntos:</p>
<ul><li>tipos: {T1 e T2}</li><li>cores: {C1, C2 e C3}</li><li>ações: {A1, A2 e A3}</li></ul>
<p>Considere, ainda, que as seguintes premissas foram assumidas como verdadeiras para o desenvolvimento de uma rotina de sistema para classificar um animal p.</p>
<ul><li>Se p é T1, p possui a cor C1 e p possui a cor C2.</li><li>Se p é T2, p possui a cor C2 e p possui a cor C3.</li><li>Se p possui a cor C3, p realiza A2.</li></ul>
<p>Ao catalogar três animais, x, y e z, foi possível identificar as seguintes características:</p>
<ul><li>x é classificado como T1;</li><li>y é classificado como T2;</li><li>z é capaz de realizar a ação A2.</li></ul>
<p>Com base nas informações sobre conjuntos de características, animais catalogados e nas premissas assumidas, avalie as afirmações a seguir.</p>
<ol class="roman"><li>z possui a cor C3.</li><li>x e y possuem a cor C2.</li><li>y é incapaz de realizar a ação A2.</li></ol>
<p>É correto o que se afirma em</p>`,
  opts: ['I, apenas.', 'III, apenas.', 'I e II, apenas.', 'II e III, apenas.', 'I, II e III.'],
  com: `<p><b>II – correta.</b> x é T1, então tem C2. y é T2, então tem C2.</p>
<p><b>III – incorreta.</b> y é T2, então tem C3 e, portanto, realiza A2.</p>
<p><b>I – considerada correta pela banca.</b> Atenção: pela lógica estrita, "se C3 então A2" não permite concluir que quem realiza A2 tem C3 (seria a falácia da afirmação do consequente). Como "II, apenas" não está entre as opções, o gabarito oficial (C) supõe que, nesse sistema, só animais de cor C3 realizam A2. Esse é um bom ponto para discutir em aula.</p>` },

{ ano: 2023, n: 36, area: 'inst', gab: 'C',
  stem: `<p><b>TEXTO 1</b></p>
<p>O extensômetro, ou <i>strain gauge</i>, é um dispositivo que é posicionado na superfície de uma peça para mensurar a deformação diante da aplicação de um carregamento. É muito utilizado para a verificação dos níveis de tensão atuante diante da condição de operação de um equipamento ou máquina.</p>
<p><b>TEXTO 2</b></p>
<p>A tecnologia de <i>strain gauge</i> mais firmemente estabelecida é empregada nos <i>strain gauges</i> piezorresistivos, usados para se adquirir valores de tensão medindo a mudança relativa na resistividade elétrica.</p>
<p>A figura a seguir apresenta um extensômetro.</p>
${fig('q36_f1.png', 'Extensômetro com base, terminais de solda e grade do elemento resistivo')}
<p class="src">Disponível em: https://www.hbm.com/pt/7834/as-tecnologias-eletrica-e-optica-de-strain-gauges/. Acesso em: 21 jun. 2023 (adaptado).</p>
<p><b>TEXTO 3</b></p>
<p>As células de carga são frequentemente instaladas não só em balanças, mas também em, por exemplo, sistemas para envase de garrafas e latas por meio de pesagem, com uma célula de carga em cada ponto de medição e em sistemas de classificação para distribuição de doces ou batatas em sacos, para que todos tenham o mesmo peso no final do processo de produção.</p>
<p>Há, também, usos “incomuns”, como em desenvolvimento de vestuários e roupas de banho de alta performance para triátlon, em que se mede a resistência da água nos trajes de nadadores de classe mundial.</p>
<p class="src">Disponível em: https://www.hbm.com/pt/6768/como-uma-celula-de-carga-trabalha/. Acesso em: 21 jun. 2023 (adaptado).</p>
<p>Diante do contexto abordado nos textos e com base nos conhecimentos de Física associados ao fenômeno da resistividade elétrica, da ciência dos materiais e de circuitos elétricos, avalie as afirmações a seguir.</p>
<ol class="roman"><li>O fio resistivo mostrado na figura ilustrada no texto 2 altera sua resistência de acordo com o “alongamento” da superfície em que está colocado.</li>
<li>Considerando-se o sentido de deformação para o qual foi projetado, o extensômetro aumenta a resistência quando é submetido a uma compressão.</li>
<li>A prata é um condutor elétrico melhor que o cobre, considerando-se os dados de resistividade dos materiais condutores cobre (1,7×10<sup>−8</sup> Ω·m) e prata (1,6×10<sup>−8</sup> Ω·m).</li>
<li>O circuito conhecido como Ponte de Wheatstone, muito utilizado em conjunto com os extensômetros, cuja relação de conversão é dada por V<sub>M</sub>, em que R<sub>1</sub> representa a resistência variável do <i>strain gauge</i>, está corretamente representado a seguir.</li></ol>
${fig('q36_f2.png', 'Ponte de Wheatstone com R1, R2, R3, R4 e a expressão VM = V(R1/(R1+R2) − R4/(R3+R4))')}
<p>É correto apenas o que se afirma em</p>`,
  opts: ['I.', 'IV.', 'I e III.', 'II e III.', 'II e IV.'],
  com: `<p><b>I – correta.</b> R = ρL/A. Ao ser tracionado, o fio alonga e tem a seção reduzida, e a resistência aumenta.</p>
<p><b>II – incorreta.</b> Na compressão o fio encurta e a seção aumenta, então a resistência <i>diminui</i>.</p>
<p><b>III – correta.</b> Menor resistividade significa melhor condutor: a prata (1,6×10<sup>−8</sup>) conduz melhor que o cobre (1,7×10<sup>−8</sup>).</p>
<p><b>IV – incorreta.</b> No circuito desenhado, R1 e R3 formam o divisor do nó B, e R2 e R4 o do nó C. A expressão correta seria V<sub>M</sub> = V(R3/(R1+R3) − R4/(R2+R4)), e não a indicada.</p>` },

{ ano: 2023, n: 37, area: 'ger', gab: 'C',
  stem: `<p>A análise de oferta e de demanda de produtos é de fundamental importância para o entendimento elementar do funcionamento do mercado consumidor. O preço de um produto na economia de mercado é determinado tanto pela oferta quanto pela procura.</p>
<p>O gráfico a seguir ilustra curvas de demanda (D<sub>1</sub>, D<sub>2</sub> e D<sub>3</sub>) interceptadas pela curva de oferta O<sub>1</sub>. O ponto (Q<sub>0</sub>, P<sub>0</sub>) representa o ponto de equilíbrio dado pela intersecção da curva de demanda D<sub>2</sub> com a curva de oferta O<sub>1</sub>. Os eixos representam a quantidade (Q) e o preço (P).</p>
${fig('q37.png', 'Curvas de demanda D1, D2 e D3 e curva de oferta O1, com equilíbrio em Q0, P0')}
<p class="src">PINHO, D. B.; VASCONCELLOS, M. A. S. <b>Manual de Economia</b>. 5. ed. Local: Saraiva, 2004 (adaptado).</p>
<p>Com base nessas informações, considere que um fator externo provoque um aumento de renda real dos consumidores e que, consequentemente, ocorra uma mudança da curva de demanda, obtendo-se, assim, um novo ponto de equilíbrio (Q<sub>X</sub>, P<sub>X</sub>) para esse mercado.</p>
<p>Nesse caso, as condições que representam o novo ponto de equilíbrio (Q<sub>X</sub>, P<sub>X</sub>) são</p>`,
  opts: ['Q<sub>X</sub> &lt; Q<sub>0</sub> ; P<sub>X</sub> &gt; P<sub>0</sub>', 'Q<sub>X</sub> &gt; Q<sub>0</sub> ; P<sub>X</sub> &lt; P<sub>0</sub>', 'Q<sub>X</sub> &gt; Q<sub>0</sub> ; P<sub>X</sub> &gt; P<sub>0</sub>', 'Q<sub>X</sub> &lt; Q<sub>0</sub> ; P<sub>X</sub> &lt; P<sub>0</sub>', 'Q<sub>X</sub> = Q<sub>0</sub> ; P<sub>X</sub> = P<sub>0</sub>'],
  com: `<p>Para um bem normal, o aumento da renda real desloca a demanda para a direita (de D<sub>2</sub> para D<sub>3</sub>). Com a oferta O<sub>1</sub> crescente, o novo cruzamento ocorre com <b>maior quantidade e maior preço</b>: Q<sub>X</sub> &gt; Q<sub>0</sub> e P<sub>X</sub> &gt; P<sub>0</sub>.</p>` },

{ ano: 2023, n: 38, area: 'circ', gab: 'D',
  stem: `<p>Os resistores são dispositivos de circuitos elétricos utilizados para se limitar a corrente elétrica em um circuito, por apresentarem a propriedade da resistência elétrica, que é a capacidade de um corpo qualquer se opor à passagem de corrente elétrica. Diversos materiais podem ser utilizados como resistores, como níquel-cromo, carbono e grafite.</p>
<p>Diante dessas informações, suponha que se pretenda construir resistores cilíndricos, na forma da figura a seguir, para serem utilizados em um circuito de corrente contínua com fonte de tensão igual a 12 V. Considere L o comprimento do material e A sua área de seção transversal.</p>

<tbody><tr><td>Carbono</td><td>40,00</td><td>1,00</td><td>2,50</td></tr><tr><td>Grafite</td><td>13,00</td><td>1,50</td><td>1,50</td></tr><tr><td>Níquel-cromo</td><td>1,10</td><td>5,00</td><td>0,50</td></tr></tbody></table></div>
<p>A partir dessas informações, conclui-se que, para se obter a configuração de resistores viável para se ter corrente menor que 300 mA, é necessário utilizar apenas</p>`,
  opts: ['2 resistores de grafite em série.', '2 resistores de grafite em paralelo.', '2 resistores de carbono em paralelo.', '3 resistores de carbono em série.', '3 resistores de níquel-cromo em série.'],
  com: `<p>Para I &lt; 0,3 A com 12 V, é preciso R &gt; 12 / 0,3 = 40 Ω.</p>
<p class="eq">Carbono: 40 × 1 / 2,5 = 16 Ω<br>Grafite: 13 × 1,5 / 1,5 = 13 Ω<br>Níquel-cromo: 1,1 × 5 / 0,5 = 11 Ω</p>
<ul><li>A: 26 Ω → 0,46 A</li><li>B: 6,5 Ω</li><li>C: 8 Ω</li><li><b>D: 48 Ω → 0,25 A ✓</b></li><li>E: 33 Ω → 0,36 A</li></ul>` }
];

{ ano: 2023, n: 'D2', area: 'ctrl', titulo: 'Controle em cascata de máquina CC',
  stem: `<p>O controle de velocidade de uma máquina de corrente contínua (CC) de ímãs permanentes geralmente é realizado utilizando-se uma estrutura de controle em cascata. Tem-se uma malha interna de controle da corrente de armadura (I<sub>a</sub>) que utiliza um controlador proporcional e uma malha externa de velocidade (ω) que utiliza um controlador proporcional-integral.</p>
<p>A figura 1 mostra o diagrama esquemático desse controle, em que: L<sub>a</sub> é a indutância de armadura; R<sub>a</sub>, a resistência de armadura; Kφ, uma constante da máquina; J, a inércia; V<sub>a</sub>, a tensão de armadura; E<sub>a</sub>, a força contraeletromotriz; T<sub>e</sub>, o torque eletromagnético da máquina e T<sub>L</sub>, um torque de perturbação externo ao processo.</p>
${fig('d2_f1.png', 'Diagrama de blocos do controle em cascata: PI de velocidade, P de corrente e dinâmica da máquina CC', 'Figura 1 - Diagrama esquemático do controle de uma máquina CC.')}
<p>Geralmente, em sistemas de controle em cascata, ajusta-se, primeiro, a malha interna e, posteriormente, a malha externa, de modo que esta seja bem mais lenta que aquela.</p>
<p>A figura 2 mostra um exemplo da resposta em frequência das malhas fechadas de corrente (malha interna) e de velocidade (malha externa) para o ajuste de controladores de um acionamento com um motor CC de 5 cv.</p>
${fig('d2_f2.png', 'Diagramas de Bode das malhas fechadas: corrente com corte perto de 1 kHz e fase até −90°; velocidade com pico de cerca de 15 dB perto de 25 Hz e fase até −180°', 'Figura 2 - Resposta em frequência.')}
<p>Considerando a teoria de controle, faça o que se pede nos itens a seguir, a respeito do problema de controle apresentado.</p>`,
  itens: [
    { id: 'a', txt: 'Deseja-se que a resposta do controle de corrente a uma mudança da referência em degrau não apresente sobressinal (<i>overshoot</i>) e que o tempo de assentamento (2%) seja menor que 3 ms. Com base na resposta em frequência mostrada na figura 2, explique se esses critérios serão atendidos. (valor: 5,0 pontos)',
      padrao: `<p>Para acertar esta questão, o estudante deve analisar a resposta em frequência da malha de corrente observando que ela se aproxima de uma função de primeira ordem. Isso pode ser obtido também se o estudante derivar a função de transferência de malha fechada da corrente (mas esse não é um item obrigatório para resolução da questão). Sendo assim, tem-se uma resposta sem sobressinal, como requerido.</p>

{ ano: 2019, n: 14, area: 'mec', gab: 'D',
  stem: `<p>Uma esteira de transporte instalada em uma célula produtiva possui um sistema de tração com redução, conforme a figura. A esteira utiliza um cilindro de tração acoplado ao eixo de saída da caixa por flanges, para que não ocorra perda de potência no acoplamento. A fábrica que utiliza este sistema passa por uma reestruturação e, devido à alteração do <i>layout</i>, decidiu-se utilizar a esteira para transporte de produtos acabados.</p>

<p>Acerca das variáveis de controle X, Y e Z, é correto afirmar que</p>`,
